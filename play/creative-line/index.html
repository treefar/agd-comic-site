<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>創作不斷線</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0f0d0a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #fit { position: relative; flex: none; }
  /* 600x900 的邏輯畫面，整塊等比縮放；只有這塊限制觸控預設行為，頁面其他地方仍可捲動 */
  #world { position: absolute; left: 0; top: 0; width: 600px; height: 900px; transform-origin: 0 0; overflow: hidden;
           touch-action: none; user-select: none; -webkit-user-select: none; background: #0f0d0a;
           font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  #world img { position: absolute; display: block; -webkit-user-drag: none; pointer-events: none; }
  .t { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 900; color: #0f0d0a;
       -webkit-text-stroke: var(--sw, 6px) #f4ecd8; paint-order: stroke fill; pointer-events: none; text-align: center; }
  .t.plain { -webkit-text-stroke: 0; font-weight: 700; white-space: normal; }
  .btn { position: absolute; transform: translate(-50%, -50%); padding: 0; border: 0; background: none; cursor: pointer; font: inherit; }
  .btn img { position: static !important; width: 100%; height: 100%; }
  .btn span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900;
              color: #0f0d0a; -webkit-text-stroke: 4px #f4ecd8; paint-order: stroke fill; pointer-events: none; }
  .btn.red span { color: #fff; -webkit-text-stroke: 5px #0f0d0a; }
  .btn:focus-visible { outline: 4px solid #1d4ed8; outline-offset: 2px; }
  .layer { position: absolute; inset: 0; }
  .hide { display: none !important; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             color: #f4ecd8; font: 900 20px 'Noto Sans TC', sans-serif; }
</style>
</head>
<body>
<div id="loading">載入中… Loading…</div>
<div id="fit"><div id="world" tabindex="0" aria-label="創作不斷線 遊戲畫面"></div></div>
<script src="routes.js"></script>
<script src="masks.js"></script>
<script src="game.js"></script>
</body>
</html>
