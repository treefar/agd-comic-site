<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>創作不斷線</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
  /* 介面比照《六樓出口》：米色紙卡、黑邊、錯位陰影的純文字按鈕（使用者 2026-10-21 於對話選擇，見 ui-art-manifest.json） */
  :root { --paper: #f4ecd8; --ink: #0f0d0a; --red: #e63946; --blue: #1d4ed8; --pop: #ffd60a; --accent: #34d27a; }
  html, body { margin: 0; height: 100%; background: #07090a; overflow: hidden; color: var(--paper); }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
  #fit { position: relative; flex: none; }
  #world { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #000;
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #world img { position: absolute; display: block; pointer-events: none; -webkit-user-drag: none; }
  .layer { position: absolute; inset: 0; }
  .hide { display: none !important; }
  .scene { position: absolute; inset: 0; transform-origin: 50% 60%; transition: filter .3s; }
  .scene img.bg { width: 1280px; height: 720px; left: 0; top: 0; }
  svg.ov { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; overflow: visible; }
  .orb, .ghost, .after, .goal { left: 0; top: 0; will-change: transform; }
  .goal { opacity: .55; animation: goalPulse 1.2s ease-in-out infinite; }
  @keyframes goalPulse { 50% { opacity: .9; } }
  .frameflash { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 3px solid var(--paper); box-shadow: 0 0 0 2px var(--ink); opacity: 0; pointer-events: none; }
  /* HUD */
  .hud { position: absolute; left: 18px; right: 18px; top: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .tag { background: var(--ink); color: var(--paper); border: 2px solid var(--paper); padding: 6px 12px; font-weight: 900; font-size: 22px; letter-spacing: .06em; }
  .stat { text-align: right; font-weight: 900; font-size: 22px; color: var(--paper); text-shadow: 0 0 6px #000, 0 2px 0 #000; font-variant-numeric: tabular-nums; }
  .inkbar { margin-top: 8px; width: 260px; height: 16px; border: 3px solid var(--ink); background: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
  .inkbar i { display: block; height: 100%; background: var(--ink); transition: width .1s, background .2s; }
  .inkbar.low i { background: var(--red); }
  .inkbar.shake { animation: inkShake .083s linear infinite; }
  @keyframes inkShake { 50% { transform: translateX(1.5px); } }
  .rule, .toast { position: absolute; left: 50%; transform: translateX(-50%); background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
          padding: 8px 16px; font-weight: 900; font-size: 22px; white-space: nowrap; pointer-events: none; }
  .rule { bottom: 22px; }
  .toast { top: 80px; background: var(--ink); color: var(--paper); border-color: var(--paper); box-shadow: none; }
  .pauseL { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .pauseL div { background: rgba(15,13,10,.82); color: var(--paper); padding: 14px 26px; font-weight: 900; font-size: 30px; border: 2px solid var(--paper); }
  /* 文字按鈕（比照六樓出口 .go／.card button） */
  .tbtn { font: inherit; font-weight: 900; font-size: 22px; letter-spacing: .08em; cursor: pointer; padding: 12px 26px; border-radius: 4px;
          background: var(--ink); color: var(--paper); border: 2.5px solid var(--paper); box-shadow: 4px 4px 0 var(--red); transition: transform .08s; }
  .tbtn.light { background: var(--paper); color: var(--ink); border-color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .tbtn.small { font-size: 17px; padding: 8px 14px; letter-spacing: .02em; }
  .tbtn:active { transform: scale(.94); }
  .tbtn:focus-visible { outline: 4px solid var(--pop); outline-offset: 2px; }
  .iconbtn { position: absolute; top: 14px; font: 900 18px 'Noto Sans TC', sans-serif; padding: 8px 12px; border-radius: 4px; cursor: pointer; background: var(--ink); color: var(--paper); border: 2px solid var(--paper); }
  /* 封面（比照六樓出口開場：實景圖去色＋網點＋紙框） */
  .cover { background: #0b0b0a; }
  .cover .bg { position: absolute; inset: -3%; background: url(art/scene/s0.webp) center 40% / cover no-repeat; filter: grayscale(.55) contrast(1.15) brightness(.6); animation: coverPush 18s ease-out forwards; }
  @keyframes coverPush { to { transform: scale(1.06); } }
  .cover .tone { position: absolute; inset: 0; background: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.5px) 0 0 / 5px 5px, linear-gradient(180deg, rgba(8,8,7,.2), rgba(8,8,7,.05) 35%, rgba(8,8,7,.85) 78%, #0b0b0a); }
  .cover .frameline { position: absolute; inset: 14px; border: 3px solid var(--paper); opacity: .85; }
  .cover h1 { position: absolute; left: 0; right: 0; top: 150px; margin: 0; text-align: center; font: 900 120px/1 'Noto Serif TC', serif; color: var(--paper); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 7px 7px 0 var(--red); }
  .cover .kicker { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); font-weight: 700; font-size: 18px; letter-spacing: .32em; color: var(--paper); background: var(--ink); padding: 6px 14px; border: 2px solid var(--paper); white-space: nowrap; }
  .cover .caption { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); width: 760px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 12px 18px; font-size: 21px; line-height: 1.6; font-weight: 700; }
  .cover .caption b { color: var(--red); }
  .cover .startrow { position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; gap: 18px; align-items: center; }
  .cover .credit { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 14px; color: rgba(244,236,216,.6); }
  /* 課程卡／結算（比照六樓出口 .card） */
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px;
          padding: 26px 30px; box-shadow: 8px 8px 0 var(--ink); animation: slam .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes slam { from { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 0; } }
  .card small { color: #7a6f55; letter-spacing: .12em; font-weight: 900; font-size: 16px; }
  .card h2 { margin: 6px 0 4px; font-size: 38px; }
  .card .meta { font-weight: 700; font-size: 17px; color: #5a5040; }
  .card p { font-size: 20px; line-height: 1.6; font-weight: 700; margin: 14px 0; }
  .stars { font-size: 34px; letter-spacing: .1em; color: #c9bfa6; }
  .stars b { color: var(--red); display: inline-block; }
  .stars b.pop { animation: starPop .16s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes starPop { from { transform: scale(1.6); } }
  .card .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .card .stamp { position: absolute; right: 22px; top: 18px; width: 120px; height: 120px; transform: rotate(-14deg); }
  .sched { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
  .sched div { border: 2.5px solid var(--ink); padding: 10px; background: #fffaf0; font-weight: 900; font-size: 18px; min-height: 90px; }
  .sched span { display: block; font-size: 14px; color: #7a6f55; font-weight: 700; margin-top: 4px; }
  .rotate { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 13px; color: #8a948e; }
  @media (orientation: landscape) { .rotate { display: none; } }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 20px 'Noto Sans TC', sans-serif; }
  @media (prefers-reduced-motion: reduce) { .cover .bg, .goal, .card { animation: none; } }
</style>
</head>
<body>
<div id="loading">載入中… Loading…</div>
<div id="fit"><div id="world" tabindex="0" aria-label="創作不斷線 遊戲畫面"></div></div>
<div class="rotate" id="rotate">手機轉橫向玩比較大 · Rotate your phone for a bigger view</div>
<script src="levels.js"></script>
<script src="masks.js"></script>
<script src="tuning.js"></script>
<script src="game.js"></script>
</body>
</html>
