<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴日茶桌</title>
<style>@font-face{font-family:TeaPixel;src:url(fusion-pixel-tea.ttf)}*{box-sizing:border-box}body{margin:0;background:url(room.png) center/cover no-repeat;image-rendering:pixelated;color:#4b6054;display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;font-family:TeaPixel,monospace;font-size:12px}canvas{image-rendering:pixelated;display:block;outline:none}#frame{border:12px solid transparent;border-image:url(panel-cream.png) 12 fill / 24px stretch;image-rendering:pixelated}#foot{margin-top:8px;border:12px solid transparent;border-image:url(panel-cream.png) 12 fill / 12px stretch;image-rendering:pixelated;padding:0 8px}#status{padding:2px;text-align:center;font-size:24px;line-height:1.3}button{font:inherit;color:inherit;background:none;border:6px solid transparent;border-image:url(button-cream.png) 6 fill / 12px stretch;image-rendering:pixelated;border-radius:0;padding:6px 22px;cursor:pointer}button:disabled{opacity:.7}#gate strong,#gate span,#gate button{position:relative}#gate::before{content:"";position:absolute;width:min(360px,86vw);height:220px;border:12px solid transparent;border-image:url(panel-cream.png) 12 fill / 24px stretch;image-rendering:pixelated}#gate{position:fixed;inset:0;background:url(paper.png) repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:3}#caption{min-height:30px;text-align:center;font-size:24px;line-height:1.3}#gate strong{font-size:24px;font-weight:400}</style>
<div id="gate"><strong>晴日茶桌</strong><span>把好牌，打成好時光。</span><button id="enter" disabled>正在泡茶…</button><span id="loading">準備茶桌 0%</span></div>
<div id="frame"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="晴日茶桌遊戲"></canvas></div><div id="foot"><div id="caption" aria-live="polite"></div><div id="status">H 提示 · Enter 出牌 · 空白 Pass · Esc 返回　｜　像素美術候選試玩版</div></div>
<script>
const canvas=document.querySelector('canvas');function resize(){const scale=Math.max(1,Math.floor(Math.min((innerWidth-60)/640,(innerHeight-190)/360)));canvas.style.width=640*scale+'px';canvas.style.height=360*scale+'px';canvas.width=640*scale;canvas.height=360*scale;}resize();addEventListener('resize',resize);
window.speechSynthesis?.getVoices();const loader=document.createElement('script');loader.src='Build/webgl.loader.js';document.body.append(loader);
loader.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/webgl.data.unityweb',frameworkUrl:'Build/webgl.framework.js.unityweb',codeUrl:'Build/webgl.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Treefar',productName:'晴日茶桌',productVersion:'0.3',matchWebGLToCanvasSize:true},p=>{document.querySelector('#loading').textContent='準備茶桌 '+Math.round(p*100)+'%'}).then(u=>{window.teaUnity=u;document.querySelector('#enter').disabled=false;document.querySelector('#enter').textContent='坐下喝杯茶';document.querySelector('#loading').textContent='牌桌準備好了'}).catch(e=>{document.querySelector('#loading').textContent='牌桌載入失敗：'+e;console.error(e)});
document.querySelector('#enter').onclick=()=>{document.querySelector('#gate').remove();canvas.focus();};
setInterval(()=>{const s=window.teaState;if(s)document.querySelector('#caption').textContent=s.speaker&&s.line?s.speaker+'：'+s.line:'';},200);
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.speechSynthesis?.cancel()});
</script></html>
