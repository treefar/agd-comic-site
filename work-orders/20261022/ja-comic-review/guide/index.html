Responsible Instructor: Yang Zhi-zhang (楊智彰), ext. 6112, Email: chzzyang@stu.edu.tw`,榮譽:"Honors","樹德科大再創佳績！科研雙星連四年榮登全球前 2% 學者榜":"Shu-Te University Achieves Great Results Again! Dual Scientific Research Stars Ranked in the World's Top 2% Scientists for 4 Consecutive Years","蘇中和教授（動遊系）連續四年入選《全球前 2% 頂尖科學家》。":`Professor Su Zhong-he (蘇中和) (AGD) has been selected into the "World's Top 2% Scientists" for 4 consecutive years.`,"根據最新公布的 2025 年《全球前 2% 頂尖科學家》（World's Top 2% Scientists）名單，台灣約有 1,470 位學者入榜。樹德科技大學副校長暨設計學院院長蘇中和教授與電腦與通訊系張偉德特聘教授再度雙雙入選，科研實力備受國際肯定。 這份榜單由美國史丹佛大學與 Elsevier 合作，基於 Scopus 資料庫引用數據進行分析，從全球近 800 萬名科學家中嚴格遴選前 2%。 蘇中和教授在社會科學─教育領域具有突出的國際地位，尤其在設計教育與遊戲化學習的研究中取得突破性成果。蘇教授的研究範疇涵蓋設計教育、遊戲化 STEM 教育、數位雙生與擴增實境設計，並成功跨足智慧設計與 AI 影像處理。 校長王昭雄表示：「蘇中和副校長與張偉德教授的國際肯定，再次凸顯樹德科大『教學與研究並重』的辦學特色。」":`According to the newly released 2025 "World's Top 2% Scientists" list, approximately 1,470 scholars in Taiwan were listed. Shu-Te University Vice President and Dean of the College of Design Professor Su Zhong-he (蘇中和) and Distinguished Professor Zhang Wei-de (張偉德) of the Department of Computer and Communication were once again both selected, earning high international recognition for their scientific research strength.

This list is a collaboration between Stanford University and Elsevier, analyzing citation data from the Scopus database to rigorously select the top 2% from nearly 800 ten-thousand (8 million) scientists worldwide.

Professor Su Zhong-he (蘇中和) holds a prominent international standing in the Social Sciences—Education field, achieving breakthrough results particularly in research on design education and gamified learning. Professor Su's research scope spans design education, gamified STEM education, digital twins, and augmented reality design, successfully branching into intelligent design and AI image processing.

President Wang Zhao-xiong (王昭雄) stated: "The international recognition of Vice President Su Zhong-he (蘇中和) and Professor Zhang Wei-de (張偉德) once again highlights Shu-Te University's educational feature of 'equal emphasis on teaching and research.'"`,得獎:"Awards","樹德科大動遊系勇奪巴哈姆特 ACG 創作大賽優選雙獎":"Shu-Te University AGD Wins Dual Excellence Awards at Bahamut ACG Creation Contest","原創動畫《人造人》與《癡迷的現實》同時榮獲優選賞，從全台 69 件入圍作品中脫穎而出。":"Original animations Zephyranthes (《人造人》) and Obsessive Reality (《癡迷的現實》) both won the Excellence Award, standing out among 69 shortlisted works across Taiwan.","【高雄訊】2025 年度「ACG 創作大賽」由台灣最大 ACG（動畫、漫畫、遊戲）社群平台──巴哈姆特電玩資訊站舉辦。樹德科技大學動畫與遊戲設計系表現亮眼，學生團隊創作的兩部原創動畫《人造人》與《癡迷的現實》同時榮獲「優選賞」，在全台 69 件入圍作品中脫穎而出。 《人造人》由學生博浩原、戎軒頤、陳政民、李育賢創作，陳美蓉老師指導。故事以探討人造智慧生命為主題，透過懸念與詩意描繪人性掙扎，呼應 SDG 16「和平、正義及健全制度」。 《癡迷的現實》由學生宋秋陽、陳志揚、藤川黎星創作，同樣由陳美蓉老師指導。以 1980 年代懷舊美術風格呈現偶像崇拜與理性認知的衝突，融入 SDG 4「優質教育」與 SDG 12「負責任消費與生產」。 指導老師陳美蓉表示：「學生能在具指標性的賽事中獲獎，展現的不僅是動畫製作技術的成熟，更是他們將生活觀察與社會議題轉化為深具思辨性的創作成果。」":`[Kaohsiung News] The 2025 "ACG Creation Contest" was organized by Taiwan's largest ACG (Animation, Comics, Games) community platform, Bahamut. The Department of Animation and Game Design at Shu-Te University delivered an outstanding performance, as two original animations created by student teams, Zephyranthes (《人造人》) and Obsessive Reality (《癡迷的現實》), both won the "Excellence Award," standing out among 69 shortlisted works across Taiwan.

Zephyranthes (《人造人》) was created by students Bo Hao-yuan (博浩原), Rong Xuan-yi (戎軒頤), Chen Zheng-min (陳政民), and Li Yu-xian (李育賢), advised by Chen Mei-rong (陳美蓉). The story explores artificial intelligent life, depicting human struggles through suspense and poetry, echoing SDG 16 "Peace, Justice and Strong Institutions."

Obsessive Reality (《癡迷的現實》) was created by students Song Qiu-yang (宋秋陽), Chen Zhi-yang (陳志揚), and Fujikawa Ryusei (藤川黎星), also advised by Chen Mei-rong (陳美蓉). Featuring a 1980s nostalgic art style to portray the conflict between idol worship and rational cognition, it incorporates SDG 4 "Quality Education" and SDG 12 "Responsible Consumption and Production."

Advising professor Chen Mei-rong (陳美蓉) stated: "The students' awards in this benchmark competition demonstrate not only the maturity of their animation production techniques, but also their ability to transform life observations and social issues into deeply reflective creative outcomes."`,"樹德科大攜手日本動畫大廠 培育國際競爭力動漫設計人才":"Shu-Te University Partners with Major Japanese Animation Studio to Cultivate Internationally Competitive Anime and Game Design Talent","與日本 Hautecouture (HC) 公司合作邁入第八年，學海築夢計畫 8 位學生赴愛媛縣松山市實習近三個月。":`Entering its 8th year of collaboration with Japan's hautecouture Inc. (HC), 8 students were sent under the "Building Dreams Overseas" program to Matsuyama City, Ehime Prefecture for a nearly 3-month internship.`,"【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）與日本知名動畫與遊戲製作公司──オートクチュール株式会社（Hautecouture Inc.，簡稱 HC 公司）合作邁入第八年。雙方持續深化產學合作，今年再次攜手推動教育部「學海築夢」海外實習計畫，展開為期近三個月的國際實習。 本次計畫由動遊系國際小組成員張純雅老師與尹立老師共同策劃與執行，透過系上嚴謹的遴選機制，最終錄取 8 位表現優異的學生：6 位來自台灣（陳思穎、黃郁心、陳宇杰、曾若慈、羅語涵、洪韻涵）及 2 位來自馬來西亞（溫永生、裴欣慧）。 張純雅老師於 7 月 8 日親自帶隊前往日本愛媛縣松山市，協助學生安頓生活、熟悉環境。學生實際參與 HC 公司旗下動畫與遊戲專案，分派任務涵蓋插畫、角色設計及遊戲美術。 動遊系主任鄧樹遠表示：「系上長期重視學生的國際實務歷練，與 HC 公司的合作已有深厚基礎，成果豐碩。」":`[Kaohsiung News] The Department of Animation and Game Design (AGD) at Shu-Te University has entered its 8th year of collaboration with the well-known Japanese animation and game production company hautecouture Inc. (オートクチュール株式会社, HC). Both parties continue to deepen industry-academia cooperation, joining hands once again this year to promote the Ministry of Education's "Building Dreams Overseas" (學海築夢) program for a nearly 3-month international internship.

Co-planned and executed by AGD International Team members Zhang Chun-ya (張純雅) and Yin Li (尹立), through rigorous departmental selection mechanisms, 8 outstanding students were accepted: 6 from Taiwan (Chen Si-ying (陳思穎), Huang Yu-xin (黃郁心), Chen Yu-jie (陳宇杰), Zeng Ruo-ci (曾若慈), Luo Yu-han (羅語涵), Hong Yun-han (洪韻涵)) and 2 from Malaysia (Wen Yong-sheng (溫永生), Pei Xin-hui (裴欣慧)).

Teacher Zhang Chun-ya (張純雅) personally led the team to Matsuyama City, Ehime Prefecture, Japan on July 8 (month 7, day 8), helping students settle in and familiarize themselves with the environment. Students actively participated in animation and game projects under HC, with assigned tasks covering illustration, character design, and game art.

AGD Chair Deng Shu-yuan (鄧樹遠) stated: "The department has long valued students' international practical experience, and the collaboration with HC has a solid foundation and fruitful results."`,"樹科大動畫與遊戲設計系創意展實力 時報金犢獎國際競賽勇奪第二名":"Shu-Te University AGD Demonstrates Creative Prowess, Winning 2nd Place in International Times Young Creative Awards","張純雅老師指導學生作品《永慶房屋雇主品牌招募廣告系列》榮獲第 34 屆時報金犢獎第二名。":"Student work Yung-Ching Realty Employer Brand Recruitment Commercial Series (《永慶房屋雇主品牌招募廣告系列》), advised by Zhang Chun-ya (張純雅), won 2nd Place at the 34th Times Young Creative Awards.","【高雄訊】樹德科技大學動畫與遊戲設計系於第 34 屆時報金犢獎國際競賽再傳捷報！由張純雅老師指導學生裴欣慧、黃若庭、王巧安、蔡思淇共同創作的《永慶房屋雇主品牌招募廣告系列篇 — 柴犬篇、浣熊篇、松鼠篇》，榮獲「永慶房屋招募廣告類」第二名殊榮。 本次獲獎作品以永慶房屋雇主品牌精神為核心，運用動物角色設定與生動敘事手法，將「不綁約」、「不爆肝」、「不扣薪」三大招募訴求轉化為輕鬆幽默又吸引目光的視覺語言。團隊以鸚鵡作為象徵企業文化的核心角色，分別推出三支約 30 秒的動畫短片：《柴犬篇》詮釋自由彈性的「不綁約」職場選擇；《浣熊篇》強調生活平衡的「不爆肝」理念；《松鼠篇》凸顯保障收入的「不扣薪」政策。 動遊系主任鄧樹遠表示，今年學生在金犢獎表現格外亮眼，不僅奪下第二名，另有 18 組作品成功入圍決選。其中張純雅老師指導作品入圍 11 組，陳美蓉老師指導入圍 7 組。 時報金犢獎被譽為華人世界最具影響力的青年創意賽事之一，今年吸引來自全球超過萬件作品同場競逐。":`[Kaohsiung News] The Department of Animation and Game Design at Shu-Te University has once again brought great news from the 34th International Times Young Creative Awards (第 34 屆時報金犢獎)! Advised by teacher Zhang Chun-ya (張純雅), the work Yung-Ching Realty Employer Brand Recruitment Commercial Series — Shiba Inu, Raccoon, Squirrel (《永慶房屋雇主品牌招募廣告系列篇 — 柴犬篇、浣熊篇、松鼠篇》), co-created by students Pei Xin-hui (裴欣慧), Huang Ruo-ting (黃若庭), Wang Qiao-an (王巧安), and Cai Si-qi (蔡思淇), won the 2nd place honor in the "Yung-Ching Realty Recruitment Advertising Category."

Centering on the employer brand spirit of Yung-Ching Realty, this award-winning work utilized animal character settings and vivid storytelling techniques to translate the 3 major recruitment appeals of "no contract lock-in," "no excessive overtime," and "no pay deduction" into a relaxed, humorous, and eye-catching visual language. With a parrot as the core character symbolizing corporate culture, the team launched 3 animated shorts of about 30 seconds each: Shiba Inu (《柴犬篇》) interprets flexible "no contract lock-in" career choices; Raccoon (《浣熊篇》) emphasizes the "no excessive overtime" work-life balance philosophy; Squirrel (《松鼠篇》) highlights the "no pay deduction" policy guaranteeing income.

AGD Chair Deng Shu-yuan (鄧樹遠) stated that students performed remarkably in this year's Times Young Creative Awards, not only winning 2nd place, but also seeing 18 groups of works successfully shortlisted for the finals. Among them, works advised by Zhang Chun-ya (張純雅) earned 11 shortlisted spots, and works advised by Chen Mei-rong (陳美蓉) earned 7.

The Times Young Creative Awards is acclaimed as one of the most influential youth creative competitions in the Chinese-speaking world, attracting over 10,000 entries from around the world to compete this year.`,"樹科大動遊系勇奪全國競賽佳績 畢業專題《失竊的祕方》領銜嶄露鋒芒":"Shu-Te University AGD Achieves Outstanding Results in National Competitions, Led by Graduation Project The Stolen Recipe (《失竊的祕方》)","《失竊的祕方》獲青春設計節優選，並入圍全國技專校院實務專題競賽（從 1,181 件作品中脫穎而出）。":"The Stolen Recipe (《失竊的祕方》) won the Excellence Award at Youth Innovative Design Festival and was shortlisted for the National Practical Project Contest for Colleges and Universities, standing out from 1,181 entries.","【高雄訊】樹德科技大學動畫與遊戲設計系學生在 2025 年度多項全國性設計與動畫競賽中表現出色。由涂承恩、李冠霖、張淑盈、唐莉蓉共同創作，陳美蓉老師指導的 2D 動畫短片《失竊的祕方》，以細膩敘事手法與寓意深遠的角色刻劃，勇奪多項肯定。 《失竊的祕方》榮獲「2025 青春設計節 — 數位多媒體與遊戲設計類／創意數位影片組」優選獎，並成功入圍「2025 全國技專校院學生實務專題製作競賽暨成果展」動漫互動多媒體類別，從全國 1,181 件報名作品中脫穎而出。 該片以「誤解與和解」為主題，描繪一位老廚師因祕方書失竊而誤會新餐廳老闆的故事，融合 SDGs 性別平等、減少不平等及和平正義等核心理念。 第 21 屆技專校院電腦動畫競賽「直接參賽組」中，動遊系斬獲四部佳作：《癡迷的現實》（陳美蓉指導）、《神癒》（陳慶鴻指導）、《人造人》（陳美蓉指導）、《失竊的祕方》（陳美蓉指導）。":`[Kaohsiung News] Students of the Department of Animation and Game Design at Shu-Te University performed outstandingly across multiple national design and animation competitions in 2025. Co-created by Tu Cheng-en (涂承恩), Li Guan-lin (李冠霖), Zhang Shu-ying (張淑盈), and Tang Li-rong (唐莉蓉), advised by Chen Mei-rong (陳美蓉), the 2D animated short film The Stolen Recipe (《失竊的祕方》) won multiple honors with its delicate narrative approach and deeply meaningful character portrayals.

The Stolen Recipe (《失竊的祕方》) won the Excellence Award in the "Digital Multimedia and Game Design Category / Creative Digital Video Group" at the "2025 Youth Innovative Design Festival" (2025 青春設計節), and was successfully shortlisted in the Anime and Interactive Multimedia category at the "2025 National Practical Project Contest for Colleges and Universities" (2025 全國技專校院學生實務專題製作競賽暨成果展), standing out from 1,181 registered entries nationwide.

With "misunderstanding and reconciliation" as its theme, the film depicts the story of an old chef who misunderstands a new restaurant owner due to the theft of a secret recipe book, integrating core SDGs concepts such as gender equality, reduced inequalities, and peace and justice.

In the Direct Entry Category of the 21st Computer Animation Contest for Colleges and Universities (第 21 屆技專校院電腦動畫競賽), AGD garnered 4 Merit Awards: Obsessive Reality (《癡迷的現實》) (advised by Chen Mei-rong (陳美蓉)), Holy Algorithm (《神癒》) (advised by Chen Qing-hong (陳慶鴻)), Zephyranthes (《人造人》) (advised by Chen Mei-rong (陳美蓉)), and The Stolen Recipe (《失竊的祕方》) (advised by Chen Mei-rong (陳美蓉)).`,"樹德科大動遊系八件作品入圍「2025 放視大賞」":"8 Works from Shu-Te University AGD Shortlisted for 2025 Vision Get Wild","動畫類 5 件 + 遊戲類 3 件畢業製作入圍 2025 放視大賞，展現產學接軌成果。":"5 Animation Works + 3 Game Works graduation projects shortlisted for 2025 Vision Get Wild, demonstrating industry-academia integration outcomes.","【高雄訊】樹德科技大學動畫與遊戲設計系在全台指標性數位內容競賽「2025 放視大賞」中表現亮眼，共有八件畢業製作作品成功入圍。 動畫類 5 部作品： 《失竊的祕方》（陳美蓉指導）— 涂承恩、李冠霖、張淑盈、唐莉蓉 《人造人》（陳美蓉指導）— 博浩原、李育賢、戎軒頤、陳政名 《癡迷的現實》（陳美蓉指導）— 陳志揚、宋秋陽、藤川黎星 《妖夢》（邱士展指導）— 張雯恩、兼子瑠奈、尾辻優菜、呂欣怡、鄧梓寶 《神癒》（陳慶鴻指導）— 陳彥蓉、陳珮羚、陳儀臻、方娸伊 遊戲類 3 部作品： 《糖霧之謎》（鄧樹遠指導）— 覃尚琍、老雋欣、朱寶兒 《眼及之處》（鄧樹遠指導）— 黃于婕、蘇宥菁、梁起超、黃凱佑、陳書凱 《Trace》（蔣天華指導）— 許恩慈、黃子芳、李宏杰":`[Kaohsiung News] The Department of Animation and Game Design at Shu-Te University performed remarkably in Taiwan's benchmark digital content competition, "2025 Vision Get Wild" (2025 放視大賞), with 8 graduation project works successfully shortlisted.

The most attractive part of the event was the 3 major exhibition areas meticulously planned by students:
1. Animation and Game Student Merchandise Sales Booths — acrylic keychains, stickers, postcards
2. Street Fighter Esports Arena — passionate showdowns between esports players and gaming enthusiasts
3. Animation and Game Student Dynamic and Static Works Exhibition — animated shorts, character designs, game prototypes

The event also featured interactive gaming quests, where participants had to complete various challenges to receive limited exquisite gifts.

ntry regular day four-year program lists a minimum of 128 credits; each category and zero-credit required courses must still be completed. Special Talent Program cannot directly apply regular class conditions.","先確認工作內容能否認列，再處理指導、合約與保險，避免做完才發現不算實習。":"First confirm whether the job duties are eligible for credit recognition before handling faculty mentoring, contracts, and insurance, avoiding finding out after completion that it does not qualify as an internship.",先向系辦取得當期實習規定:"First obtain current internship regulations from the department office","確認單位、工作內容與指導老師":"Confirm the internship organization, job duties, and faculty advisor","完成合約及保險確認後，再依規定開始":"Complete contract and insurance confirmations before starting according to regulations","動遊系辦／實習指導老師":"Department of Animation and Game Design Office / Internship Faculty Advisor","研發處職涯發展暨校友服務中心（實習）":"Office of R&D Career Development and Alumni Service Center (Internships)","自找公司、打工時數認列或中止實習，請先向系辦確認適用規定。":"For self-sourced companies, recognizing part-time work hours, or terminating an internship, please check applicable regulations with the department office first.","校外實習要做多久？":"How long must the off-campus internship last?","112至115入學一般日四技課表列校外實習2學分、160小時。時數計算、可認列內容與成果文件，仍依本系當期規定。":"Curriculum for 112 to 115 entry regular day four-year program lists off-campus internship as 2 credits and 160 hours. Hour calculations, eligible recognized duties, and outcome documentation are still subject to current department regulations.","可以直接拿打工時數抵實習嗎？":"Can part-time work hours be directly used to waive the internship?","不一定。請先把公司、職務與工作內容交系辦或實習指導老師確認，取得認列回覆後再安排。":"Not necessarily. Please submit the company, position, and job duties to the department office or internship faculty advisor for confirmation, and make arrangements only after receiving credit recognition approval.","證照能否算畢業門檻，要先對系上清單；認列與獎助金是兩件事，考過後仍要查申請流程。":"Whether a certification fulfills graduation requirements must first be checked against the department list; credit recognition and reward subsidies are two separate matters, and application procedures must still be checked after passing.",考照前先問系辦是否認列:"Ask the department office whether it is recognized before taking the certification exam",取得證明後完成認列登錄:"Complete recognition registration after obtaining the certificate",另向職發中心查獎助資格並送件:"Separately check subsidy eligibility with the Career Development Center and submit application","動遊系辦（認列）":"Department of Animation and Game Design Office (Recognition)","研發處職發中心（獎助）":"Office of R&D Career Development Center (Subsidies)","技優班條件另核；畢業認列與獎助資格，請分別向系辦、職發中心確認。":"Special Talent Program requirements are audited separately; please verify graduation recognition and subsidy eligibility with the department office and Career Development Center respectively.","入學前考的證照也有獎助嗎？":"Are certifications obtained before admission eligible for subsidies as well?","已核對的114-2公告不補助入學前證照；能否作本系畢業認列仍須對清單。當期獎助資格請洽職發中心1713。":"Verified 114-2 announcement does not subsidize certifications obtained before admission; whether it can count toward department graduation recognition must still be checked against the list. For current subsidy eligibility, please contact Career Development Center at ext. 1713.","老師已幫我登錄，還要申請獎助嗎？":"My teacher already registered it for me; do I still need to apply for the subsidy?","114-2公告將證照登錄與獎助申請分開，團體登錄後仍可能要追加申請。公告列證照生效半年內；請先問1713自己的案件適用期限。":"The 114-2 announcement separates certification registration from subsidy application; an additional application may still be required after group registration. The announcement states within six months of certification effective date; please check with ext. 1713 for the deadline applicable to your case.","送出假單後還要追蹤核准結果。假別、天數與考試週可能有不同流程，先備證明再確認。":"After submitting a leave application, follow up on approval results. Leave categories, days, and exam weeks may have different procedures; prepare supporting documents first before checking.","確認假別、日期與需要的證明":"Confirm leave type, dates, and required supporting documents",到校務系統提出申請:"Submit application in the university administration system","追蹤簽核；有考試或長假再向承辦確認":"Track approvals; check with the coordinator if exams or extended leave are involved","導師／生活輔導組":"Class Advisor / Student Assistance Section",考試相關另洽教務處註冊課務組:"For exam-related matters, contact Office of Academic Affairs Registration and Curriculum Section","考試、長假或補請假，先向導師確認流程；考試處理另洽註冊課務組。":"For exams, extended leave, or retroactive leave applications, check the procedure with your class advisor first; for exam handling, contact the Registration and Curriculum Section.","送出後一直沒回覆，可以當作准假嗎？":"If there has been no reply after submitting, can it be assumed that the leave is approved?","不能；要以系統最後核准結果為準。若一直沒有回覆，主動找導師追蹤，別把假單送出當成核准。":"No; the final approval status in the system governs. If there is no response, actively follow up with your class advisor; do not equate submitting a leave request with approval.","兩天以上一定只在線上處理嗎？":"Must leaves of two or more days be handled strictly online?","請先問導師或生輔組2114，確認需要的證明與簽核方式；遇考試或長假，不確定時再向註冊課務組確認。":"Please first check with your class advisor or the Student Assistance Section at ext. 2114 to confirm required documentation and approval procedures; during exam periods or extended breaks, check with the Registration and Curriculum Section if unsure.",選課加退選:"Course Selection and Add/Drop","先看校務系統的正式課表。必修、衝堂與學分數都要自己確認，上過課不等於已完成加選。":"First check your official class schedule in the Academic Information System. You must confirm required courses, schedule conflicts, and credit totals yourself; attending a class does not mean you have completed the add process.","對照必修、學分數與上課時間":"Check required courses, credit totals, and class schedules",依當期公告辦理初選或加退選:"Complete preliminary course selection or add/drop according to current announcements","重開系統確認結果，有問題找註冊課務組":"Reopen the system to verify results; contact the Registration and Curriculum Section if any issues arise","動遊系辦／註冊課務組":"AGD Department Office / Registration and Curriculum Section","老師同意、也去上課，就算選到了嗎？":"If the instructor agreed and I attended classes, does that count as enrolled?","仍要以校務系統的選課紀錄為準，請核對課程是否確實列入自己的課表。":"The course selection records in the Academic Information System remain the sole authority; please verify that the course is indeed listed on your personal schedule.","這學期還能直接加退選嗎？":"Can courses still be added or dropped directly this semester?","已核對的115-1加退選於2026/9/14上午9時截止，現在不能當作仍開放。棄選或特殊情況是否可辦，請查當期公告並洽註冊課務組。":"The verified 115-1 add/drop period closed on 2026/9/14 at 9:00 AM and cannot be assumed to remain open. For course withdrawal or special circumstances, please check current announcements and contact the Registration and Curriculum Section.",學分抵免:"Credit Waiver and Transfer","修過類似課程不等於自動抵免。準備原始成績與申請表，依開課單位、系所及教務處順序審核。":"Having taken similar courses does not mean credits are automatically waived. Prepare original transcripts and the application form for sequential review by the offering department, the degree program, and the Office of Academic Affairs.",先問自己的身分與課程能否提出申請:"First check whether your student status and courses are eligible for application","系統填表，備成績證明並依規定送審":"Fill out the form in the system, prepare academic transcripts, and submit for review as required","查核准結果，再確認課表是否須調整":"Check approved results and verify whether your course schedule needs adjustment","開課單位／動遊系辦／註冊課務組":"Course Offering Department / AGD Department Office / Registration and Curriculum Section","表格送出去，就可以不修那門課嗎？":"Once the form is submitted, can I skip taking that course?","先確認核准結果，不能把「已送件」當成通過。課表是否需要自行退選，也請在規定期間向系辦或註冊課務組確認。":"First confirm official approval; 'submitted' cannot be assumed as approved. Please also confirm with the department office or the Registration and Curriculum Section within the designated period whether the course must be dropped manually from your schedule.","現在能補交115-1抵免嗎？":"Can 115-1 credit waiver applications still be submitted late now?","公告列2026/8/3至9/21受理，已截止且註明逾期不受理。不要自行假設可補交；有特殊身分或程序疑義，請洽註冊課務組。":"Announcements specified acceptance from 2026/8/3 to 9/21, which has closed with late submissions explicitly not accepted. Do not assume late submissions are allowed; for special student status or procedural questions, please contact the Registration and Curriculum Section.","先向指導老師與系辦確認當屆規則，再排製作、審查與成果交件。作品完成不等於所有程序完成。":"First confirm your cohort's regulations with your advisor and the department office before scheduling production, reviews, and submission of deliverables. Completing the project work does not mean all procedures are completed.",向系辦取得當屆辦法與表單:"Obtain your cohort's regulations and forms from the department office",和指導老師排定審查及交件進度:"Schedule review and submission timelines with your advisor","依規定提交作品、文件與展演成果":"Submit works, documentation, and exhibition outcomes according to regulations","專題指導老師／動遊系辦":"Capstone Project Advisor / AGD Department Office","組隊、評分、補審與畢展時程，請向系辦索取當屆正式辦法再安排。":"For team formation, grading, supplementary reviews, and graduation exhibition schedules, please obtain your cohort's official regulations from the department office before planning.","專題是選修嗎？":"Is the capstone project an elective?","已核對的112至115入學一般班課表將專題設計Ⅰ、Ⅱ列為必修。請按自己的入學年課表修課，不把其他班別規定直接套用。":"Verified standard class curriculum charts for entry years 112 to 115 list Capstone Design Ⅰ and Ⅱ as required courses. Please take courses according to the curriculum chart of your entry year and do not directly apply regulations from other class types.","組員人數、退組或補審要看哪裡？":"Where can I check team size limits, team withdrawal, or supplementary review rules?","請向系辦索取當屆正式辦法，確認組隊、異動與補審；不要套用他系或往年規則。":"Please obtain your cohort's official regulations from the department office to confirm team formation, changes, and supplementary reviews; do not apply rules from other departments or previous years.",英文門檻:"English Graduation Requirements","英文與外語修課、英文能力門檻，要分開確認。先看入學年度與分級結果，再查可認列的證明或方案。":"English/foreign language coursework and English graduation requirements must be checked separately. First check your entry year and placement results, then look up eligible certifications or alternative pathways.","核對入學年度、分級與外語學分":"Check your entry year, placement level, and foreign language credits",向語文承辦確認現行門檻與替代方案:"Confirm current graduation requirements and alternative pathways with language program coordinators","完成課程及證明認列後，再查畢業檢核":"After completing courses and certificate accreditation, check graduation audit records","通識教育中心（外語修課；門檻請協助轉介）":"General Education Center (foreign language coursework; please request referral for graduation requirements)","測驗分數、證明效期與替代方案，先向語文承辦確認；考照獎助分數不能直接當畢業門檻。":"First confirm test scores, certificate validity periods, and alternative pathways with language program coordinators; certification subsidy score criteria cannot be directly used as graduation requirements.","英文分級免修，學分就不用補了嗎？":"If exempted by English placement, do I not need to make up the credits?","通識中心修課頁說明，分級後免修的課程學分仍須用認列的專業外語補足；日四技英文與外語合計8學分，請按入學年度核對。":"The General Education Center course page states that credits exempted through placement must still be fulfilled with approved professional foreign language courses; Day Four-year program English and foreign language courses total 8 credits, so please verify against your entry year.","可以直接照網路上的英檢分數準備嗎？":"Can I prepare directly based on English proficiency test scores found online?","先向語文承辦確認自己適用的測驗、分數、證明效期與替代方案，再決定報考，不直接套用別校或往年資訊。":"First check with language program coordinators regarding applicable tests, scores, certificate validity periods, and alternative pathways before registering for exams, rather than directly applying information from other schools or past years.",休學復學與兵役:"Suspension of Studies, Resumption of Studies, and Military Service","休學、復學要完成正式程序；兵役資料另找生輔組確認。先聯絡承辦，避免只停課卻沒有辦好學籍。":"Formal procedures must be completed for suspension and resumption of studies; check military service details separately with the Student Assistance Section. Contact coordinators in advance to avoid merely stopping class attendance without properly managing your student status.",先向系辦及註冊課務組確認程序:"First confirm procedures with the department office and the Registration and Curriculum Section",備文件並在當期期限內完成離校或復學:"Prepare documents and complete departure or resumption procedures within the designated period",役男另向生輔組確認兵役資料:"Military draft-eligible students must separately confirm military service data with the Student Assistance Section","註冊課務組（動遊系）":"Registration and Curriculum Section (AGD)","生活輔導組（兵役，請轉接承辦）":"Student Assistance Section (military service; please transfer to coordinator)","個人緩徵、儘召與兵役文件期限須由承辦判定；學籍辦妥不代表兵役資料已完成。":"Individual conscription deferments, reserve recall deferments, and military document deadlines must be determined by the coordinator; completing student status procedures does not mean military records are finalized.","領了休學表，晚一點再交可以嗎？":"Can I submit the leave of absence form later after picking it up?","115-1公告要求登記起含當日7日內完成離校及繳件，逾期需重新領表，退費計算基準也會改變。請先確認導師與系辦可辦理時間。":"The 115-1 announcement requires school departure and document submission to be completed within 7 days including the registration date; overdue submissions require picking up a new form, and tuition refund calculation baselines will also change. Please check available hours with your class advisor and department office beforehand.","休學後如何知道復學時間？":"How do I know when to resume studies after suspension?","教務處FAQ說明，休學期滿前會寄送復學通知，應依通知辦理。地址、信箱與電話有變動要更新；兵役問題另向生輔組確認。":"The Office of Academic Affairs FAQ states that a resumption notice will be sent prior to the expiration of the suspension period, and procedures should follow that notice. Please update any changes in address, email, or phone number; confirm military service matters separately with the Student Assistance Section.",獎助與急難協助:"Scholarships, Financial Aid, and Emergency Assistance","經濟壓力或家庭突發變故，先找生輔組確認適用方案。資格、文件與期限各自不同，不必等到撐不下去才問。":"For financial hardship or sudden family emergencies, check first with the Student Assistance Section for applicable programs. Eligibility, documents, and deadlines vary; there is no need to wait until you are overwhelmed before asking.",先說明困難與目前已領的補助:"First explain your difficulties and any aid currently received",依承辦指定方案準備證明:"Prepare documentation according to the program specified by the coordinator",在該方案期限內送件並追蹤補件:"Submit documents within the program deadline and track supplementary submissions",生輔組急難慰助:"Student Assistance Section Emergency Relief","獎助學金／學雜費減免":"Scholarships and Grants / Tuition and Fee Waivers","錯過一項助學截止日，就不能再問其他協助嗎？":"If I missed the deadline for one aid program, can I no longer inquire about other assistance?","不同方案分開辦理。115-1不利處境助學10/20、學產低收10/8都已截止；急難協助另依事件與方案判斷，請先洽生輔組2124。":"Different programs are handled separately. For 115-1, disadvantaged student aid on 10/20 and Ministry of Education student aid for low-income families on 10/8 have both closed; emergency assistance is assessed separately based on individual events and programs, so please first contact the Student Assistance Section at ext. 2124.","可以同時領好幾種補助嗎？":"Can I receive multiple types of financial aid at the same time?","先把已申請或已領的補助告訴承辦，各方案可能有重複請領限制，不能只看名稱不同就認為可併領。":"First inform the coordinator of the subsidies you have applied for or received; each program may have duplicate funding restrictions, and different titles alone do not mean they can be combined.",遇到困難找誰:"Who to Contact When Facing Difficulties","情緒、相處或權益出了問題，可以先找導師協助轉介，再從學校在校學生入口找到對應資源。":"If you encounter emotional, interpersonal, or rights-related issues, consult your class advisor for assistance with referrals, then find the corresponding resources via the university's Current Students portal.",先找願意協助的導師或校內承辦:"First seek assistance from a supportive class advisor or campus coordinator",需要諮商時由在校學生入口查詢:"Look up counseling services via the Current Students portal when counseling is needed",涉及權益時確認正式受理單位與期限:"When rights are involved, verify the official accepting office and deadlines","導師／學校在校學生入口（諮商與轉介）":"Class Advisor / University Current Students Portal (Counseling and Referrals)","申訴或性平案件，請先確認受理窗口與正式期限，再使用對應表單送件。":"For grievances or gender equity cases, please confirm the intake window and official deadlines before submitting using the designated forms.","線上諮商預約從哪裡進？":"Where do I access online counseling appointments?","學校「在校學生」頁列有線上預約諮商入口。預約方式與時段以服務頁為準；若找不到入口，可請導師協助聯繫。":"The university's 'Current Students' page lists the access point for online counseling appointments. Booking methods and available time slots follow the service page; if you cannot locate the portal, you can ask your class advisor for help contacting them.","一般申訴與性平可以共用同一張表嗎？":"Can general grievances and gender equity complaints share the same form?","不要先假設表單共用。請導師協助找對承辦，確認案件類型、受理方式與期限後，再使用對應表單。":"Do not assume forms can be shared. Ask your class advisor to help locate the correct coordinator, confirm the case type, submission procedure, and deadline, and then use the corresponding form.",就業資源:"Employment Resources","先整理作品、履歷與想做的職務，再用職發中心的職涯輔導、職能檢測與徵才資訊，逐步準備求職。":"First organize your portfolio, resume, and target roles, then use the Career Development Center's career counseling, competency assessments, and recruitment postings to step-by-step prepare for job applications.","整理作品集、履歷與職務方向":"Organize portfolio, resume, and career direction",向系上師長及職發中心詢問資源:"Consult department faculty and the Career Development Center regarding available resources",依當期職缺要求投件並追蹤:"Submit applications according to current job requirements and follow up",研發處職涯發展暨校友服務中心:"Career Development and Alumni Service Center, Office of Research and Development","動遊系辦／相關領域老師":"Department of Animation and Game Design Office / Faculty in relevant fields","還沒畢業，也可以先做職涯準備嗎？":"Can I start preparing for my career before graduating?","職發中心職掌列有學生職涯規劃、UCAN職能檢測、講座與就業輔導；可先洽中心確認當期可使用的資源。":"The Career Development Center's duties include student career planning, UCAN competency assessments, lectures, and employment counseling; contact the center first to confirm currently available resources.","徵才活動或職缺一定每學期都一樣嗎？":"Are recruitment events or job openings always the same every semester?","不一定。中心辦理就業相關活動，但實際日期與職缺要看當期公告；不要直接沿用過往海報的報名連結。":"Not necessarily. The center organizes employment-related events, but actual dates and job openings depend on current announcements; do not directly reuse registration links from past posters.","先確認想研究什麼，再讀報考校系當年度簡章。資格、書審、繳費與面試各有要求，不能只完成填表。":"First confirm what you want to research, then read the admissions brochure of the applying school and department for the current academic year. Eligibility, document review, fee payment, and interviews each have specific requirements; simply completing the form is not enough.",帶作品或研究興趣和師長討論:"Bring your portfolio or research interests to discuss with faculty",讀當年度簡章的資格與所別要求:"Read the eligibility and graduate program requirements in the admissions brochure for the current academic year","依期限完成證明、上傳、繳費與確認送出":"Complete certificate verification, document upload, fee payment, and final submission confirmation before the deadline","教務處招生選才組（本校報名試務）":"Recruitment and Admissions Section, Office of Academic Affairs (University application and examination affairs)","導師／專題指導老師（規劃討論；統一窗口待確認）":"Class Mentor / Capstone project advisor (planning discussions; centralized contact window to be confirmed)","應屆生還沒拿到畢業證書，能報本校116碩甄嗎？":"Can graduating seniors apply for the university's 116 Master's early admissions before receiving their diploma?","116簡章允許115學年度應屆畢業生依規定報考，須交附表一並經教務單位核章；錄取後仍須取得學士資格才能註冊。":"The 116 admissions brochure allows graduating seniors of the 115 academic year to apply according to regulations; Appendix 1 must be submitted with verification stamp from the academic affairs office. Admitted students must still obtain their bachelor's degree qualification before registering.","本校116碩甄何時截止？其他學校也一樣嗎？":"When is the deadline for the university's 116 Master's early admissions? Is it the same for other universities?","本校一般網路報名至2026/11/2下午4時，部分境外學歷或專業資格同等學力為10/27截止。其他校系請各查自己的116簡章，不能共用期限。":"General online registration for our university ends on 2026/11/2 at 4:00 PM; the deadline for certain overseas academic credentials or equivalent professional qualifications is 10/27. For other universities and departments, please check their respective 116 admissions brochures, as deadlines cannot be shared.","先找本系當期甄選，再確認作品、語言、補助與出國文件。過去赴日實習的新聞，不代表現在可以報名。":"First check the department's current selection announcements, then confirm portfolio, language proficiency, subsidies, and travel documents. Past news reports on internships in Japan do not mean applications are currently open.",問系辦與職發中心有無當期甄選:"Inquire with the department office and Career Development Center about current selection calls","核對身分、語言、補助及自付費用":"Verify eligibility status, language requirements, subsidies, and out-of-pocket expenses","錄取後依契約完成保險、簽證與行前程序":"Upon admission, complete insurance, visa, and pre-departure procedures in accordance with the agreement","動遊系辦／本系海外實習計畫主持老師":"Department of Animation and Game Design Office / Faculty Director of the Department's Overseas internships Program","職涯發展暨校友服務中心（學海業務）":"Career Development and Alumni Service Center (Xuehai Program affairs)","先向系辦確認目前有無甄選、名額與補助；錄取、費用及出發日期以當期正式文件為準。":"First confirm with the department office whether selections, quotas, and subsidies are currently available; admission, fees, and departure dates are subject to current official documents.","境外生也一定可以領學海補助嗎？":"Are international/overseas students guaranteed to receive Xuehai subsidies?","教育部現行要點要求中華民國國籍、臺灣戶籍與同階段在學一學期以上等條件。能否參加實習與能否領此補助要分開問，不能由過往新聞推定。":"Current Ministry of Education guidelines require Republic of China nationality, household registration in Taiwan, and enrollment for at least one semester at the current study stage. Eligibility to participate in internships and eligibility to receive this subsidy must be inquired separately and cannot be assumed from past news.","出國實習的保險和簽證，可以自己隨便買辦嗎？":"Can insurance and visas for overseas internships be purchased and arranged casually by oneself?","教育部要點要求校方協助實習期間醫療、意外保險及合法實習簽證。請依計畫與當地規定確認，不能預設觀光簽證可實習；補助以核定契約為準。":"Ministry of Education guidelines require the university to assist with medical and accident insurance and legal internship visas during the internship. Please confirm according to program requirements and local regulations; do not assume that a tourist visa permits an internship. Subsidies are subject to the approved contract.","想參訪海外學校、展會或產業現場，先問當期見學安排；報名條件、費用、補助與學分都要分開確認。":"If you wish to visit overseas schools, exhibitions, or industry sites, inquire first about current Overseas study visits arrangements; application requirements, fees, subsidies, and academic credits must all be verified separately.",向系辦詢問目前有無見學或移地教學:"Inquire with the department office whether study visits or off-site teaching programs are currently available","確認行程、費用、補助與認列方式":"Confirm the itinerary, expenses, subsidies, and credit recognition methods",依當期文件確認報名及出國準備:"Confirm registration and travel preparations in accordance with current official documents","動遊系辦（當期團、課程與認列）":"Department of Animation and Game Design Office (Current tour groups, courses, and credit recognition)","國際及兩岸事務處（校級出國交流入口）":"Office of International and Cross-Strait Affairs (University-level overseas exchange portal)","是否開團、費用、補助與認列，請向系辦確認當期文件；參訪不代表一定可抵實習或學分。":"Please confirm with the department office regarding group offerings, expenses, subsidies, and credit recognition through current documents; participating in visits does not guarantee credit waiver or internship credit fulfillment.","海外見學可以直接算實習時數或畢業學分嗎？":"Can Overseas study visits count directly toward internship hours or graduation credits?","不能直接保證。參訪、交流與職場實習的活動內容不同，是否認列要看當期課程及本系規定；請先向系辦確認再報名。":"It cannot be directly guaranteed. Visits, exchanges, and workplace internships differ in content; whether they can be recognized depends on current courses and department regulations. Please verify with the department office before registering.","看到以前的日本展演營或交流照片，現在也能報名嗎？":"Seeing past photos of Japan exhibition camps or exchanges, can I apply now as well?","過往成果不等於現在開放報名。先問系辦目前有無團、適用年級、名額、費用與補助，再依當期公告準備；校級交流可從國際處入口查詢。":"Past achievements do not indicate that applications are currently open. First ask the department office whether tours are running, eligible year levels, quotas, expenses, and subsidies, then prepare according to current announcements; university-level exchanges can be queried through the Office of International Affairs portal.","?subject=動遊系一日參訪預約":"?subject=Department of Animation and Game Design One-Day Visit Reservation",資料暫時讀不到:"Data temporarily unavailable","請重新整理；急件可先聯絡動遊系辦 07-6158000 分機 6102。":"Please refresh the page; for urgent matters, contact the Department of Animation and Game Design Office at 07-6158000 ext. 6102.",重新整理:"Refresh","· 查核":"· Verification",官網版型審閱稿:"Review draft",內容查核:"Checked","· 尚未上線":"· Not published","STUDENT GUIDE · 動遊在校生":"STUDENT GUIDE · AGD",分類索引:"Category Index",資訊分類:"Information Categories","常見問題 ↓":"FAQ ↓",常用項目:"Frequently Used Items","畢業規則先看「入學年度＋班別」":'For graduation rules, check "Admission Year + Program Type" first',"這份指南以日間四技在校生為主。一般班、技優班與不同入學年度可能不同；申請資格和日期請以各處室當期公告為準。":"This guide is primarily for current students in the day division Four-year program. General classes, the Special Talent Program, and different admission years may vary; please refer to current announcements from respective administrative offices for application eligibility and dates.",辦理資訊:"Procedure Information",搜尋資訊:"Search Information",輸入問題或關鍵字:"Enter a question or keyword",清除篩選:"Clear Filters",顯示:"Showing",項資訊:"items of information",沒有找到符合的資訊:"No matching information found","換個關鍵字，或按「清除篩選」看全部項目。":'Try another keyword, or click "Clear Filters" to view all items.',辦理步驟:"Procedure Steps",留意:"Please Note",找誰辦:"Who to Contact","其他協助：":"Additional Assistance:","前往承辦單位 ↗":"Go to Responsible Unit ↗",官方資料與查核狀態:"Official Information and Verification Status",常見問題:"FAQ","目前的篩選沒有相關問題。":"No related questions match the current filter.","還是不知道找誰？":"Still don't know who to contact?","把「入學年度、班別、要辦的事」一起告訴系辦，協助你確認承辦窗口。":'Provide your "admission year, program type, and the matter to be processed" to the department office to help identify the appropriate contact window.',"動遊系辦 · 07-6158000 分機 6102 ↗":"Department of Animation and Game Design Office · 07-6158000 ext. 6102 ↗","依學校及系所官方資料整理，閱讀限制已附在各項來源；尚未取得的當期規定保留提醒。本頁為審閱版本。":"Compiled from official university and department sources, with viewing restrictions attached to each respective source; reminders are retained for current regulations not yet obtained. This page is a review draft.",尚未上線:"Not published","教務處學生休學、復學及退學":"Office of Academic Affairs: Student Leave of Absence, Re-enrollment, and Withdrawal","官方搜尋索引可讀；直接開啟403或202空內容，未讀即時全文。":"Readable via the official search index; direct access returns 403 or 202 empty content without reading live full text.",生輔組急難慰助專區申請須知:"Student Assistance Division: Emergency Financial Aid Application Guidelines","從教務處歷年課程表找到「動遊系」，先核對入學年與一般班、技優班。把自己的那一份存下來，之後選課與畢業檢核都用它比對。":"Find 'Department of Animation and Game Design' in the Office of Academic Affairs curriculum catalog across academic years, and check your enrollment year as well as regular class or Special Talent Program. Save your copy to reference later during course selection and graduation audits.","把系統未通過的項目分成課程、英文、證照、實習與專題，註明缺哪一項。零學分必修也一起看，不要只看總學分是否足夠。":"Categorize unpassed items in the system into courses, English, certifications, internships, and capstone project, noting exactly what is missing. Check zero-credit required courses as well; do not look only at whether total credits are sufficient.","找系辦時一起帶入學年課表、成績與未通過項目的畫面，直接問缺課要補哪門、已有證明如何認列。若涉及抵免或學籍，再請註冊課務組協助確認。":"When visiting the department office, bring your enrollment year curriculum, grades, and screenshots of unpassed items. Ask directly which course to take to make up for missing credits and how existing certificates can be recognized. If credit waivers or student status are involved, ask the Division of Registrar and Curriculum for assistance.","先向系辦說明自己的入學年、班別與預計實習期間，索取適用的辦法及申請表。也一起問時數怎麼算、結束後要交什麼，避免只知道最低時數。":"First inform the department office of your enrollment year, class section, and expected internship period to obtain the applicable regulations and application forms. Also ask how hours are calculated and what must be submitted upon completion, rather than only knowing the minimum required hours.","把公司名稱、職務說明、預計做的事與工作期間整理給系辦或指導老師看。自找公司或原本的打工能否認列，要先確認，不能做完才補問。":"Organize the company name, job description, planned tasks, and work period for the department office or your advisor to review. Confirm in advance whether self-found companies or existing part-time jobs can be recognized; do not wait until completion to ask.","請實習承辦確認合約由誰簽、保險何時生效，以及出了問題要找誰。拿到需補文件的清單後再安排開始日期，不把公司口頭答應當成學校程序完成。":"Ask the internship coordinator to confirm who signs the contract, when insurance takes effect, and whom to contact if problems arise. Set the start date only after receiving the checklist of required supplementary documents; never treat a company's verbal agreement as completed school procedures.","把證照全名、發照單位與預計考取版本交給系辦，問是否適用自己的入學年與班別。先確認能認列，再安排報名與費用，別只看別人考過哪一張。":"Submit the full certification title, issuing agency, and planned exam version to the department office to verify if it applies to your enrollment year and class section. Confirm it is eligible for recognition before arranging registration and payment; do not simply take a test because others passed it.","準備清楚的證照或成績證明，先核對姓名、證照名稱與生效日期。再向系辦確認登錄位置、是否另交文件，以及畢業檢核何時可查到結果。":"Prepare clear copies of your certificate or score transcript, checking your name, certificate title, and effective date first. Then confirm with the department office where to register it, whether additional documents are needed, and when the result will appear in the graduation audit.","先向職發中心確認當期獎助資格，並檢查本人匯款帳戶資料是否已交出納組。若老師已團體登錄證照，仍要確認是否需要另外追加獎助申請。":"First check with the Career Development Center regarding current reward eligibility and ensure your remittance account details have been submitted to the Cashier Section. Even if an instructor registered the certification as a group, still confirm whether an additional reward application is required.","先整理不能到課的日期、節次與原因，再向導師或生輔組確認假別及證明。遇到考試、心理假或較長期間，先問清楚是否還有其他辦理方式。":"Organize the dates, class periods, and reasons for your absence, then verify the leave category and required proof with your class advisor or the Student Assistance Division. For exam periods, mental health leave, or extended absences, ask clearly in advance whether additional procedures apply.","從學校「在校學生」入口進入請假服務，依系統填寫資料並確認是否送出。若找不到操作項目，帶著畫面問導師或生輔組，不要只在通訊軟體告知就當完成。":"Log into the leave application service via the school's 'Current Students' portal, fill in the details in the system, and confirm submission. If you cannot find the required option, bring your screen to consult your advisor or the Student Assistance Division; do not assume notifying someone via messaging apps completes the process.","送件後回到系統查看是否核准；沒有回覆時，主動找導師追蹤。若會影響考試或需請長假，再向導師與註冊課務組確認後續，別把送出當核准。":"After submitting, return to the system to verify whether it has been approved; if there is no response, follow up proactively with your advisor. If it affects exams or involves extended leave, consult your advisor and the Division of Registrar and Curriculum for follow-up steps; do not mistake submission for approval.","把入學年課表與本學期系統課表並排，先看必修是否漏選，再檢查學分與衝堂。若有抵免、重修或補修，另外列出來，選課前一起問系辦。":"Place your enrollment year curriculum and this semester's system schedule side by side. Check first for any missed required courses, then verify total credits and timetable conflicts. If you have waived, retaken, or makeup courses, list them separately and consult the department office before course selection.","到教務處確認現在屬於初選、加退選還是棄選，再依該階段公告辦理。過去的加退選日期不能繼續使用；遇到逾期或特殊情況，先問註冊課務組。":"Check with the Office of Academic Affairs whether the current period is preliminary registration, add/drop, or course withdrawal, and follow that stage's announcement. Past add/drop dates cannot be reused; if past deadlines or facing special circumstances, consult the Division of Registrar and Curriculum first.","操作後重新開啟系統課表，確認課名、班別與時間真的正確。若和預期不同，記下課程代碼及問題畫面找註冊課務組，不以出席或老師同意代替系統結果。":"After making changes, reopen your system schedule to verify that course titles, class sections, and times are indeed correct. If anything differs from expected, note the course code, take a screenshot of the issue, and contact the Division of Registrar and Curriculum; attending class or receiving instructor consent cannot substitute for official system records.","先說明自己是新生、轉學生、轉系生或其他身分，帶原修課程與成績資料詢問。請承辦確認本期是否仍受理及適用規定，別只因課名相似就認為可抵免。":"State whether you are a new student, transfer student, a student changing departments, or have another status, and bring information about previous courses and grades. Ask whether applications are still open and which rules apply; similar course names do not automatically mean credits can transfer.","在可申請的期間填寫抵免系統並列印表格，備妥原校成績證明正本。依公告送開課單位與就讀系所簽核，再交註冊課務組複審，別只完成線上輸入。":"During the application period, complete the credit transfer system, print the form, and prepare the original transcript from your previous school. Follow the notice to obtain approval from the course-offering unit and your department, then submit it to the Division of Registrar and Curriculum for further review; online entry alone is not completion.","先查已核准抵免的科目，再問是否仍需自行調整本學期課表。若結果和申請內容不同，拿申請表及成績證明詢問，不要把送件或初審當成全部完成。":"Check which credits have been approved, then ask whether you need to adjust this semester’s timetable yourself. If the result differs from your application, bring the application form and transcript to ask; submitting documents or passing the first review does not finish the process.","向系辦確認自己這一屆要用哪份專題辦法，並一次詢問組隊、異動、審查與補審的表單。先核對版本與適用對象，不直接沿用學長姐留下的檔案。":"Confirm with the department office which capstone project regulations apply to your cohort, and ask for all forms regarding team formation, team changes, reviews, and makeup reviews at once. Check the version and target audience first; do not directly reuse files handed down from seniors.","把作品目前完成度與待辦清單給指導老師，詢問各次審查要展示哪些內容。再按當屆公告倒排製作與整理文件的時間，留出修改空間，不自行猜截止日。":"Present your current work progress and to-do list to your advisor, asking what content must be presented at each review. Then schedule your production and document preparation backwards according to cohort announcements, leaving room for revisions rather than guessing deadlines on your own.","交件前請老師確認作品、說明文件、展演資料與授權是否都需要，並逐項對照指定格式。完成後確認承辦有收到、是否需補件，不把作品做完當作程序結束。":"Before submission, have your advisor confirm whether the work, documentation, exhibition materials, and authorization forms are all required, checking item by item against designated formats. After submitting, verify receipt by the coordinator and whether supplementary files are needed; finishing the work does not mean official procedures are complete.","先找出入學分級結果及已修、抵免的英文與外語課，和自己的課表核對。若有免修，向通識中心確認還需補哪些外語學分，別直接把免修當學分已補足。":"Retrieve your freshman English placement results as well as completed or waived English and foreign language courses, checking them against your curriculum. If granted a course waiver, confirm with the Center for General Education which foreign language credits still need to be made up; do not assume an exemption means credits are automatically fulfilled.","向通識中心說明入學年與目前成績，請協助找到語文承辦。報考檢定前先確認測驗、分數、證明效期與替代方案，別拿別校或獎助金標準直接套用。":"Explain your enrollment year and current grades to the Center for General Education to find the language program coordinator. Before registering for proficiency tests, verify acceptable tests, score thresholds, certificate validity periods, and alternative options; do not apply standards from other schools or scholarship programs.","把修課成績和語文承辦要求的證明分開整理，問清楚交件位置與認列方式。辦完再查畢業檢核；若仍顯示未通過，拿送件紀錄找承辦核對。":"Organize your course grades and the certificates required by the language coordinator separately, asking clearly where to submit them and how credits are recognized. Check your graduation audit afterward; if it still shows unpassed, bring your submission records to verify with the coordinator.","辦理前先聯絡系辦與註冊課務組，說明要休學或復學，以及自己的學籍情況。詢問導師或代理人可辦理的時間，再安排到校，避免領表後找不到簽核人員。":"Before processing, contact the department office and the Division of Registrar and Curriculum to explain whether you intend to suspend or resume studies, along with your enrollment status. Ask when your advisor or their designated deputy is available before scheduling your campus visit, avoiding being unable to find signing staff after picking up the form.","休學先備學生證；委託代辦時確認委託書，領表後按公告期限完成離校及繳件。復學則依本人收到的通知辦理，並確認通訊資料正確，別只停止上課。":"For suspension, prepare your student ID in advance; confirm power of attorney if delegating, and complete campus clearance and form submission within announced deadlines after collecting forms. For re-enrollment, follow the notice received and verify your contact information; never simply stop attending classes.","若是復學、轉入、轉系或延畢，主動向生輔組說明役男身分，確認需補哪些兵役文件。把學籍變動和兵役資料分開追蹤，不假設其中一項完成就全部辦妥。":"If resuming studies, transferring in, changing majors, or extending your studies, proactively inform the Student Assistance Division of your draft-eligible status and verify required military service documents. Track student status changes and military service records separately; do not assume completing one settles both.","先向生輔組說明困難發生時間、目前最急的支出，以及已申請或已領的補助。請承辦協助判斷適用方案，別只因錯過一項公告，就以為所有協助都結束。":"First explain to the Student Assistance Division when the hardship occurred, your most urgent expenses, and any subsidies already applied for or received. Ask the coordinator to help assess applicable assistance plans; do not assume all aid is unavailable just because you missed one announcement.","依承辦指定方案準備申請表、在學證明與事件相關文件，例如醫療或失業證明。所得、財產或戶籍資料是否需要、要哪個版本，也先問清楚再申請文件。":"Prepare the application form, certificate of enrollment, and incident-related documents—such as medical or unemployment certificates—based on the coordinator's designated scheme. Ask clearly whether income, property, or household registration records are required and which version is needed before applying for them.","送件前確認由自己交件還是學校統一辦理，並問清楚本案期限與補件方式。再核對姓名及款項資料是否正確；各方案期限不同，不沿用別張公告的日期。":"Before submitting, confirm whether you submit materials individually or the school processes them collectively, and clarify deadlines and methods for supplemental submissions. Check that your name and bank account details are correct; deadlines vary by program, so do not rely on dates from other notices.","先用自己能接受的方式告訴導師或校內承辦，目前是情緒、相處還是權益上的困難。若不知道該找誰，可以先請對方協助轉介，不必先替自己判定案件類型。":"First communicate to your advisor or campus staff in a way you feel comfortable with whether your current difficulty involves emotional distress, interpersonal issues, or student rights. If unsure whom to contact, ask them for a referral without needing to categorize the case type yourself beforehand.","到學校「在校學生」頁尋找線上預約諮商，依服務頁確認預約方式與可用時段。入口無法使用或不知道怎麼填時，請導師協助聯繫，別套用其他學校的流程。":"Visit the school's 'Current Students' page to look for online counseling appointments, confirming booking methods and available time slots on the service page. If the portal is unavailable or you do not know how to fill it out, ask your advisor to assist with contact; do not apply procedures from other universities.","把收到的通知、事情發生日期與想反映的問題整理好，先請承辦確認應走哪種程序。再問正式表單、送件方式與期限，不把一般申訴和性平案件當成同一件事。":"Organize received notifications, incident dates, and issues you wish to report, and first ask the coordinator which procedure should be followed. Then ask about official forms, submission methods, and deadlines; do not treat general student grievances and gender equality cases as the same matter.","先選出能代表能力的作品，註明自己負責的部分，並把作品連結實際點開檢查。履歷依想應徵的工作整理，不用一次塞入所有作業，讓師長更容易給建議。":"Select representative works showcasing your abilities, specify the parts you were responsible for, and test each work's link to ensure it opens. Tailor your resume to target positions without stuffing in every past assignment, making it easier for mentors to offer guidance.","帶作品與履歷向相關領域老師討論，再問職發中心目前有哪些職涯諮詢、職能檢測或徵才活動。把不確定的職務與技能列成問題，別只詢問有沒有工作。":"Take your portfolio and resume to consult teachers in relevant fields, then ask the Career Development Center about available career counseling, skills assessments, or recruitment events. Frame specific questions about unfamiliar job functions and skills rather than just asking if there are jobs available.","每個職缺都重新核對工作內容、應交資料與投件期限，再依公司指定方式送出。保留投件日期與聯絡紀錄；過往徵才海報只能參考，不代表職缺現在仍開放。":"For each vacancy, recheck job responsibilities, required application materials, and submission deadlines before sending via the company's designated channel. Retain application dates and communication records; past recruitment posters serve only as reference and do not mean vacancies remain open.","先挑一兩件作品或專題，整理自己想繼續研究的問題，再找導師或專題老師討論。一起確認適合的領域、準備方向與作品呈現方式，再依興趣找研究所。":"First select one or two works or capstone projects and formulate the research topics you wish to pursue further, then consult your advisor or capstone advisor. Confirm suitable fields, preparation directions, and portfolio presentation methods together before looking for graduate programs based on your interests.","從報考學校官方入口下載當年度簡章，逐項看身分資格、所別書審與面試要求。本校應屆生還要核對簡章指定證明；其他校所不能共用同一份清單。":"Download the current year's admissions brochure from the target university's official portal, checking eligibility criteria, graduate program document evaluations, and interview requirements line by line. Graduating students from our university must also verify brochure-specified certificates; do not share the same checklist across different universities and programs.","依簡章確認繳費期限與上傳格式，完成後檢查是否已確認送出，不是只把檔案放上去。再從官方系統追蹤審查或通知；不同身分可能有不同截止日。":"Verify payment deadlines and file upload formats according to the brochure; after completing, check that final submission is confirmed rather than simply uploading files. Track review statuses and notices through the official portal; different applicant categories may have different deadlines.","先問系辦與職發中心目前是否有公開甄選，再索取這一梯次的條件與表單。過去赴日實習新聞只能看成果，不能拿它當現在仍有名額或固定補助的依據。":"First ask the department office and the Career Development Center whether open selections are currently held, then obtain requirements and forms for this cycle. Past news articles about internships in Japan only reflect past results and cannot be taken as evidence that openings or fixed subsidies still exist.","把國籍、學籍、語言與作品條件逐項對照甄選文件，另外問補助包含什麼、自己要付多少。能參加實習不等於能領學海補助，金額及資格都要依核定文件確認。":"Check nationality, student status, language skills, and portfolio requirements item by item against selection documents, and inquire what subsidies cover and how much you must pay yourself. Being accepted into an internship does not equal receiving MOE XueHai subsidies; both funding amounts and eligibility must be verified via approved documentation.","錄取後先核對契約中的實習機構、期間與補助，再請承辦協助確認醫療、意外保險及合法實習簽證。也問清楚行前說明、當地聯絡與返校成果要怎麼辦理。":"After being admitted, verify the host institution, internship duration, and subsidies in the contract, then ask the coordinator for help confirming medical/accident insurance and a legal internship visa. Also clarify how pre-departure orientation, local contact channels, and post-return outcome submissions are handled.","向系辦說明想參訪的領域與可出國時間，問目前有沒有見學或短期移地教學。先拿到當期安排再規劃，不把往年展演營或交流照片當作正在招募。":"Explain to the department office your intended fields of visit and available travel dates, asking whether overseas study visits or short-term field study programs are currently available. Obtain the current schedule before making plans; do not assume past exhibition camps or exchange photos mean recruitment is active.","報名前把行程、自付費用、可能補助與取消條件問清楚；若想認列課程或實習，也先取得系辦確認。參訪交流與職場實習不同，不能只因出國就直接計入。":"Before registering, inquire thoroughly about the itinerary, out-of-pocket costs, possible subsidies, and cancellation terms; if you wish to apply for course or internship credits, obtain prior confirmation from the department office. Overseas study visits and exchanges differ from workplace internships; credits cannot be granted simply because you travel abroad.","有當期公告後，再依主辦單位要求核對報名文件、護照、保險與入境準備。也確認帶隊或緊急聯絡方式及返校是否要交成果，不直接沿用海外實習的文件清單。":"Once the current announcement is published, verify application documents, passport, insurance, and entry preparations according to organizer requirements. Also confirm chaperones, emergency contact methods, and whether post-return outcome reports are required; do not directly reuse document checklists from overseas internships.",依需求查找:"Choose what you need",辦理流程:"Process overview",各項說明:"Details for each option",步驟說明:"Step details",核對入學年度:"Check your entry year",整理未通過項目:"List unmet requirements",向系辦確認補修:"Ask the department about make-up courses",取得當期實習規定:"Get the current internship rules",確認單位與老師:"Confirm the host and supervisor",完成合約保險確認:"Confirm the contract and insurance",先查系上認列範圍:"Check what the department accepts",考取後登錄證明:"Register your certificate after passing",另查獎助資格送件:"Check and apply for certificate awards separately",確認假別與證明:"Check the leave type and evidence",到系統提出申請:"Apply through the university system",追蹤簽核結果:"Track the approval status",先核對必修與時間:"Check required courses and times",依公告初選加退選:"Register, add or drop as announced",重開系統確認結果:"Reopen the system to check the result",系統填寫並印表:"Complete and print the online form",送交系所初審:"Submit for initial departmental review",依初審調整選課:"Adjust courses after the initial review",文件交註冊課務組:"Submit documents to Registration and Curriculum",查詢最後核定結果:"Check the final decision",先取當屆辦法表單:"Get your cohort’s rules and forms",與老師排審查進度:"Plan reviews with your supervisor",依要求交作品文件:"Submit the required work and documents",核對分級與外語學分:"Check placement and language credits",確認門檻通過方式:"Check how to meet the requirement",完成認列再查檢核:"Complete recognition and recheck your record",想辦休學或退學:"Requesting leave or withdrawal",準備復學或續休:"Returning or extending leave",另查自己的兵役事項:"Check military-service matters separately",說明困難與已領補助:"Explain your needs and existing aid",確認方案備妥資料:"Choose a scheme and prepare documents",依期限送件追蹤補件:"Submit on time and track missing documents",先找師長協助轉介:"Ask a teacher for help or referral",需要時預約諮商:"Book counseling if needed",權益事件找正式窗口:"Use the official channel for rights issues",準備履歷與作品集:"Prepare your CV and portfolio",詢問師長職發資源:"Ask teachers and Career Services",依職缺投件並追蹤:"Apply as required and track responses",帶作品討論升學方向:"Discuss study plans with your work",查當年度簡章資格:"Check this year’s admission requirements",完成報名並追蹤審查:"Complete your application and track review",先查當期甄選機會:"Check current recruitment opportunities",核對資格費用與補助:"Check eligibility, costs and funding",錄取後完成行前準備:"Prepare for departure after acceptance",詢問當期見學或課程:"Ask about current visits or courses",核對行程費用與認列:"Check the itinerary, cost and recognition",依文件報名準備出國:"Follow the documents to apply and prepare","不同入學年與班別分開核對；有缺項就找系辦確認補修或認列。":"Check the rules for your entry year and program. Ask the department about making up or recognizing anything missing.","這是開始實習前的準備；實習中怎麼聯絡老師、結束後交什麼，也請先問清楚。":"These are preparations before starting an internship. Also ask how to contact your supervisor during it and what to submit afterward.","畢業認列與獎助是兩件事；獎助須另查當期資格及期限。":"Graduation recognition and awards are separate. Check the current eligibility and deadline for awards.","有考試、較長假期或緊急狀況，先向承辦確認另外要辦的事。":"If exams, extended leave or an emergency are involved, ask the responsible office about additional procedures.","選課成功與課程異動都要再查；已截止的時程不代表仍可補選。":"Recheck both registration and course changes. A past schedule does not mean late registration is still available.","先核對可申請身分與當期期限；初審後的加退選要自己辦，不等最後核定才處理。":"Check your eligibility and the current deadline first. Make course changes yourself after the initial review; do not wait for the final decision.","分組、審查日期、作品格式與展演要求，先取得當屆文件再排進度。":"Get your cohort’s documents before planning groups, review dates, work formats and exhibition requirements.","英文課程學分與英文能力門檻要分開確認；分級免修也要問清楚補足方式。":"Check English course credits separately from proficiency requirements. If placement exempts you from a course, ask how to make up the required credits.","依目前狀況選一項；役男的緩徵或儘後召集另外向生輔組確認。":"Choose what fits your situation. Students subject to military service must separately check deferment or reserve-call arrangements with Student Life Guidance.","休學與復學依目前狀況擇一辦理；役男另向生輔組確認兵役，不以完成學籍程序代替。":"Apply for leave or return according to your situation. Students subject to military service must also check with Student Life Guidance; academic-status procedures do not replace military-service procedures.","急難慰助、助學金與學雜費減免各有資格和期限，先請承辦協助選方案。":"Emergency relief, student aid and tuition reductions have different conditions and deadlines. Ask the office to help identify the right scheme.","依需求直接找窗口，不必先諮商才能提出權益問題。":"Contact the appropriate office directly. Counseling is not a prerequisite for raising a rights issue.","可同步找師長討論與使用職發資源，依各職缺要求準備作品。":"You can consult teachers and use Career Services at the same time. Prepare your work for each position’s requirements.","本校與外校各看自己的簡章；送出後仍要查資格審查與補件狀態。":"Check each university’s own admission guide. After submission, keep checking eligibility review and requests for additional documents.","海外實習的甄選、補助與出國文件分開確認；歷屆成果不代表本期已開放。":"Check overseas internship selection, funding and travel documents separately. Past achievements do not mean applications are currently open.","見學、交換與海外實習的申請和補助不同，依正在招募的團或課程辦理。":"Study visits, exchanges and overseas internships have different applications and funding. Follow the group or course currently recruiting.",到系統填寫申請並印出紙本:"Complete the online application and print it",送請開課單位與就讀系所主管初審:"Request initial review by the course unit and your department heads",依初審結果自行辦理加退選:"Make course changes yourself based on the initial review",將申請表及證明交註冊課務組:"Submit the form and evidence to Registration and Curriculum",回到系統查詢核定結果:"Return to the system to check the final decision","先確認申請身分與當期截止日，再到校務系統填寫並印表。備妥原校歷年成績單正本及適用的證明，一次整理齊全。":"Check your eligibility and the current deadline, then complete and print the form in the university system. Prepare the original transcript from your previous institution and any applicable evidence together.","把申請資料交給開課單位與自己就讀的系所主管審查。哪些課程可以抵免，先依這個初審結果確認。":"Submit your documents to the heads of the course-offering unit and your own department. Use the initial review to check which courses may receive credit.","初審通過的課程如果仍在課表裡，要自行處理退選；也一起確認需要補選哪些課。不要等最後核定後才開始處理。":"If a course approved at the initial review is still on your timetable, drop it yourself and check what you need to add. Do not wait for the final decision to start making changes.","依規定把經初審的申請表與證明資料交到教務處註冊課務組。資料請一次備齊，送件仍須在當期受理期間內完成。":"Submit the initially reviewed form and evidence to Registration and Curriculum as required. Prepare all documents together and submit them within the current application period.","送件後回校務系統查詢最後核定情形，再與自己的課表及畢業檢核核對。有落差時，帶結果找註冊課務組確認。":"After submission, check the final decision in the university system and compare it with your timetable and graduation check. Bring any discrepancies to Registration and Curriculum.","休學：先聯繫系所，再到教務處領表":"Leave of absence: contact your department, then collect the form","復學或續休：依通知回覆並辦理":"Return or extended leave: reply and proceed as notified","兵役：另向生輔組確認資料":"Military service: check separately with Student Life Guidance","先約好導師或系所承辦，再到註冊課務組登記領表。依當期公告完成訪談、離校與交回文件；領表日期會影響退費計算。":"Arrange a time with your adviser or department office, then register and collect the form from Registration and Curriculum. Complete the interviews, clearance and document return as announced; the form-collection date affects refund calculations.","收到復學通知後，依通知期限回覆復學或繼續休學，確認下一學期的註冊安排。若因服役辦理休復學，另問註冊課務組需要哪些證明。":"When you receive a return notice, reply by its deadline to return or extend your leave, and confirm next semester’s registration. If military service is involved, ask Registration and Curriculum which evidence is required.","轉入、復學或延畢等學籍有變動時，另向生輔組確認兵役資料及緩徵或儘後召集是否要辦理。不要把學籍手續視為兵役也已完成。":"When transferring, returning or extending your studies, check your military-service records and any deferment or reserve-call procedures separately with Student Life Guidance. Completing academic-status procedures does not complete military-service procedures.","教務處抵免學分：115-1申請程序":"Academic Affairs: credit-transfer procedure for 11 與物件能力 ● 培育前瞻性即時影音合成技術人才 ● 培育動畫多媒體與遊戲開發之整合應用人才 ● 培養學生了解實體攝影機與虛擬攝影機連動之動態追蹤定位能力":`モーションキャプチャー実習室は、次世代デジタルコンテンツの発信と制作を担う先駆的デジタルクリエイターを育成する中核拠点です。バーチャルプロダクション技術を学科の教育カリキュラムに導入し、ポストプロダクションを必要とせずスタジオ内でリアルタイムにリアルなシーンを撮影できる教育実習環境を提供します。空間トラッキングや照明投影技術により、仮想世界を現実世界の中に再構築します。3Dアニメーションの映像撮影、映像ポストプロダクション、VFX処理、映像合成、モーションキャプチャーなどを実施できます。

● 空間トラッキングVIVE環境`,偶動畫實驗室:"パペットアニメーション実習室","停格動畫拍攝棚，立體造型 × 逐格手作的工藝場域。":"コマ撮りアニメーション撮影スタジオ。立体造形×手作業によるコマ撮りのクラフト工房。","偶動畫實驗室是專為停格動畫（Stop-motion）設計的拍攝場域，配備可控光源、攝影軌道與專業拍攝軟體。學生在這裡完成立體造型製作、逐格拍攝、後製合成的完整流程，培養動畫工藝與耐心觀察的素養。":"パペットアニメーション実習室は、ストップモーション（コマ撮り）アニメーション専用に設計された撮影スペースで、調光可能な照明、撮影用スライダーレール、専門撮影ソフトウェアを完備しています。学生はこの場で立体造形物の制作からコマ撮り撮影、ポスプロ合成までの一連の工程を経験し、アニメーションのクラフトマンシップと丁寧な観察眼を養います。",週邊商品設計實驗室:"グッズデザイン実習室","3D 印表機、直噴機、熱轉印、雷射切割 — 動漫遊戲周邊一條龍。":"3Dプリンター、ダイレクトプリンター、熱転写機、レーザーカッター — アニメ・ゲームグッズ制作のワンストップ環境。","週邊商品設計實驗室提供動漫、遊戲相關週邊商品設計所需環境設備，讓學生把角色與 IP 變成實體商品。 設備包含： ● 3D 印表機 ● 直噴機 ● 熱轉印 ● 雷射切割機":`グッズデザイン実習室は、アニメやゲーム関連のキャラクターグッズ・周辺商品のデザインに必要な設備と環境を備え、学生が自らのキャラクターやIPを実体のある商品へと具現化できるようにサポートします。

保有設備：

● レーザーカッター`,虛擬運動科藝館:"バーチャルスポーツ・テクノロジーアート館","運動 × 科技數位化創新場館。":"「スポーツ×テクノロジー」によるデジタルイノベーション施設。","虛擬運動科藝館培育新一代「運動 × 科技」之數位化創新經濟人才。創造智慧場館營運新模式，促進室內場館智慧化；再來科技加值戶外運動，針對開放式之戶外運動場域特性（如登山、路跑、自行車等），發展戶外運動場域營運新模式。 預期教育目標： ● 培養學生運動科學專業知識 ● 培養學生對於傳統運動與數位化運動內容之加值應用 ● 培育前瞻性「運動 × 科技」數位化創新經濟人才 ● 培養學生對於「運動 × 科技」之跨域創新展演策畫與實踐能力":`バーチャルスポーツ・テクノロジーアート館は、次世代の「スポーツ×テクノロジー」を担うデジタルイノベーション経済人材を育成する拠点です。スマートスタジアム・施設の新たな運営モデルを創出し、屋内施設のスマート化を推進するとともに、登山、ロードレース、サイクリングなどの開放型アウトドアスポーツの特性に合わせた技術付加価値を与え、屋外スポーツ空間の新たな運用モデルを開発します。

教育目標：
● スポーツ科学に関する専門知識の育成
● 従来のスポーツとデジタルスポーツコンテンツを結ぶ高付加価値応用能力の育成
● 先進的な「スポーツ×テクノロジー」デジタルイノベーション人材の育成
● 「スポーツ×テクノロジー」に関する領域横断的な展示・公演の企画および実践能力の育成`,影音後製及自媒體節目製作實驗室:"映像音響ポストプロダクション・自メディア番組制作実習室","4 間數位攝影棚 + 4 間錄音室，主播、聲優、配樂、3D 後製一站到位。":"4室のデジタルスタジオ＋4室の録音スタジオ完備。配信キャスター、声優、楽曲制作、3Dポストプロダクションまでワンストップで対応。","影音後製及自媒體節目製作實驗室共 4 間數位攝影棚、4 間錄音室，培育主播、自媒體與傳播、聲音後製、遊戲音效、3D 後製以及動畫、配樂、影視、數位學習、廣播、聲優等相關人才。":"映像音響ポストプロダクション・自メディア番組制作実習室には、計4室のデジタルスタジオと4室の録音スタジオが設置されており、番組キャスター、自メディア・メディアコミュニケーション、音声編集、ゲーム音響効果、3Dポストプロダクション、ならびにアニメーション、劇伴音楽、映像、デジタルラーニング、ラジオ放送、声優などの関連分野で活躍する専門人材を育成します。","橫山創意基地（數位科技文化創意工坊）":"横山クリエイティブベース（デジタルテクノロジー・文化創造工房）","Maker 自造者文化基地，DIY × 科技元素跨域創作。":"メイカー（自造者）文化の拠点。DIY×テクノロジーによる領域横断的な創作スペース。","橫山創意基地（H0201 數位科技文化創意工坊）是 Maker（自造者）文化的實踐場域。自造者文化是在大眾文化當中產生的變種文化，植根於有獨特興趣且抱有執著信念的人群；自造者酷愛科技、熱衷親自實踐，堅信自己動手豐衣足食。 自造者文化是 DIY 文化的延伸，融合了技術元素，是龐克理念與反消費主義的結合。本工坊提供雷射切割、3D 列印、電子製作、木工等基礎設備，鼓勵學生跨域實作。":`横山クリエイティブベース（H0201 デジタルテクノロジー・文化創造工房）は、メイカー（自造者）文化の実践拠点です。メイカー文化は大衆文化の中から派生した独自のサブカルチャーであり、特異な興味と強い信念を持つ人々に根ざしています。メイカーたちはテクノロジーを愛し、自らの手による実践に情熱を注ぎ、「自分の手で作る」ことを信条としています。

指導する短編アニメーション《癡迷的現實》が、国際映画祭でのノミネート・入選累計13件を達成しました。","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）學生原創動畫《癡迷的現實》再傳捷報。繼今年 4 月以 8 項國際影展紀錄登上系上「四部學生動畫橫掃國際影展」專題後，該片近日再獲阿拉伯聯合大公國、美國、印度、日本、義大利等五國影展青睞，一口氣新增 5 項入圍與提名，國際影展入圍提名累計達 13 項，足跡橫跨 7 個國家。 ■ 本次新增 5 項 • 阿拉伯聯合大公國「杜拜獨立影展」Dubai Independent Film Festival — Best Student Short 競賽單元 · 半決賽入圍 • 美國「芝加哥獨立影展」Chicago Indie Film Awards — Best Student Film 競賽單元 · 提名 • 印度「希瓦吉國際影展」Chhatrapati Shivaji International Film Festival — Animated Short Film 競賽單元 · 入圍 • 日本「東京國際電影獎」Tokyo International Cinema Awards — Best Animation 競賽單元 · 提名 • 第 15 屆「義大利國際旅遊影展」International Tour Film Festival — Animation 競賽單元 · 入圍 ■ 關於作品 《癡迷的現實》由動遊系學生陳志揚、宋秋陽、藤川黎星共同創作，陳美蓉老師指導。全片採 2D 數位手繪製作，以 1980 年代懷舊美術風格鋪陳偶像崇拜與理性認知之間的衝突，探討「單純喜歡」與「完全迷戀」之間的界線，提醒觀眾癡迷往往源自於了解不足，唯有理性支持才是真正的成長。作品呼應 SDG 4「優質教育」與 SDG 12「負責任消費與生產」，在社群時代的媒體素養議題上展現高度思辨性。 ■ 國內戰績 第 21 屆技專校院電腦動畫競賽「佳作」、2025 巴哈姆特 ACG 創作大賽動畫組「優選賞」、第 17 屆小花豹青年短片大獎「最佳劇情短片」，並入圍 2025 放視大賞 2D 動畫組。 指導老師陳美蓉表示，一部學生畢業製作能持續在不同國家的影展被看見，代表作品談的議題本身跨越了語言與文化。系主任鄧樹遠指出，動遊系長期強調「實務創作 × 社會價值」，鼓勵學生把畢業製作視為進入國際市場的第一張作品集，而非課程的終點。":"【高雄発】樹徳科技大学アニメとゲームデザイン学科の学生によるオリジナルアニメーション《癡迷的現實》が再び快挙を達成しました。今年4月に8つの国際映画祭選出実績によって学科の特集「四部學生動畫橫掃國際影展」に掲載されたのに続き、同作は先ごろ新たにアラブ首長国連邦、アメリカ、インド、日本、イタリアの5カ国の映画祭でも高く評価され、一挙に5つのノミネートおよび入選を果たしました。これにより国際映画祭でのノミネート・入選は累計13件に達し、世界7カ国に足跡を刻んでいます。 ■ 今回新たに追加された5件 • アラブ首長国連邦「ドバイ独立映画祭」Dubai Independent Film Festival — Best Student Short コンペティション部門 · セミファイナリスト • アメリカ「シカゴ・インディペンデント映画賞」Chicago Indie Film Awards — Best Student Film コンペティション部門 · ノミネート • インド「チャトラパティ・シヴァージー国際映画祭」Chhatrapati Shivaji International Film Festival — Animated Short Film コンペティション部門 · 入選 • 日本「東京国際映画賞」Tokyo International Cinema Awards — Best Animation コンペティション部門 · ノミネート • 第15回「イタリア国際ツアー映画祭」International Tour Film Festival — Animation コンペティション部門 · 入選 ■ 作品について 《癡迷的現實》は、アニメとゲームデザイン学科の学生である陳志揚、宋秋陽、藤川黎星が共同制作し、陳美蓉教員が指導を担当しました。全編2Dデジタル手描きで制作され、1980年代のレトロな美術スタイルを通じてアイドル崇拝と理性的認知の葛藤を描写。「純粋な好意」と「完全な執着」の境界を探求し、盲信や執着は往々にして理解不足から生じるものであり、理性的な応援こそが真の成長につながることを観客に問いかけています。本作品はSDG 4「質の高い教育をみんなに」およびSDG 12「つくる責任 つかう責任」に呼応し、ソーシャルメディア時代におけるメディアリテラシーの課題に対して深い思弁性を発揮しています。 ■ 台湾国内での実績 第21回技專校院電腦動畫競賽「佳作」、2025巴哈姆特ACG創作大賽アニメーショングループ「優選賞」、第17回小花豹青年短片大獎「最佳劇情短片」を受賞し、2025放視大賞2Dアニメーショングループに入選。 指導教員の陳美蓉教員は、「学生の卒業制作が各国の映画祭で継続的に評価されていることは、作品が扱うテーマ自体が言語や文化を超越している証です」と述べました。学科主任の鄧樹遠主任は、「アニメとゲームデザイン学科では長期にわたり『実践的創作 × 社会的価値』を重視しており、卒業制作を単なる履修の終着点ではなく、国際市場へ進出するための最初のポートフォリオとして位置づけるよう学生を奨励しています」と指摘しました。","累計 13 項國際入圍提名":"国際的なノミネート・入選 累計13件",癡迷的現實:"癡迷的現實","Animation Short Film · 動畫短片":"Animation Short Film · 短編アニメーション","陳志揚 · 宋秋陽 · 藤川黎星":"陳志揚 · 宋秋陽 · 藤川黎星","以 1980 年代懷舊美術風格呈現偶像崇拜與理性認知的衝突，融入 SDG 4「優質教育」與 SDG 12「負責任消費與生產」。國際影展入圍提名累計 13 項，橫跨西、土、美、印、阿聯、日、義 7 國。":"1980年代のレトロな美術スタイルでアイドル崇拝と理性的認知の葛藤を描き、SDG 4「質の高い教育をみんなに」およびSDG 12「つくる責任 つかう責任」を取り入れました。国際映画祭でのノミネート・入選は累計13件に達し、スペイン、トルコ、アメリカ、インド、アラブ首長国連邦、日本、イタリアの世界7カ国にまたがっています。","阿聯 杜拜獨立影展 · Best Student Short 半決賽入圍 ★NEW":"アラブ首長国連邦 ドバイ独立映画祭 · Best Student Short セミファイナリスト ★NEW","美國 芝加哥獨立影展 · Best Student Film 提名 ★NEW":"アメリカ シカゴ・インディペンデント映画賞 · Best Student Film ノミネート ★NEW","印度 希瓦吉國際影展 · Animated Short Film 入圍 ★NEW":"インド チャトラパティ・シヴァージー国際映画祭 · Animated Short Film 入選 ★NEW","日本 東京國際電影獎 · Best Animation 提名 ★NEW":"日本 東京国際映画賞 · Best Animation ノミネート ★NEW","第 15 屆 義大利國際旅遊影展 · Animation 入圍 ★NEW":"第15回 イタリア国際ツアー映画祭 · Animation 入選 ★NEW","巴塞隆納 Author Film Festival 入圍":"バルセロナ Author Film Festival 入選","西班牙 Stop Motion Film Festival 決賽":"スペイン Stop Motion Film Festival ファイナリスト","美國奧蘭多獨立電影節 · Best Student 半決賽":"アメリカ・オーランド独立映画祭 · Best Student セミファイナル","土耳其紐約伊斯坦堡短片影展 · Best Animation 入圍":"トルコ・ニューヨーク・イスタンブール短編映画祭 · Best Animation 入選","印度畢卡索國際電影節 · Animated Short 入圍":"インド・ピカソ国際映画祭 · Animated Short 入選","西班牙 Love Film Festival 決賽":"スペイン Love Film Festival ファイナリスト","美國拉斯維加斯短片影展 · Best Student 提名":"アメリカ・ラスベガス短編映画祭 · Best Student ノミネート","美國洛杉磯獨立影展 · Best Student 提名":"アメリカ・ロサンゼルス独立映画祭 · Best Student ノミネート","設計力出海！動遊系赴日實習邁入第九屆 · 4 名學生進駐 HC 公司挑戰日本職場":"デザイン力で世界へ！アニメとゲームデザイン学科の日本インターンシップが第9期を迎える · 4名の学生がHC社に配属され日本のビジネス現場に挑戦","教育部「學海築夢」計畫今年派 4 名學生赴日本愛媛縣松山市 HC 公司實習近三個月，由張純雅老師帶隊，並延伸至西予市、砥部町的地方創生與傳統工藝交流。":"教育部「学海築夢」プログラムのもと、今年は4名の学生が張純雅教員の引率で日本の愛媛県松山市にあるHC社へ派遣され、約3カ月間のインターンシップを実施しました。さらに、西予市や砥部町における地方創生や伝統工芸の交流にも取り組みを広げました。","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）與日本知名動畫及遊戲製作公司「オートクチュール株式会社」（Hautecouture Inc.，簡稱 HC 公司）的國際實習合作邁入第九屆。今年雙方再度攜手執行教育部「學海築夢」海外實習計畫，展開為期近三個月的海外實習，實質強化學生的專業技能與國際視野。 本次計畫由動遊系國際小組成員張純雅老師與尹立老師共同策劃與執行。依據系上嚴格的海外實習遴選機制，學生須通過培訓、徵選、書面審查、初試與日語面試等多重關卡，並與 HC 公司進行全日文線上面試。今年度共錄取 4 位表現優異的學生，包含 3 位來自台灣的學生（王韻淑、夏妤馨、蕭培綸）以及 1 位來自澳門的學生（賴健豪），實習期間直接投入 HC 公司旗下動畫與遊戲專案，學習業界最新的設計技術與團隊協作模式。 ■ 從歡迎儀式到專案第一線 計畫主持人張純雅老師親自帶隊前往日本愛媛縣松山市，協助學生安頓租屋處、辦理通勤卡等生活必需事項，幫助學生迅速融入當地。實習首日，HC 公司為學生舉辦溫馨的歡迎儀式；學生隨後參與公司早會，與 HC 公司高層及各分公司成員進行線上會議並自我介紹。會中由公司分配實習任務，涵蓋插畫設計、人物角色設計、遊戲美術圖繪製等專案工作，讓學生實際進入業界真實製作流程，獲得寶貴的實戰經驗。 ■ 跨國文化分享 × 地方創生體驗 今年的實習計畫在專業技術之外，更大幅強化文化交流的深度。在企業實習期間，同學們於交流會議中主動分享台灣與澳門的文化特色，與日本公司同仁進行熱烈的雙向交流，展現跨國合作的青春活力與專業自信。此外，張純雅老師特別帶領實習團隊前往愛媛縣西予市，拜訪並參觀宇和先哲記念館，與一般社團法人西予市觀光物產協會的松本先生、山本先生以及產業部經濟振興課的宇都宮先生進行深度文化對話，交流台日兩地在地方觀光與文化推廣上的經驗。實習團隊隨後也前往砥部町，針對當地極具代表性的傳統工藝「砥部燒」進行文化拍攝與影像紀錄，讓學生從實地走訪中汲取創作養分，導入設計專案的製作與執行。 ■ 上一屆成果落地為 AR 導覽 回顧過往，動遊系赴日實習計畫成果豐碩。上一屆實習生與日本當地大學生共同製作的角色設計，已成功應用於日本愛媛縣砥部町的 AR 角色導覽活動「まるっとARスタンプラリー」，參與學生的姓名亦公開於官方活動網站，獲得日方企業與地方政府的高度肯定。 計畫主持人張純雅老師表示，這不僅是一次專業實習，更是一場跨文化、跨領域的深度體驗，期許學生在拓展國際視野的同時，為未來職涯奠定重要基礎。動遊系鄧樹遠主任也指出，系上長期重視學生的國際實務歷練，未來將持續拓展合作平台，讓學生走向世界、學用合一，持續支持國際實習專案，培育具備全球競爭力的創意人才。":"【高雄発】樹徳科技大学アニメとゲームデザイン学科（動遊系）と日本の著名なアニメ・ゲーム制作会社「オートクチュール株式会社」（Hautecouture Inc.、略称HC社）による国際インターンシップ連携が第9期を迎えました。今年度も双方が再び連携し、教育部「学海築夢」海外インターンシップ計画を実施。約3か月にわたる海外インターンシップを展開し、学生の専門スキルと国際的視野の実質的な強化を図ります。 本計画は動遊系国際チームメンバーの張純雅教員と尹立教員が共同で企画・実施しました。学科の厳格な海外インターンシップ選抜制度に基づき、学生はトレーニング、公募選考、書類審査、一次選考、日本語面接などの多重の選考を通過した上で、HC社との全編日本語によるオンライン面接に臨みました。今年度は優秀な成績を収めた学生4名（台湾出身の学生3名［王韻淑、夏妤馨、蕭培綸］、マカオ出身の学生1名［賴健豪］）が採用され、インターンシップ期間中はHC社傘下のアニメ・ゲームプロジェクトに直接参画し、業界最先端の設計技術とチーム協業体制を学びます。 ■ 歓迎式典からプロジェクト最前線へ プロジェクト責任者の張純雅教員自らが引率して日本の愛媛県松山市を訪れ、学生の住居確保や通勤定期券の手続きなど生活必需事項をサポートし、現地生活への迅速な適応を支援しました。インターンシップ初日、HC社は学生のために温かい歓迎式典を開催。学生はその後同社の朝会に参加し、HC社幹部や各支社メンバーとのオンライン会議で自己紹介を行いました。会議ではイラストレーション設計、キャラクターデザイン、ゲームアート制作などのプロジェクト業務が会社側から割り当てられ、学生たちは業界の実際の制作フローに入り、貴重な実践経験を積みました。 ■ 国際文化交流×地方創生体験 今年度のインターンシップ計画は専門技術にとどまらず、文化交流の深度も大幅に強化しました。企業インターンシップ期間中、学生たちは交流会で台湾とマカオの文化的特色を積極的に共有し、日本企業の社員と熱意あふれる双方向交流を展開。国境を越えた協力における若々しい活力と専門的な自信を示しました。さらに、張純雅教員はインターンシップチームを率いて愛媛県西予市を訪れ、宇和先哲記念館を訪問・見学。一般社団法人西予市観光物産協会の松本氏、山本氏、ならびに産業部経済振興課の宇都宮氏と深い文化対話を行い、地域観光や文化振興における台日双方の経験について意見を交換しました。インターンシップチームは続いて砥部町も訪れ、同町を代表する伝統工芸「砥部焼」に関する文化撮影と映像記録を実施。現地での実地調査から創作の糧を汲み取り、デザインプロジェクトの制作・実施へと活かしました。 ■ 前期の成果がARガイドとして実装 これまでを振り返ると、動遊系の日本インターンシップ計画は豊かな成果を上げています。前期のインターン生が日本の現地大学生と共同制作したキャラクターデザインは、愛媛県砥部町のARキャラクターガイドイベント「まるっとARスタンプラリー」に採用され、参加学生の氏名も公式イベントサイトに掲載されるなど、日本企業や地方自治体から高い評価を受けました。 プロジェクト責任者の張純雅教員は、「これは単なる専門インターンシップにとどまらず、文化や分野を越えた深い体験であり、学生たちが国際的な視野を広げると同時に、将来のキャリアに向けた重要な基盤を築くことを期待しています」と語りました。動遊系の鄧樹遠主任も、「当学科では長期にわたり学生の国際的な実務経験を重視しており、今後も協力プラットフォームを広げ、学生の世界進出と学用合一を推進します。国際インターンシップ事業を継続して支援し、グローバルな競争力を備えたクリエイティブ人材を育成していきます」と指摘しました。","赴日實習現場紀實 · 松山 × 西予 × 砥部町":"日本インターンシップ現地レポート · 松山 × 西予 × 砥部町","日本愛媛縣砥部町 AR 角色導覽活動「まるっとARスタンプラリー」活動影片":"日本愛媛県砥部町 ARキャラクターガイドイベント「まるっとARスタンプラリー」イベント動画","動遊系畢製《Dear, All Robots》躍上國際媒體 · CommonWealth English 與換日線專文報導":"動遊系卒業制作『Dear, All Robots』が国際メディアに掲載 · CommonWealth Englishと換日線の特集報道","陳美蓉老師指導的印尼學生團隊，以畢業動畫短片《Dear, All Robots》參與 2026 青春設計節，獲《CommonWealth English》與《換日線 Crossing》專文報導。":"陳美蓉教員が指導するインドネシア人学生チームが、卒業アニメーション短編『Dear, All Robots』で2026青春設計節に出展し、『CommonWealth English』および『換日線 Crossing』による特集記事で報道されました。","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）的創作能量再度獲得國際媒體肯定。由陳美蓉老師指導的印尼學生動畫團隊，以五分鐘畢業動畫短片《Dear, All Robots》參與 2026 青春設計節展出，近日獲國際英文媒體《CommonWealth English》及中文媒體《換日線 Crossing》專文報導，展現本系在動畫敘事、視覺風格與跨文化創作上的教學成果。 《Dear, All Robots》是一部於台灣完成製作的短篇動畫，描述一位在工作壓力與重複生活中逐漸失去色彩、彷彿成為「機器人」的上班族，因一隻帶有色彩的獨眼小貓闖入生命，而重新找回情感與作為「人」的溫度。作品以黑白色調與回憶中鮮明色彩的對比，呈現青年世代在理想、就業與現實壓力間拉扯的共同焦慮。 主創者之一 Ryan Evan Limawi 表示，許多年輕人畢業後未必能立即找到理想工作，可能在日復一日中失去熱情；團隊希望傳遞的訊息是：即使第一份工作不符合夢想，只要持續嘗試與探索，未來仍有機會找到真正適合自己的方向。 ■ 從製作到展場推廣 展出期間除播放動畫短片外，團隊也同步展示角色模型、海報、設定集、貼紙、鑰匙圈、小貓玩偶及 LINE 貼圖等延伸設計，並邀請觀眾寫下觀影心得，完整呈現學生從動畫製作、角色經營到品牌推廣與觀眾互動的整合能力。 陳美蓉老師指出，動畫創作最重要的核心包括分鏡腳本、故事內容與視覺風格，而本團隊成功整合三者，展現成熟的敘事與創作能力。參與的印尼學生團隊也分享，台灣良好的中文學習與動畫創作環境，以及高雄對創作者友善的氛圍，是支援他們完成作品的重要力量。 動遊系表示，本片獲國際與中文媒體關注，反映本系長期深耕跨文化學習、專題製作、動畫敘事、角色設計與整合行銷的教學成果；未來將持續培育兼具技術能力、人文關懷與市場溝通力的動畫與遊戲設計人才。":"【高雄発】樹徳科技大学アニメとゲームデザイン学科（動遊系）の創作エネルギーが、再び国際メディアから高い評価を受けました。陳美蓉教員が指導するインドネシア人学生アニメーションチームが、5分間の卒業アニメーション短編『Dear, All Robots』で2026青春設計節に出展。このたび国際英語メディア『CommonWealth English』および中国語メディア『換日線 Crossing』による特集記事で報道され、本学科のアニメーションナラティブ、ビジュアルスタイル、異文化共創における教育成果を示しました。 『Dear, All Robots』は台湾で制作された短編アニメーションで、仕事のプレッシャーや繰り返される日常の中で次第に色彩を失い、まるで「ロボット」のようになってしまった会社員が、彩りを持つ片目の子猫と出会うことで感情と「人間」としての温もりを取り戻していく姿を描いています。作品は白黒のトーンと思い出の中の鮮やかな色彩との対比を通じて、若者世代が理想、就職、現実のプレッシャーの間で揺れ動く共通の不安を表現しています。 中心クリエイターの1人であるRyan Evan Limawiさんは、多くの若者が卒業後にすぐ理想の仕事を見つけられるとは限らず、日々の繰り返しの中で情熱を失ってしまうことがあるとし、チームが伝えたかったメッセージは、たとえ最初の仕事が夢と違っていても、挑戦と模索を続ければ、将来必ず自分に本当に合った方向性を見つけられるということであると語りました。 ■ 制作から展示プロモーションまで 展示期間中はアニメーション短編の上映に加え、キャラクターフィギュア、ポスター、設定資料集、ステッカー、キーホルダー、子猫のぬいぐるみ、LINEスタンプなどの展開デザインも同時に展示し、来場者に感想を書いてもらうなど、アニメーション制作からキャラクター展開、ブランドプロモーション、観客との双方向コミュニケーションに至る学生の総合的な能力を余すところなく発揮しました。 陳美蓉教員は、アニメーション創作において最も重要な核心は絵コンテ、ストーリー内容、ビジュアルスタイルであり、本チームはこの3つを見事に統合し、成熟した物語展開力と創作力を発揮したと指摘しました。参加したインドネシア人学生チームも、台湾の良好な中国語学習環境やアニメーション制作環境、そしてクリエイターに温かい高雄の雰囲気が、作品を完成させる上で大きな支えとなったと語っています。 動遊系は、本作が国際メディアおよび中国語メディアから注目されたことは、当学科が長年培ってきた異文化学習、卒業制作、アニメーションナラティブ、キャラクターデザイン、統合マーケティングの教育成果を反映するものであるとし、今後も技術力、人間への深い配慮、市場コミュニケーション力を兼ね備えたアニメーション・ゲームデザイン人材を育成し続けると述べています。","換日線 Crossing：剛畢業就變成了機器人？印尼留學生在高雄用 5 分鐘動畫，拍出亞洲年輕人生存焦慮（2026-06-11）":"換日線 Crossing：卒業してすぐにロボットに？インドネシア人留学生が高雄で5分のアニメーションを通じ、アジアの若者の生存不安を描き出す（2026-06-11）",入圍:"ノミネート","動遊系 2026 競賽佳績榜 · 14 件入圍 7 部畢業專題上榜":"動遊系 2026 コンテスト優秀実績 · 14件ノミネート 卒業制作7作品が選出","全國技專專題、青春設計節、放視大賞、金點新秀 — 4 大競賽 14 件入圍，7 部畢業專題作品榮耀上榜。":"全国技専専題、青春設計節、放視大賞、金点新秀 — 4大コンテストで14件がノミネート、7作品の卒業制作が見事選出されました。","【高雄訊】樹德科技大學動畫與遊戲設計系 2026 年度競賽傳出佳績，旗下 7 部畢業專題作品於 4 大全國指標競賽合計拿下 14 件入圍。本年度入圍實力涵蓋遊戲、動畫、創意數位影片、數位影像設計等多元類別。 ■ 4 大競賽入圍榜 ● 教育部「2026 全國技專校院學生實務專題製作競賽暨成果展」（National）— 入圍 1 件 《癒光之音：悅曲》動漫互動多媒體群 / 002 ● 駁二藝術特區「2026 青春設計節創意設計競賽」初選（Cultural）— 入圍 4 件 《癒光之音：悅曲》遊戲設計 / 323 《葛柏 TV 秀》遊戲設計 / 569 《D 專專題:"全國技專專題",青春設計節:"青春設計節",放視大賞:"放視大賞",金點新秀贊助特別獎:"金點新秀 協賛特別賞",競箱團:"競箱團","Animation · 動畫組":"Animation · アニメーション部門","林祐嬋 · 陳姵妏 · 吳柏邵 · 沈宗賢 · 王妤宸":"林祐嬋 · 陳姵妏 · 吳柏邵 · 沈宗賢 · 王妤宸","一對兄妹幫阿嬤簽收快遞，好奇心驅使下偷拆送錯包裹引來黑道追捕。黑道偽裝成輪椅老人在街道展開追逐。採用 2D 逐幀手繪動畫，以喜劇與誇張反差節奏（黑道老人、輪椅追逐）打破現實邏輯，在荒誕情節中構築強烈視覺張力。":"祖母の代わりに宅配物を受け取った兄妹が、好奇心から誤配送された荷物を勝手に開けてしまい、裏社会の組織から追われることに。車椅子の老人に変装した追手と街中で激しいチェイスを繰り広げます。2D手描きコマ送りアニメーションを採用し、コメディと誇張されたギャップのテンポ（裏社会の老人、車椅子の追走劇）で現実のロジックを打ち破り、荒唐無稽なストーリーの中で強烈な視覚的ダイナミズムを構築しています。",金點新秀數位影像:"金點新秀 デジタル映像","葛柏 TV 秀":"葛柏 TV 秀",陳慧萍:"陳慧萍","張喻晴 · 洪韻涵":"張喻晴 · 洪韻涵","扮演被賦予試播期的節目主持人「葛柏」，必須在四週內製造能吸引眼球的節目秀。每天於城市地圖中追蹤來賓，透過偷拍與觀察取得畫面，為事件挑選不同風格標題。每個選擇都會改變來賓命運與你的節目未來，反思媒體標題包裝對大眾理解事件的影響。":"試行放送期間を与えられた番組司会者「葛柏」となり、4週間以内に注目を集める魅力的な番組ショーを制作します。毎日都市マップ上でゲストを追跡し、隠し撮りや観察を通じて映像素材を入手して、出来事に合わせた異なるスタイルの見出しを選定。一つひとつの選択がゲストの運命と番組の将来を左右し、メディアの見出しによる演出やパッケージングが大衆の事象理解に与える影響について問い直します。","王愛吉 · 黃承義 · 梁潔美 · 林巧玲 · 馬聖淞":"王愛吉 · 黃承義 · 梁潔美 · 林巧玲 · 馬聖淞","結合 2D 與 3D 的動畫短片，講述找回熱情與自我的故事。主角是過著重複單調生活的上班族，漸漸忘記兒時對攝影的熱愛。某天遇見一隻彩色的貓，重新喚醒他的創意與熱情。透過黑白與鮮豔色彩的對比、2D 角色與 3D 場景的融合，呈現主角從麻木到自我重生的歷程。":"2Dと3Dを融合させた短編アニメーションで、情熱と自分自身を取り戻す物語を描きます。主人公は単調な日常を繰り返す会社員で、幼い頃に抱いていた写真への情熱を次第に忘れていました。そんなある日、カラフルな猫に出会ったことで、彼の創造性と情熱が再び呼び覚まされます。モノクロと鮮やかな色彩のコントラスト、2Dキャラクターと3D背景の融合を通じ、主人公が無気力から自己の再生を果たすまでの道のりを描き出しています。",喀嚓:"喀嚓","吳立凡 · 張自祥 · 陶延娣 · 鄭羽軒":"吳立凡 · 張自祥 · 陶延娣 · 鄭羽軒","以「相機拍攝」為核心機制的 2.5D 探索遊戲，採用《CARTO》與《TOEM》風格作為設計基底。世界因魔素長期污染而凋零，主角佛特．夏普在拍攝廢棄區域時意外將瀕死魔物的靈魂拍入相機，化身名為「喀嚓」的搭檔。透過拍照觀察、戰鬥取材、合成道具的循環，建立以「觀看」取代直覺操作的遊戲節奏。":"「カメラ撮影」を中核メカニクスとする2.5D探索ゲーム。《CARTO》や《TOEM》のスタイルをデザインのベースとしています。魔素による長期的な汚染で世界が荒廃する中、主人公の佛特．夏普は廃墟エリアを撮影中、瀕死の魔物の魂を誤ってカメラに収めてしまい、その魂が「喀嚓」という名の相棒となります。写真撮影による観察、戦闘を通じた素材収集、アイテム調合のサイクルを通じ、直感的な操作の代わりに「観察（観ること）」を主軸に置いたゲームリズムを確立しています。","Facebook 專頁":"Facebookページ",今食堂:"今食堂","許瑗玶 · 高樂怡 · 陳書凱 · 黎躒嬈":"許瑗玶 · 高樂怡 · 陳書凱 · 黎躒嬈","主角伯返家從弟弟雷處得知城鎮的異常現象似乎與一家餐廳有關，主廚正巧失蹤。他暫時接手餐館，發現某些料理能緩解居民的異常狀況——同樣的力量也能用來操控引導他人意志。受「汙染」的怪物原本是普通生物或食材，對玩家而言既可能是敵人也可能是「處理」後的食物。對「信仰」「責任」與「使用力量的界線」的提問。":"主人公の伯は実家に戻り、弟の雷から町の異変があるレストランに関係しているらしいこと、そして料理長がちょうど失踪中であることを知ります。一時的に店を引き継
