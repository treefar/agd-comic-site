キャンセル待ち）。 六、申込期間：即日〜定員に達し次第終了。 主催：アニメとゲームデザイン学科 共催：研究発展処キャリア開発・校友サービスセンター 担当教員：江雅媚先生、内線 6109、Email: cym68@stu.edu.tw",活動:"イベント","樹德科大動遊系 2026 Open Day 引導學員體驗動畫與遊戲設計學習現場":"樹徳科技大学アニメとゲームデザイン学科 2026 Open Day アニメとゲームデザインの学びの現場を体験","Open Day 以「真實體驗大學學習」為核心，五門核心課程＋桌遊互動＋校園走讀＋分組實作。":"Open Dayは「大学での学びのリアルな体験」を軸に、5つのコア科目＋ボードゲーム交流＋キャンパス見学＋グループ実習を実施。","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）於寒假期間舉辦「2026 Open Day — 你想怎樣＠你的大學」體驗活動，吸引眾多對動畫、漫畫與遊戲設計充滿熱情的學生與家長踴躍參與。 活動以「真實體驗大學學習」為核心，透過五門核心課程、桌遊互動、校園走讀、咖啡廳美食交流與分組實作，讓學員們認識動畫與遊戲設計系的學習特色，也探索自身未來的學習方向。 本次 Open Day 是一場融合「溫度、溫馨與體感」的學習聚會，由十位專業師資攜手數位學姐繪師與設計師共同規劃，打造充滿關懷與創作能量的體驗場域。 學員票選出五門核心課程進行深度體驗，包括《遊戲介面設計（UI/UX）》、《漫畫美學》、《3D 列印應用實務》、《動畫與遊戲人物周邊設計製作》以及《動畫美學研究》。下午場次依學員興趣分組實作，包括「動手體驗角色周邊設計」與「與學長姐繪師共同創作」。 系主任鄧樹遠表示：「隨著 AI 與生成式技術快速進入創作現場，創作方式雖不斷演變，但創作的核心仍來自創作者的觀察、感受與判斷。」":"【高雄発】樹徳科技大学アニメとゲームデザイン学科は冬休み期間中、体験イベント「2026 Open Day — 你想怎樣＠你的大學」を開催し、アニメ、マンガ、ゲームデザインへの熱意にあふれる多くの生徒・保護者が参加しました。 本イベントは「大学での学びのリアルな体験」を核とし、5つのコア科目、ボードゲーム交流、キャンパス見学、カフェでの軽食交流、グループ実習を通じて、アニメとゲームデザイン学科の学びの特色を理解し、将来の進路を探求する機会となりました。 今回のOpen Dayは「温もり・温かさ・体感」が融合した学びの場として、10名の専任教員と数名の先輩絵師・デザイナーが共同で企画し、温かい配慮と創作エネルギーに満ちた体験環境を提供しました。 参加者の投票により選ばれた5つのコア科目（『ゲームUI/UXデザイン』、『マンガ美学』、『3Dプリント応用実務』、『アニメ・ゲームキャラクターグッズデザイン制作』、『アニメ美学研究』）で深い学びを体験。午後は希望に応じて「キャラクターグッズデザイン体験」と「先輩絵師との共同制作」のグループ実習が行われました。 学科主任の鄧樹遠は、「AIや生成AI技術が創作の現場に急速に浸透し、制作手法が進化し続ける中でも、創作の核心は依然として創作者自身の観察、感覚、そして判断にあります」と語りました。","114 學年度第 1 學期學生「Unity 證照輔導班」":"114学年度第1学期 学生向け「Unity資格対策講座」","Unity Certified User (UCU) 國際認證 · 11/29-11/30 · D0625 · Programmer 第二張證照。":"Unity Certified User (UCU) 国際認定資格 · 11/29-11/30 · D0625教室 · Programmer 2つ目の資格。","一、開課名稱：「Unity Certified User (UCU) 國際認證」 二、上課日期：114/11/29(六)、114/11/30(日) 三、證照考試：114/11/30(日) 四、上課地點：D0625 教室 五、招生名額：20 人。 六、考試科目：Programmer (以 C# 為程式語言，此為 Unity 第二張證照) 主辦單位：動畫與遊戲設計系 協辦單位：研究發展處職涯發展暨校友服務中心 負責老師：楊智彰老師，分機 6112，Email: chzzyang@stu.edu.tw":"一、講座名：「Unity Certified User (UCU) 国際認定資格」 二、受講日程：114/11/29(土)、114/11/30(日) 三、検定試験：114/11/30(日) 四、講義場所：D0625教室 五、募集定員：20名。 六、試験科目：Programmer（プログラミング言語にC#を使用、Unityの2つ目の資格となります） 主催：アニメとゲームデザイン学科 共催：研究発展処キャリア開発・校友サービスセンター 担当教員：楊智彰先生、内線 6112、Email: chzzyang@stu.edu.tw",榮譽:"栄誉","樹德科大再創佳績！科研雙星連四年榮登全球前 2% 學者榜":"樹徳科技大学が再び快挙！研究の2大スターが4年連続で「世界のトップ2％の科学者」にランクイン","蘇中和教授（動遊系）連續四年入選《全球前 2% 頂尖科學家》。":"蘇中和教授（アニメとゲームデザイン学科）が4年連続で『世界のトップ2％の科学者』に選出。","根據最新公布的 2025 年《全球前 2% 頂尖科學家》（World's Top 2% Scientists）名單，台灣約有 1,470 位學者入榜。樹德科技大學副校長暨設計學院院長蘇中和教授與電腦與通訊系張偉德特聘教授再度雙雙入選，科研實力備受國際肯定。 這份榜單由美國史丹佛大學與 Elsevier 合作，基於 Scopus 資料庫引用數據進行分析，從全球近 800 萬名科學家中嚴格遴選前 2%。 蘇中和教授在社會科學─教育領域具有突出的國際地位，尤其在設計教育與遊戲化學習的研究中取得突破性成果。蘇教授的研究範疇涵蓋設計教育、遊戲化 STEM 教育、數位雙生與擴增實境設計，並成功跨足智慧設計與 AI 影像處理。 校長王昭雄表示：「蘇中和副校長與張偉德教授的國際肯定，再次凸顯樹德科大『教學與研究並重』的辦學特色。」":"新たに発表された2025年《全球前 2% 頂尖科學家》（World's Top 2% Scientists）リストによると、台湾から約1,470名の研究者がランクインしました。樹徳科技大学副学長兼設計学院長の蘇中和教授と、電腦與通訊系の張偉德特聘教授が再び揃って選出され、その研究力が国際的に高く評価されました。このリストは米スタンフォード大学とエルゼビア（Elsevier）が共同で作成し、Scopusデータベースの引用データに基づく分析を通じて、世界約800万人の科学者の中から上位2%を厳格に選出したものです。蘇中和教授は社会科学─教育分野において顕著な国際的地位を築いており、特にデザイン教育とゲーミフィケーション学習の研究で画期的な成果を上げています。蘇教授の研究領域はデザイン教育、ゲーミフィケーションSTEM教育、デジタルツイン、拡張現実（AR）デザインに及び、スマートデザインやAI画像処理の分野にも幅広く展開しています。王昭雄学長は「蘇中和副学長と張偉德教授への国際的な評価は、樹徳科大の『教育と研究の両立』という教育の特色を改めて際立たせるものです」と述べました。",得獎:"受賞","樹德科大動遊系勇奪巴哈姆特 ACG 創作大賽優選雙獎":"樹徳科技大学アニメとゲームデザイン学科が「巴哈姆特 ACG 創作大賽」で優選賞をダブル受賞","原創動畫《人造人》與《癡迷的現實》同時榮獲優選賞，從全台 69 件入圍作品中脫穎而出。":"オリジナルアニメーション作品『人造人』と『癡迷的現實』が同時に優選賞を受賞し、台湾全土のノミネート69作品の中から見事選出されました。","【高雄訊】2025 年度「ACG 創作大賽」由台灣最大 ACG（動畫、漫畫、遊戲）社群平台──巴哈姆特電玩資訊站舉辦。樹德科技大學動畫與遊戲設計系表現亮眼，學生團隊創作的兩部原創動畫《人造人》與《癡迷的現實》同時榮獲「優選賞」，在全台 69 件入圍作品中脫穎而出。 《人造人》由學生博浩原、戎軒頤、陳政民、李育賢創作，陳美蓉老師指導。故事以探討人造智慧生命為主題，透過懸念與詩意描繪人性掙扎，呼應 SDG 16「和平、正義及健全制度」。 《癡迷的現實》由學生宋秋陽、陳志揚、藤川黎星創作，同樣由陳美蓉老師指導。以 1980 年代懷舊美術風格呈現偶像崇拜與理性認知的衝突，融入 SDG 4「優質教育」與 SDG 12「負責任消費與生產」。 指導老師陳美蓉表示：「學生能在具指標性的賽事中獲獎，展現的不僅是動畫製作技術的成熟，更是他們將生活觀察與社會議題轉化為深具思辨性的創作成果。」":"【高雄発】2025年度「ACG 創作大賽」は、台湾最大のACG（アニメ・マンガ・ゲーム）コミュニティプラットフォーム「巴哈姆特電玩資訊站」が主催しました。樹徳科技大学アニメとゲームデザイン学科は目覚ましい活躍を見せ、学生チームが制作した2本のオリジナルアニメーション『人造人』と『癡迷的現實』が同時に「優選賞」を受賞し、台湾全土のノミネート69作品の中から選出されました。『人造人』は陳美蓉教員の指導のもと、学生の博浩原、戎軒頤、陳政民、李育賢が制作しました。人工知能生命の探求をテーマに、サスペンスと詩情を通じて人間の葛藤を描き、SDG 16「平和と公正をすべての人に」に呼応しています。『癡迷的現實』は同じく陳美蓉教員の指導のもと、学生の宋秋陽、陳志揚、藤川黎星が制作しました。1980年代のノスタルジックなビジュアルスタイルでアイドル崇拝と理性的認知の衝突を表現し、SDG 4「質の高い教育をみんなに」およびSDG 12「つくる責任 つかう責任」を取り入れています。指導教員の陳美蓉は「学生たちが指標となるコンテストで受賞できたことは、アニメーション制作技術の成熟だけでなく、生活への観察や社会課題を深い思弁性を持った創作成果へと昇華させたことを示しています」と述べました。","樹德科大攜手日本動畫大廠 培育國際競爭力動漫設計人才":"樹徳科技大学が日本のアニメ制作大手と連携、国際競争力を備えたアニメ・デザイン人材を育成","與日本 Hautecouture (HC) 公司合作邁入第八年，學海築夢計畫 8 位學生赴愛媛縣松山市實習近三個月。":"日本のHautecouture（HC）社との連携は8年目を迎え、「学海築夢」プログラムにより学生8名が愛媛県松山市にて約3か月間のインターンシップに参加しました。","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）與日本知名動畫與遊戲製作公司──オートクチュール株式会社（Hautecouture Inc.，簡稱 HC 公司）合作邁入第八年。雙方持續深化產學合作，今年再次攜手推動教育部「學海築夢」海外實習計畫，展開為期近三個月的國際實習。 本次計畫由動遊系國際小組成員張純雅老師與尹立老師共同策劃與執行，透過系上嚴謹的遴選機制，最終錄取 8 位表現優異的學生：6 位來自台灣（陳思穎、黃郁心、陳宇杰、曾若慈、羅語涵、洪韻涵）及 2 位來自馬來西亞（溫永生、裴欣慧）。 張純雅老師於 7 月 8 日親自帶隊前往日本愛媛縣松山市，協助學生安頓生活、熟悉環境。學生實際參與 HC 公司旗下動畫與遊戲專案，分派任務涵蓋插畫、角色設計及遊戲美術。 動遊系主任鄧樹遠表示：「系上長期重視學生的國際實務歷練，與 HC 公司的合作已有深厚基礎，成果豐碩。」":"【高雄発】樹徳科技大学アニメとゲームデザイン学科は、日本のアニメ・ゲーム制作会社であるオートクチュール株式会社（Hautecouture Inc.、略称HC社）との連携が8年目を迎えました。双方は産学連携を継続的に深化させており、今年度も教育部の「学海築夢」海外インターンシッププログラムを共同で推進し、約3か月間にわたる国際インターンシップを実施しました。本プログラムは、アニメとゲームデザイン学科の国際チームメンバーである張純雅教員と尹立教員が共同で企画・実施し、学科内の厳格な選抜を経て、優秀な学生8名（台湾出身の陳思穎、黃郁心、陳宇杰、曾若慈、羅語涵、洪韻涵の6名、およびマレーシア出身の溫永生、裴欣慧の2名）が選抜されました。張純雅教員は7月8日に自ら学生を引率して日本愛媛県松山市を訪れ、生活の立ち上げや現地の環境への適応を支援しました。学生たちはHC社のアニメおよびゲームプロジェクトに実際に参画し、イラストレーション、キャラクターデザイン、ゲームアートなどの業務を担当しました。アニメとゲームデザイン学科長の鄧樹遠は、「当学科では長年にわたり学生の国際的な実務経験を重視しており、HC社との協力関係には強固な基盤があり、豊かな成果を上げています」と述べました。","樹科大動畫與遊戲設計系創意展實力 時報金犢獎國際競賽勇奪第二名":"樹徳科技大学アニメとゲームデザイン学科がクリエイティビティを発揮、時報金犢獎国際コンテストで第2位を獲得","張純雅老師指導學生作品《永慶房屋雇主品牌招募廣告系列》榮獲第 34 屆時報金犢獎第二名。":"張純雅教員が指導した学生作品『永慶房屋雇主品牌招募廣告系列』が、第34屆時報金犢獎において第2位を受賞しました。","【高雄訊】樹德科技大學動畫與遊戲設計系於第 34 屆時報金犢獎國際競賽再傳捷報！由張純雅老師指導學生裴欣慧、黃若庭、王巧安、蔡思淇共同創作的《永慶房屋雇主品牌招募廣告系列篇 — 柴犬篇、浣熊篇、松鼠篇》，榮獲「永慶房屋招募廣告類」第二名殊榮。 本次獲獎作品以永慶房屋雇主品牌精神為核心，運用動物角色設定與生動敘事手法，將「不綁約」、「不爆肝」、「不扣薪」三大招募訴求轉化為輕鬆幽默又吸引目光的視覺語言。團隊以鸚鵡作為象徵企業文化的核心角色，分別推出三支約 30 秒的動畫短片：《柴犬篇》詮釋自由彈性的「不綁約」職場選擇；《浣熊篇》強調生活平衡的「不爆肝」理念；《松鼠篇》凸顯保障收入的「不扣薪」政策。 動遊系主任鄧樹遠表示，今年學生在金犢獎表現格外亮眼，不僅奪下第二名，另有 18 組作品成功入圍決選。其中張純雅老師指導作品入圍 11 組，陳美蓉老師指導入圍 7 組。 時報金犢獎被譽為華人世界最具影響力的青年創意賽事之一，今年吸引來自全球超過萬件作品同場競逐。":"【高雄発】樹徳科技大学アニメとゲームデザイン学科が、第34屆時報金犢獎国際コンテストにおいて再び快挙を達成しました！張純雅教員の指導のもと、学生の裴欣慧、黃若庭、王巧安、蔡思淇が共同制作した『永慶房屋雇主品牌招募廣告系列篇 — 柴犬篇、浣熊篇、松鼠篇』が、「永慶房屋招募廣告類」において第2位の栄誉に輝きました。今回の受賞作品は、永慶房屋のエンプロイヤーブランド精神を核とし、動物キャラクターの設定と生き生きとしたストーリーテリング手法を用いて、「契約期間の縛りなし（不綁約）」、「過度な残業なし（不爆肝）」、「給与カットなし（不扣薪）」という3大採用アピールポイントを、軽快でユーモアあふれる魅力的な視覚言語へと昇華させました。チームは企業文化を象徴するコアキャラクターとしてオウムを採用し、約30秒のアニメーション短編3本を公開しました。『柴犬篇』では自由で柔軟な「契約縛りなし」のキャリア選択を表現し、『浣熊篇』ではワークライフバランスを重視する「過度な残業なし」の理念を強調し、『松鼠篇』では収入保障としての「給与カットなし」のポリシーを際立たせています。アニメとゲームデザイン学科長の鄧樹遠は、今年度の学生たちの金犢獎での活躍は特に目覚ましく、第2位の獲得に加え、18組の作品が本選ノミネートを果たしたと述べました。そのうち張純雅教員の指導作品が11組、陳美蓉教員の指導作品が7組ノミネートされました。時報金犢獎は中華圏で最も影響力のある青少年クリエイティブコンテストの一つと称され、今年度は世界中から1万件を超える応募作品が競い合いました。","樹科大動遊系勇奪全國競賽佳績 畢業專題《失竊的祕方》領銜嶄露鋒芒":"樹徳科技大学アニメとゲームデザイン学科が全国コンテストで好成績を獲得、卒業制作『失竊的祕方』が牽引し頭角を現す","《失竊的祕方》獲青春設計節優選，並入圍全國技專校院實務專題競賽（從 1,181 件作品中脫穎而出）。":"『失竊的祕方』が「青春設計節」で優選を受賞し、「全國技專校院實務專題競賽」にもノミネート（1,181件の応募作品の中から選出）。","【高雄訊】樹德科技大學動畫與遊戲設計系學生在 2025 年度多項全國性設計與動畫競賽中表現出色。由涂承恩、李冠霖、張淑盈、唐莉蓉共同創作，陳美蓉老師指導的 2D 動畫短片《失竊的祕方》，以細膩敘事手法與寓意深遠的角色刻劃，勇奪多項肯定。 《失竊的祕方》榮獲「2025 青春設計節 — 數位多媒體與遊戲設計類／創意數位影片組」優選獎，並成功入圍「2025 全國技專校院學生實務專題製作競賽暨成果展」動漫互動多媒體類別，從全國 1,181 件報名作品中脫穎而出。 該片以「誤解與和解」為主題，描繪一位老廚師因祕方書失竊而誤會新餐廳老闆的故事，融合 SDGs 性別平等、減少不平等及和平正義等核心理念。 第 21 屆技專校院電腦動畫競賽「直接參賽組」中，動遊系斬獲四部佳作：《癡迷的現實》（陳美蓉指導）、《神癒》（陳慶鴻指導）、《人造人》（陳美蓉指導）、《失竊的祕方》（陳美蓉指導）。":"【高雄発】樹徳科技大学アニメとゲームデザイン学科の学生が、2025年度の複数の全国規模のデザイン・アニメーションコンテストで優れた成績を収めました。陳美蓉教員の指導のもと、涂承恩、李冠霖、張淑盈、唐莉蓉が共同制作した2Dアニメーション短編『失竊的祕方』は、繊細なストーリーテリングと含蓄に富むキャラクター描写により、多数の賞賛を受けました。『失竊的祕方』は「2025 青春設計節 — 數位多媒體與遊戲設計類／創意數位影片組」において優選賞を受賞し、さらに「2025 全國技專校院學生實務專題製作競賽暨成果展」の動漫互動多媒體部門にも見事ノミネートされ、全国1,181件の応募作品の中から選出されました。本作は「誤解と和解」をテーマに、秘伝のレシピ本が盗まれたことで新しいレストランのオーナーを誤解してしまう老料理人の物語を描き、SDGsのジェンダー平等、不平等の是正、平和と公正といったコア理念を取り入れています。第21屆技專校院電腦動畫競賽の「直接參賽組」において、アニメとゲームデザイン学科は『癡迷的現實』（陳美蓉指導）、『神癒』（陳慶鴻指導）、『人造人』（陳美蓉指導）、『失竊的祕方』（陳美蓉指導）の4作品で佳作を獲得しました。","樹德科大動遊系八件作品入圍「2025 放視大賞」":"樹徳科技大学アニメとゲームデザイン学科の8作品が「2025 放視大賞」にノミネート","動畫類 5 件 + 遊戲類 3 件畢業製作入圍 2025 放視大賞，展現產學接軌成果。":"アニメ部門5作品＋ゲーム部門3作品の卒業制作が「2025 放視大賞」 した上でご確認ください。","確認假別、日期與需要的證明":"休暇種別、日程、必要な証明書類の確認",到校務系統提出申請:"校務システムから申請を提出する","追蹤簽核；有考試或長假再向承辦確認":"承認状況を確認する。試験期間や長期休暇の場合は担当窓口へ再確認する","導師／生活輔導組":"担任教員／生活指導組",考試相關另洽教務處註冊課務組:"試験関連は別途教務処登録・履修課にお問い合わせください","考試、長假或補請假，先向導師確認流程；考試處理另洽註冊課務組。":"試験、長期休暇、事後申請の休暇については、まず担任教員に手続きをご確認ください。試験の取り扱いは別途登録・履修課にお問い合わせください。","送出後一直沒回覆，可以當作准假嗎？":"提出後ずっと返答がない場合、休暇が認められたとみなしてよいですか？","不能；要以系統最後核准結果為準。若一直沒有回覆，主動找導師追蹤，別把假單送出當成核准。":"認められません。システムの最終承認結果が基準となります。返答がない場合は、申請の提出をもって承認とみなさず、自主的に担任教員へご確認ください。","兩天以上一定只在線上處理嗎？":"2日以上の休暇は必ずオンラインのみで処理されますか？","請先問導師或生輔組2114，確認需要的證明與簽核方式；遇考試或長假，不確定時再向註冊課務組確認。":"担任教員または生活指導組（内線2114）に事前確認し、必要な証明書類と承認方式をご確認ください。試験期間や長期休暇に重なり不明な点がある場合は、登録・履修課にもお問い合わせください。",選課加退選:"履修登録・修正（科目追加・取り消し）","先看校務系統的正式課表。必修、衝堂與學分數都要自己確認，上過課不等於已完成加選。":"まず校務システムの正式な時間割をご確認ください。必修科目、時間の重複、履修単位数は各自で確認する必要があり、授業に出席しただけで履修追加が完了したことにはなりません。","對照必修、學分數與上課時間":"必修科目、単位数、授業時間の照合",依當期公告辦理初選或加退選:"当該期の公示に従って一次履修登録または追加・取り消しを行う","重開系統確認結果，有問題找註冊課務組":"システムを再度開いて結果を確認し、問題があれば登録・履修課へ問い合わせる","動遊系辦／註冊課務組":"アニメとゲームデザイン学科事務室／登録・履修課","老師同意、也去上課，就算選到了嗎？":"担当教員の了承を得て授業にも出席していれば、履修登録完了とみなされますか？","仍要以校務系統的選課紀錄為準，請核對課程是否確實列入自己的課表。":"校務システムの履修登録履歴が基準となります。該当科目がご自身の時間割に確実に反映されているかご確認ください。","這學期還能直接加退選嗎？":"今学期はまだ直接履修追加・取り消しができますか？","已核對的115-1加退選於2026/9/14上午9時截止，現在不能當作仍開放。棄選或特殊情況是否可辦，請查當期公告並洽註冊課務組。":"確認済みの115-1学期の履修登録変更は2026/9/14午前9時に締め切られており、現在は受付期間中とはみなせません。履修放棄や特別措置の申請可否については、当該期の公示を確認の上、登録・履修課にお問い合わせください。",學分抵免:"単位認定・免除","修過類似課程不等於自動抵免。準備原始成績與申請表，依開課單位、系所及教務處順序審核。":"類似科目を履修済みであっても、自動的に単位認定されるわけではありません。原成績証明書と申請書を用意し、開講部局、学科、教務処の順で審査を受けます。",先問自己的身分與課程能否提出申請:"自身の区分および該当科目が申請可能か事前に確認する","系統填表，備成績證明並依規定送審":"システムで申請書を作成し、成績証明書類を添付して規定に沿って審査に提出する","查核准結果，再確認課表是否須調整":"承認結果を確認し、時間割の調整が必要かどうかを再確認する","開課單位／動遊系辦／註冊課務組":"開講部局／アニメとゲームデザイン学科事務室／登録・履修課","表格送出去，就可以不修那門課嗎？":"申請書を提出すれば、その科目を履修しなくてもよいですか？","先確認核准結果，不能把「已送件」當成通過。課表是否需要自行退選，也請在規定期間向系辦或註冊課務組確認。":"まず承認結果を確認してください。「書類提出済み」を通ったとみなすことはできません。時間割からご自身で取り消す必要があるかについても、所定の期間内に学科事務室または登録・履修課へご確認ください。","現在能補交115-1抵免嗎？":"今から115-1学期の単位認定申請を追加提出できますか？","公告列2026/8/3至9/21受理，已截止且註明逾期不受理。不要自行假設可補交；有特殊身分或程序疑義，請洽註冊課務組。":"公示では2026/8/3〜9/21が受付期間とされ、すでに締め切られており期限超過は受け付けないと明記されています。勝手に追加提出可能と判断せず、特別な身分区分や手続き上の疑義がある場合は登録・履修課にお問い合わせください。","先向指導老師與系辦確認當屆規則，再排製作、審查與成果交件。作品完成不等於所有程序完成。":"まず指導教員および学科事務室に当該年度の規定を確認した上で、制作、審査、成果物提出のスケジュールを立ててください。作品が完成してもすべての手続きが完了したことにはなりません。",向系辦取得當屆辦法與表單:"学科事務室から当該年度の実施要領および様式を入手する",和指導老師排定審查及交件進度:"指導教員と審査および提出のスケジュールを設定する","依規定提交作品、文件與展演成果":"規定に従い作品、関連書類、展示・発表成果物を提出する","專題指導老師／動遊系辦":"卒業制作指導教員／アニメとゲームデザイン学科事務室","組隊、評分、補審與畢展時程，請向系辦索取當屆正式辦法再安排。":"チーム編成、評価、追審査、卒業制作展の日程については、学科事務室から当該年度の正式な要領を取り寄せてから調整してください。","專題是選修嗎？":"卒業制作は選択科目ですか？","已核對的112至115入學一般班課表將專題設計Ⅰ、Ⅱ列為必修。請按自己的入學年課表修課，不把其他班別規定直接套用。":"確認済みの112〜115年度入学生の一般クラスカリキュラムでは、專題設計（卒業制作）Ⅰ、Ⅱは必修科目として定められています。他のクラス区分の規定をそのまま適用せず、ご自身の入学年度のカリキュラムに従って履修してください。","組員人數、退組或補審要看哪裡？":"メンバーの人数、グループ脱退、または追審査の規定はどこを確認すればよいですか？","請向系辦索取當屆正式辦法，確認組隊、異動與補審；不要套用他系或往年規則。":"学科事務室から当該年度の正式な要領を取り寄せ、チーム編成、メンバー変更、追審査の規定をご確認ください。他学科や過去年度の規則をそのまま適用しないでください。",英文門檻:"英語卒業要件","英文與外語修課、英文能力門檻，要分開確認。先看入學年度與分級結果，再查可認列的證明或方案。":"英語および外国語科目の履修と英語能力要件（卒業要件）は、分けて確認する必要があります。まず入学年度と習熟度別クラス分け結果を確認し、認定対象となる証明書や代替基準をお調べください。","核對入學年度、分級與外語學分":"入学年度、習熟度別クラス分け、外国語単位の照合",向語文承辦確認現行門檻與替代方案:"語学担当窓口に現行の要件基準および代替措置を確認する","完成課程及證明認列後，再查畢業檢核":"科目の履修と証明書の認定完了後、卒業要件の充足状況を確認する","通識教育中心（外語修課；門檻請協助轉介）":"教養教育センター（外国語科目履修。要件については担当窓口への取り次ぎをご依頼ください）","測驗分數、證明效期與替代方案，先向語文承辦確認；考照獎助分數不能直接當畢業門檻。":"試験スコア、証明書の有効期限、代替措置は事前に語学担当窓口へご確認ください。資格取得奨励金の基準スコアをそのまま卒業要件として適用することはできません。","英文分級免修，學分就不用補了嗎？":"英語の習熟度別クラス分けで履修免除となった場合、単位の補填は不要ですか？","通識中心修課頁說明，分級後免修的課程學分仍須用認列的專業外語補足；日四技英文與外語合計8學分，請按入學年度核對。":"教養教育センターの履修案内では、クラス分けにより履修免除となった科目の単位は、認定された専門外国語科目で補填する必要があると説明されています。日間部4年制課程の英語および外国語は計8単位ですので、入学年度に従って照合してください。","可以直接照網路上的英檢分數準備嗎？":"インターネット上の英語検定スコア情報をそのまま参考にして準備してもよいですか？","先向語文承辦確認自己適用的測驗、分數、證明效期與替代方案，再決定報考，不直接套用別校或往年資訊。":"他大学や過去年度の情報に頼らず、事前に語学担当窓口へご自身に適用される試験、スコア、証明書の有効期限、代替措置を確認した上で受験をご検討ください。",休學復學與兵役:"休学・復学および兵役","休學、復學要完成正式程序；兵役資料另找生輔組確認。先聯絡承辦，避免只停課卻沒有辦好學籍。":"休学・復学には正式な手続きが必要です。兵役関連の書類は別途生活指導組にご確認ください。授業に出席しないだけで学籍手続きが未完了となる事態を防ぐため、事前に担当窓口へご連絡ください。",先向系辦及註冊課務組確認程序:"事前に学科事務室および登録・履修課に手続きを確認する",備文件並在當期期限內完成離校或復學:"書類を用意し、当該期の期限内に離校（休学）または復学手続きを完了する",役男另向生輔組確認兵役資料:"兵役対象者は別途生活指導組に兵役関連書類を確認する","註冊課務組（動遊系）":"登録・履修課（アニメとゲームデザイン学科担当）","生活輔導組（兵役，請轉接承辦）":"生活指導組（兵役、担当者へのお取り次ぎをご依頼ください）","個人緩徵、儘召與兵役文件期限須由承辦判定；學籍辦妥不代表兵役資料已完成。":"個人の徴兵猶予・召集延期および兵役書類の期限は担当窓口による審査・判断が必要です。学籍手続きの完了が兵役手続きの完了を意味するわけではありません。","領了休學表，晚一點再交可以嗎？":"休学申請書を受け取った後、提出を遅らせることはできますか？","115-1公告要求登記起含當日7日內完成離校及繳件，逾期需重新領表，退費計算基準也會改變。請先確認導師與系辦可辦理時間。":"115-1公示では、登録日を含め7日以内に離校手続きおよび書類提出を完了することが求められており、期限を過ぎると再申請が必要となり、返還金の算定基準日も変更されます。事前に担任教員および学科事務室の受付時間をご確認ください。","休學後如何知道復學時間？":"休学後、復学の時期はどのように把握すればよいですか？","教務處FAQ說明，休學期滿前會寄送復學通知，應依通知辦理。地址、信箱與電話有變動要更新；兵役問題另向生輔組確認。":"教務処のFAQによると、休学期間の満了前に復学通知が送付されるため、通知に従って手続きを行う必要があります。住所、メールアドレス、電話番号に変更がある場合は更新してください。兵役に関する問題は別途生活指導組にご確認ください。",獎助與急難協助:"奨学金・支援および緊急救済","經濟壓力或家庭突發變故，先找生輔組確認適用方案。資格、文件與期限各自不同，不必等到撐不下去才問。":"経済的な困窮や家庭の急変があった場合は、まず生活指導組にご相談の上、適用可能な制度をご確認ください。資格要件、必要書類、期限はそれぞれ異なるため、限界まで抱え込まずにお早めにご相談ください。",先說明困難與目前已領的補助:"困窮の状況と現在受給している補助・支援金について説明する",依承辦指定方案準備證明:"窓口で案内された制度に沿って証明書類を用意する",在該方案期限內送件並追蹤補件:"当該制度の申請期限内に書類を提出し、追加提出の有無を確認する",生輔組急難慰助:"生活指導組 緊急見舞金・救済支援","獎助學金／學雜費減免":"奨学金／授業料等減免","錯過一項助學截止日，就不能再問其他協助嗎？":"ある就学支援制度の締め切りを過ぎてしまった場合、他の支援についても相談できなくなりますか？","不同方案分開辦理。115-1不利處境助學10/20、學產低收10/8都已截止；急難協助另依事件與方案判斷，請先洽生輔組2124。":"制度ごとに個別に処理されます。115-1学期の修学困難者支援は10/20、学産低所得世帯支援は10/8にすでに締め切られています。緊急救済支援については事案や制度ごとに判断されますので、まずは生活指導組（内線2124）へお問い合わせください。","可以同時領好幾種補助嗎？":"複数の支援金・補助金を同時に受給することはできますか？","先把已申請或已領的補助告訴承辦，各方案可能有重複請領限制，不能只看名稱不同就認為可併領。":"申請済みまたは受給中の補助について事前に担当窓口へお伝えください。各制度には重複受給の制限が設けられている場合があるため、名称が異なるだけで併給可能と判断しないでください。",遇到困難找誰:"困ったときの相談窓口","情緒、相處或權益出了問題，可以先找導師協助轉介，再從學校在校學生入口找到對應資源。":"精神面や人間関係、権利に関わる問題が生じた場合は、まず担任教員に相談して適切な窓口への取り次ぎを依頼し、大学の在学生ポータルから対応するサポート窓口・リソースをご確認ください。",先找願意協助的導師或校內承辦:"まず親身に相談に乗ってくれる担任教員または学内担当窓口に相談する",需要諮商時由在校學生入口查詢:"カウンセリングが必要な場合は在学生ポータルよりお調べください",涉及權益時確認正式受理單位與期限:"権利・利益に関わる問題は正式な受付窓口と期限を確認する","導師／學校在校學生入口（諮商與轉介）":"クラス担任／大学「在校生」ポータル（カウンセリングおよび紹介）","申訴或性平案件，請先確認受理窗口與正式期限，再使用對應表單送件。":"申し立てや性別平等（ハラスメント等）事案は、受付窓口と正式な期限をあらかじめ確認した上で、所定の申請書を使用して提出してください。","線上諮商預約從哪裡進？":"オンラインカウンセリングの予約はどこからできますか？","學校「在校學生」頁列有線上預約諮商入口。預約方式與時段以服務頁為準；若找不到入口，可請導師協助聯繫。":"本学の「在校生」ページにオンラインカウンセリング予約の入口が掲載されています。予約方法および時間枠はサービス案内ページに準じます。入口が見つからない場合は、クラス担任に連絡のサポートを依頼してください。","一般申訴與性平可以共用同一張表嗎？":"一般の申し立てと性別平等事案で同じ申請書を共用できますか？","不要先假設表單共用。請導師協助找對承辦，確認案件類型、受理方式與期限後，再使用對應表單。":"同じ申請書を使用できると思い込まないでください。クラス担任の協力を得て適切な担当部署を確認し、事案の種別、受付方法および期限を確かめた上で、所定の申請書を使用してください。",就業資源:"就職支援リソース","先整理作品、履歷與想做的職務，再用職發中心的職涯輔導、職能檢測與徵才資訊，逐步準備求職。":"まず作品、履歴書、希望する職種を整理した上で、キャリア開発センターのキャリア指導、適性診断、求人情報を活用し、段階的に就職活動を進めてください。","整理作品集、履歷與職務方向":"ポートフォリオ、履歴書、希望職種の整理",向系上師長及職發中心詢問資源:"学科の教員やキャリア開発センターにリソースを問い合わせる",依當期職缺要求投件並追蹤:"募集中の求人要件に沿って応募し、選考状況を確認する",研發處職涯發展暨校友服務中心:"研究発展処 キャリア開発・校友サービスセンター","動遊系辦／相關領域老師":"アニメとゲームデザイン学科事務室／関連分野の教員","還沒畢業，也可以先做職涯準備嗎？":"卒業前でも、早期にキャリア準備を進めることはできますか？","職發中心職掌列有學生職涯規劃、UCAN職能檢測、講座與就業輔導；可先洽中心確認當期可使用的資源。":"キャリア開発センターの業務には、学生のキャリアプランニング、UCAN職能診断、各種セミナー、就職指導などが含まれています。まずはセンターに問い合わせて、現在利用可能な支援リソースを確認してください。","徵才活動或職缺一定每學期都一樣嗎？":"採用イベントや求人情報は、毎学期必ず同じですか？","不一定。中心辦理就業相關活動，但實際日期與職缺要看當期公告；不要直接沿用過往海報的報名連結。":"必ずしも同じではありません。センターでは就業関連のイベントを実施していますが、実際の日程や求人内容は各学期のお知らせに準じます。過去のポスターに記載された申し込みリンクをそのまま使用しないでください。","先確認想研究什麼，再讀報考校系當年度簡章。資格、書審、繳費與面試各有要求，不能只完成填表。":"まず何を研究したいかを確認した上で、出願先大学・専攻の当年度募集要項を確認してください。出願資格、書類審査、検定料納付、面接にはそれぞれ規定があり、出願フォームの入力だけで完了とはなりません。",帶作品或研究興趣和師長討論:"作品や研究関心を持参し、教員と相談する",讀當年度簡章的資格與所別要求:"当年度募集要項の出願資格と専攻別の要件を確認する","依期限完成證明、上傳、繳費與確認送出":"期限内に証明書の準備、アップロード、検定料納付、送信完了の確認を行う","教務處招生選才組（本校報名試務）":"教務処 入試選抜組（本学の出願・入試事務）","導師／專題指導老師（規劃討論；統一窗口待確認）":"クラス担任／卒業制作指導教員（進路相談；統一窓口は確認中）","應屆生還沒拿到畢業證書，能報本校116碩甄嗎？":"卒業見込生でまだ卒業証明書を受け取っていませんが、本学の116学年度大学院推薦選抜に出願できますか？","116簡章允許115學年度應屆畢業生依規定報考，須交附表一並經教務單位核章；錄取後仍須取得學士資格才能註冊。":"116学年度募集要項では、115学年度の卒業見込生が規定に沿って出願することを認めています。付表1を提出し、教務担当部署の押印を受ける必要があります。合格後も、学士の資格を取得しなければ入学登録できません。","本校116碩甄何時截止？其他學校也一樣嗎？":"本学の116学年度大学院推薦選抜の出願締切はいつですか？他大学も同じですか？","本校一般網路報名至2026/11/2下午4時，部分境外學歷或專業資格同等學力為10/27截止。其他校系請各查自己的116簡章，不能共用期限。":"本学の一般的なインターネット出願は2026/11/2午後4時まで、一部の海外学歴または専門資格による同等学力での出願は10/27締切です。他大学・専攻はそれぞれの116学年度募集要項を確認してください。締切日は共通ではありません。","先找本系當期甄選，再確認作品、語言、補助與出國文件。過去赴日實習的新聞，不代表現在可以報名。":"まず当学科の該当期選抜を確認し、作品、語学力、補助金、渡航書類を確認してください。過去の日本インターンシップのニュースは、現在応募可能であることを意味しません。",問系辦與職發中心有無當期甄選:"学科事務室およびキャリア開発センターに現在の募集選抜の有無を問い合わせる","核對身分、語言、補助及自付費用":"申請資格、語学力要件、補助金および自己負担額を確認する","錄取後依契約完成保險、簽證與行前程序":"合格採用後は契約書に従い、保険、ビザ、渡航前手続きを完了する","動遊系辦／本系海外實習計畫主持老師":"アニメとゲームデザイン学科事務室／当学科海外インターンシップ計画担当教員","職涯發展暨校友服務中心（學海業務）":"キャリア開発・校友サービスセンター（学海業務）","先向系辦確認目前有無甄選、名額與補助；錄取、費用及出發日期以當期正式文件為準。":"まず学科事務室に現在募集があるか、募集人数、補助金の有無を確認してください。合格選考、費用、出発日程は該当期の公式文書に準じます。","境外生也一定可以領學海補助嗎？":"留学生（境外生）も必ず学海補助金を受給できますか？","教育部現行要點要求中華民國國籍、臺灣戶籍與同階段在學一學期以上等條件。能否參加實習與能否領此補助要分開問，不能由過往新聞推定。":"教育部の現行要綱では、中華民国国籍、台湾の戸籍、同一学年段階で1学期以上の在学などの条件が求められます。インターンシップに参加できるかと本補助金を受給できるかは別個に確認する必要があり、過去のニュースから推定することはできません。","出國實習的保險和簽證，可以自己隨便買辦嗎？":"海外インターンシップの保険やビザは、自己判断で勝手に手配してもよいですか？","教育部要點要求校方協助實習期間醫療、意外保險及合法實習簽證。請依計畫與當地規定確認，不能預設觀光簽證可實習；補助以核定契約為準。":"教育部の要綱では、大学側がインターンシップ期間中の医療保険・傷害保険および合法的なインターンシップビザの取得を支援することが定められています。計画や現地の規定に沿って確認し、観光ビザでインターンシップができると思い込まないでください。補助金は正式に締結された契約に準じます。","想參訪海外學校、展會或產業現場，先問當期見學安排；報名條件、費用、補助與學分都要分開確認。":"海外の学校、展示会、業界現場の視察を希望する場合は、まず該当期の海外研修（見学）の予定を問い合わせてください。応募条件、費用、補助金、単位認定はそれぞれ個別に確認する必要があります。",向系辦詢問目前有無見學或移地教學:"学科事務室に現在、見学研修や現地実地授業の予定があるか問い合わせる","確認行程、費用、補助與認列方式":"日程、費用、補助金、認定方法を確認する",依當期文件確認報名及出國準備:"該当期の案内に従って申し込みと渡航準備を確認する","動遊系辦（當期團、課程與認列）":"アニメとゲームデザイン学科事務室（該当期研修団、授業・単位認定）","國際及兩岸事務處（校級出國交流入口）":"国際・両岸事務処（全学レベルの海外派遣交流窓口）","是否開團、費用、補助與認列，請向系辦確認當期文件；參訪不代表一定可抵實習或學分。":"催行の有無、費用、補助金、単位認定については、学科事務室で該当期の案内文書を確認してください。視察・見学への参加が必ずインターンシップや卒業単位に認定されるとは限りません。","海外見學可以直接算實習時數或畢業學分嗎？":"海外研修（見学）は直接インターンシップ時間数や卒業単位として認められますか？","不能直接保證。參訪、交流與職場實習的活動內容不同，是否認列要看當期課程及本系規定；請先向系辦確認再報名。":"無条件で認められる保証はありません。見学、交流、職場インターンシップでは活動内容が異なり、認定されるかどうかは該当期の科目および当学科の規定に準じます。必ず事前に学科事務室へ確認した上で申し込んでください。","看到以前的日本展演營或交流照片，現在也能報名嗎？":"過去の日本展示・ワークショップや交流写真を見ましたが、今でも申し込めますか？","過往成果不等於現在開放報名。先問系辦目前有無團、適用年級、名額、費用與補助，再依當期公告準備；校級交流可從國際處入口查詢。":"過去の実績は、現在募集を行っていることを意味しません。まず学科事務室に現在催行される研修団の有無、対象学年、定員、費用、補助金を確認し、該当期のお知らせに沿って準備してください。全学レベルの交流は国際処の窓口から確認できます。","?subject=動遊系一日參訪預約":"?subject=アニメとゲームデザイン学科 1日見学予約",資料暫時讀不到:"データを一時的に読み込めません","請重新整理；急件可先聯絡動遊系辦 07-6158000 分機 6102。":"ページを再読み込みしてください。お急ぎの場合は、アニメとゲームデザイン学科事務室（07-6158000 内線 6102）までご連絡ください。",重新整理:"再読み込み","· 查核":"· 確認",官網版型審閱稿:"確認用ドラフト",內容查核:"確認日","· 尚未上線":"· 未公開","STUDENT GUIDE · 動遊在校生":"STUDENT GUIDE · 在学生向け",分類索引:"項目一覧",資訊分類:"情報カテゴリ","常見問題 ↓":"よくある質問 ↓",常用項目:"よく使う項目","畢業規則先看「入學年度＋班別」":"卒業要件はまず「入学年度＋クラス区分」を確認","這份指南以日間四技在校生為主。一般班、技優班與不同入學年度可能不同；申請資格和日期請以各處室當期公告為準。":"本ガイドは主に昼間部4年制課程の在学生を対象としています。一般クラス、技優クラス、および入学年度によって規定が異なる場合があります。申請資格および日程は各担当部署の該当期のお知らせに準じます。",辦理資訊:"手続き案内",搜尋資訊:"情報を検索",輸入問題或關鍵字:"質問・キーワードを入力",清除篩選:"条件をリセット",顯示:"表示",項資訊:"件の情報",沒有找到符合的資訊:"該当する情報が見つかりませんでした","換個關鍵字，或按「清除篩選」看全部項目。":"別のキーワードで検索するか、「絞り込みをクリア」を押して全項目を表示してください。",辦理步驟:"手続き手順",留意:"注意",找誰辦:"問い合わせ先","其他協助：":"その他のサポート：","前往承辦單位 ↗":"担当窓口へ ↗",官方資料與查核狀態:"公式資料・確認状況",常見問題:"よくある質問","目前的篩選沒有相關問題。":"現在の絞り込み条件に一致する質問はありません。","還是不知道找誰？":"どこに相談すべきか分からない場合","把「入學年度、班別、要辦的事」一起告訴系辦，協助你確認承辦窗口。":"「入学年度、クラス区分、行いたい手続き」をまとめて学科事務室にお伝えいただければ、適切な担当窓口をご案内します。","動遊系辦 · 07-6158000 分機 6102 ↗":"アニメとゲームデザイン学科事務室 · 07-6158000 内線 6102 ↗","依學校及系所官方資料整理，閱讀限制已附在各項來源；尚未取得的當期規定保留提醒。本頁為審閱版本。":"大学および学科の公式資料をもとに整理されており、閲覧上の留意事項は各情報ソースに記載されています。未取得の該当期規定については注意喚起にとどめています。なお、本ページはレビュー版です。",HOME:"ホーム",NEWS:"ニュース",ABOUT:"学科紹介",WORKS:"学生作品",FACULTY:"教員紹介",LABS:"実習室",CONTACT:"お問い合わせ",JOIN:"入学案内",CURRICULUM:"カリキュラム",STAFF:"教職員",TEAM:"制作チーム",ADVISOR:"指導教員",NOTE:"備考",PHOTO:"写真",NEXT:"次へ","NEXT →":"次へ →","READ →":"読む →","ENTER →":"開く →","PRESS START →":"始める →","READ NEXT":"次のページ","FULL ARCHIVE →":"作品一覧 →",BACK:"戻る","BACK TO TOP":"ページ上部へ",ALL:"すべて",SEARCH:"検索",LOADING:"読み込み中","D BLOCK":"D棟",BASEMENT:"地下階",BONUS:"おまけ",尚未上線:"未公開","教務處學生休學、復學及退學":"教務処：学生の休学・復学・退学手続き","官方搜尋索引可讀；直接開啟403或202空內容，未讀即時全文。":"公式検索インデックスから閲覧可能。直接アクセスすると403または202の空コンテンツとなり、リアルタイムの全文は取得されません。",生輔組急難慰助專區申請須知:"生活指導組：緊急見舞金・支援金申請要項","從教務處歷年課程表找到「動遊系」，先核對入學年與一般班、技優班。把自己的那一份存下來，之後選課與畢業檢核都用它比對。":"教務処の歴年カリキュラムから「アニメとゲームデザイン学科」を探し、まず入学年度と一般クラス・技優クラスを確認してください。自分のカリキュラムを保存しておけば、今後の履修登録や卒業要件チェックの照合に使用できます。","把系統未通過的項目分成課程、英文、證照、實習與專題，註明缺哪一項。零學分必修也一起看，不要只看總學分是否足夠。":"システム上の未合格項目を科目、英語、資格、インターンシップ、卒業制作に分類し、不足している項目を明記してください。総取得単位数だけでなく、0単位の必修科目も必ずあわせて確認しましょう。","找系辦時一起帶入學年課表、成績與未通過項目的畫面，直接問缺課要補哪門、已有證明如何認列。若涉及抵免或學籍，再請註冊課務組協助確認。":"学科事務室へ相談に行く際は、入学年度のカリキュラム、成績、未合格項目の画面をあわせて持参し、不足科目の補修方法や取得済み証明の認定方法を直接尋ねてください。単位認定や学籍に関わる場合は、登録・教務組に確認を依頼してください。","先向系辦說明自己的入學年、班別與預計實習期間，索取適用的辦法及申請表。也一起問時數怎麼算、結束後要交什麼，避免只知道最低時數。":"まず学科事務室に入学年度、クラス、希望するインターンシップ期間を伝え、該当する実施規定と申請書を受け取ってください。最低必要時間数だけでなく、時間数の計算方法や終了後の提出書類についてもあわせて確認しておきましょう。","把公司名稱、職務說明、預計做的事與工作期間整理給系辦或指導老師看。自找公司或原本的打工能否認列，要先確認，不能做完才補問。":"企業名、職務内容、予定業務、勤務期間をまとめて学科事務室または指導教員に確認してもらってください。自分で探した企業や現在のアルバイトが対象として認められるかは必ず事前に確認し、終了後に事後確認することのないようにしましょう。","請實習承辦確認合約由誰簽、保險何時生效，以及出了問題要找誰。拿到需補文件的清單後再安排開始日期，不把公司口頭答應當成學校程序完成。":"インターンシップ担当者に、契約の署名者、保険の適用開始時期、問題発生時の連絡先を確認してください。必要な追加書類のリストを受け取ってから開始日を決め、企業の口頭での承諾だけで大学の手続きが完了したと思い込まないでください。","把證照全名、發照單位與預計考取版本交給系辦，問是否適用自己的入學年與班別。先確認能認列，再安排報名與費用，別只看別人考過哪一張。":"資格の正式名称、発行機関、取得予定のバージョンを学科事務室に提出し、自分の入学年度やクラスに適用されるか確認してください。他人が受けているからという理由だけで決めず、卒業要件として認定可能か確認してから申し込みや費用の支払いを行いましょう。","準備清楚的證照或成績證明，先核對姓名、證照名稱與生效日期。再向系辦確認登錄位置、是否另交文件，以及畢業檢核何時可查到結果。":"鮮明な資格証明書または成績証明書を用意し、まず氏名、資格名、有効期間（発行日）を照合してください。その後、学科事務室に登録場所、追加書類の要否、卒業要件チェックでの反映時期を確認しましょう。","先向職發中心確認當期獎助資格，並檢查本人匯款帳戶資料是否已交出納組。若老師已團體登錄證照，仍要確認是否需要另外追加獎助申請。":"まずキャリア開発センター（職発センター）で当期の奨励金受給資格を確認し、本人の振込口座情報が出納課に提出済みか確認してください。教員が一括登録した場合でも、別途奨励金の申請が必要かどうか確認しておきましょう。","先整理不能到課的日期、節次與原因，再向導師或生輔組確認假別及證明。遇到考試、心理假或較長期間，先問清楚是否還有其他辦理方式。":"欠席する日程、時限、理由を整理したうえで、担任または生活指導組に休暇区分と証明書類を確認してください。試験期間、メンタルヘルス休暇、または長期にわたる場合は、特別な申請方法があるか事前に確認しましょう。","從學校「在校學生」入口進入請假服務，依系統填寫資料並確認是否送出。若找不到操作項目，帶著畫面問導師或生輔組，不要只在通訊軟體告知就當完成。":"本学の「在校学生（在学生）」ポータルから休暇申請サービスにアクセスし、システムに沿って入力して送信完了を確認してください。操作項目が見つからない場合は、画面を持って担任や生活指導組に相談し、メッセージアプリで連絡しただけで完了したと思い込まないようにしましょう。","送件後回到系統查看是否核准；沒有回覆時，主動找導師追蹤。若會影響考試或需請長假，再向導師與註冊課務組確認後續，別把送出當核准。":"申請後はシステムに戻って承認されたか確認してください。返信がない場合は担任に自主的に進捗を確認しましょう。試験に影響する場合や長期休暇となる場合は、担任および登録・教務組に今後の対応を確認し、申請しただけで承認されたと思い込まないようにしてください。","把入學年課表與本學期系統課表並排，先看必修是否漏選，再檢查學分與衝堂。若有抵免、重修或補修，另外列出來，選課前一起問系辦。":"入学年度のカリキュラムと今学期のシステム時間割を並べ、まず必修科目の登録漏れがないか確認し、次に単位数やコマの重複をチェックしてください。単位認定、再履修、補修科目がある場合は別途書き出し、履修登録前に学科事務室へまとめて相談しましょう。","到教務處確認現在屬於初選、加退選還是棄選，再依該階段公告辦理。過去的加退選日期不能繼續使用；遇到逾期或特殊情況，先問註冊課務組。":"教務処で現在が一次履修登録、履修修正（追加・取消）、履修放棄（ドロップ）のどの期間かを確認し、該当期間の案内に従って手続きを行ってください。過去の日程は使用できません。期限超過や特別な事情がある場合は、まず登録・教務組に相談してください。","操作後重新開啟系統課表，確認課名、班別與時間真的正確。若和預期不同，記下課程代碼及問題畫面找註冊課務組，不以出席或老師同意代替系統結果。":"操作後は時間割システムを再度開き、科目名、クラス、時間帯が正しいかを必ず確認してください。予定と異なる場合は、科目コードと問題画面を控えて登録・教務組に問い合わせ、出席や教員の口頭同意をもってシステム上の登録の代わりとしないでください。","先說明自己是新生、轉學生、轉系生或其他身分，帶原修課程與成績資料詢問。請承辦確認本期是否仍受理及適用規定，別只因課名相似就認為可抵免。":"まず新入生、編入生、転科生などの身分を伝え、以前履修した科目の情報や成績資料を持参して相談してください。今期も申請を受け付けているか、適用規定は何かを担当者に確認し、科目名が似ているだけで認定されると判断しないようにしましょう。","在可申請的期間填寫抵免系統並列印表格，備妥原校成績證明正本。依公告送開課單位與就讀系所簽核，再交註冊課務組複審，別只完成線上輸入。":"申請可能期間内に単位認定システムに入力して申請書を印刷し、前籍校の成績証明書原本を用意してください。案内に従って開講部署と所属学科の承認を受け、登録・教務組へ提出して再審査を受けます。オンライン入力だけで完了したと考えないでください。","先查已核准抵免的科目，再問是否仍需自行調整本學期課表。若結果和申請內容不同，拿申請表及成績證明詢問，不要把送件或初審當成全部完成。":"まず単位認定が承認された科目を確認し、今学期の時間割を自分で調整する必要があるかを問い合わせてください。結果が申請内容と異なる場合は申請書と成績証明書を持って確認し、提出や一次審査だけで全て完了したと考えないようにしましょう。","向系辦確認自己這一屆要用哪份專題辦法，並一次詢問組隊、異動、審查與補審的表單。先核對版本與適用對象，不直接沿用學長姐留下的檔案。":"学科事務室で自分の学年に適用される卒業制作の実施規定を確認し、チーム編成、変更、審査、追試審査に関する書類を一度にまとめて確認してください。バージョンと適用対象を必ず事前に照合し、先輩から譲り受けたファイルをそのまま使わないようにしましょう。","把作品目前完成度與待辦清單給指導老師，詢問各次審查要展示哪些內容。再按當屆公告倒排製作與整理文件的時間，留出修改空間，不自行猜截止日。":"作品の現在の完成度とタスクリストを指導教員に見せ、各審査で発表すべき内容を確認してください。その後、当該年度の案内に合わせて制作および書類整理のスケジュールを逆算して組み、修正のための余裕を持たせ、勝手に締め切りを推測しないようにしましょう。","交件前請老師確認作品、說明文件、展演資料與授權是否都需要，並逐項對照指定格式。完成後確認承辦有收到、是否需補件，不把作品做完當作程序結束。":"提出前に、作品本体、説明資料、展示資料、許諾書がすべて必要かを教員に確認してもらい、指定フォーマットと項目ごとに照合してください。提出後は担当部署が受領したか、追加書類が必要かを確認し、作品を作り終えただけで手続きが完了したと思わないでください。","先找出入學分級結果及已修、抵免的英文與外語課，和自己的課表核對。若有免修，向通識中心確認還需補哪些外語學分，別直接把免修當學分已補足。":"まず入学時のクラス分け結果と、履修済み・単位認定済みの英語や外国語科目を自分のカリキュラムと照合してください。履修免除がある場合は、ほかにどの外国語単位を補う必要があるかを通識教育中心に確認し、免除だけで必要単位を満たしたと考えないようにしましょう。","向通識中心說明入學年與目前成績，請協助找到語文承辦。報考檢定前先確認測驗、分數、證明效期與替代方案，別拿別校或獎助金標準直接套用。":"教養教育センター（通識教育中心）に入学年度と現在の成績を伝えて語学担当部署を確認してください。検定試験を申し込む前に、対象となる試験、合格基準スコア、証明書の有効期限、代替案を必ず確認し、他大学や奨励金の基準をそのまま当てはめないようにしてください。","把修課成績和語文承辦要求的證明分開整理，問清楚交件位置與認列方式。辦完再查畢業檢核；若仍顯示未通過，拿送件紀錄找承辦核對。":"履修成績と語学担当者が求める証明書類を分けて整理し、提出場所と認定方法を明確に確認してください。手続き後は卒業要件チェックを確認し、依然として未合格と表示される場合は、提出記録を持参して担当者と照合してください。","辦理前先聯絡系辦與註冊課務組，說明要休學或復學，以及自己的學籍情況。詢問導師或代理人可辦理的時間，再安排到校，避免領表後找不到簽核人員。":"手続き前に学科事務室と登録・教務組に連絡し、休学または復学の希望と自身の学籍状況を伝えてください。担任または代理教員が対応可能な時間を確認してから登校日を決め、申請用紙を受け取った後に承認者が不在となる事態を避けましょう。","休學先備學生證；委託代辦時確認委託書，領表後按公告期限完成離校及繳件。復學則依本人收到的通知辦理，並確認通訊資料正確，別只停止上課。":"休学の際はまず学生証を用意してください。代理人に委任する場合は委任状を確認し、申請書を受け取った後は案内の期限内に離校手続きと書類提出を完了させてください。復学は本人宛ての通知に従って手続きし、連絡先が正しいか確認し、単に授業に出なくなるだけで済ませないようにしましょう。","若是復學、轉入、轉系或延畢，主動向生輔組說明役男身分，確認需補哪些兵役文件。把學籍變動和兵役資料分開追蹤，不假設其中一項完成就全部辦妥。":"復学、編入、転科、または留年（延長生）の場合は、生活指導組に兵役義務者であることを自主的に申し出て、必要な兵役関連書類を確認してください。学籍の変更と兵役手続きは別々に追跡し、片方が完了したからといってすべて完了したと思い込まないでください。","先向生輔組說明困難發生時間、目前最急的支出，以及已申請或已領的補助。請承辦協助判斷適用方案，別只因錯過一項公告，就以為所有協助都結束。":"まず生活指導組に困窮が発生した時期、現在最も緊急を要する支出、すでに申請または受給した支援金について説明してください。担当者に適用可能な支援策の判断を依頼し、一つの案内を逃したからといってすべての支援が終わったと思い込まないようにしましょう。","依承辦指定方案準備申請表、在學證明與事件相關文件，例如醫療或失業證明。所得、財產或戶籍資料是否需要、要哪個版本，也先問清楚再申請文件。":"担当者が案内した支援策に従い、申請書、在学証明書、医療や失業の証明など、事情に関する書類を準備してください。所得・財産・戸籍に関する資料が必要か、どの形式が必要かも先に確認してから取り寄せましょう。","送件前確認由自己交件還是學校統一辦理，並問清楚本案期限與補件方式。再核對姓名及款項資料是否正確；各方案期限不同，不沿用別張公告的日期。":"書類提出前に、個人で直接提出するのか大学が一括手続きを行うのかを確認し、申請期限と再提出・追完の方法を明確にしておいてください。氏名や振込口座情報が正しいかも再確認しましょう。支援策によって期限が異なるため、他の案内の日程を流用しないでください。","先用自己能接受的方式告訴導師或校內承辦，目前是情緒、相處還是權益上的困難。若不知道該找誰，可以先請對方協助轉介，不必先替自己判定案件類型。":"まずは自分が話しやすい方法で、現在抱えている悩みが精神面、人間関係、あるいは権利上の問題であるかを担任や校内担当者に伝えてください。相談窓口が分からない場合は適切な部署への紹介を依頼し、自分で問題の種別を決めつける必要はありません。","到學校「在校學生」頁尋找線上預約諮商，依服務頁確認預約方式與可用時段。入口無法使用或不知道怎麼填時，請導師協助聯繫，別套用其他學校的流程。":"本学の「在校学生（在学生）」ページからオンラインカウンセリング予約を探し、案内ページで予約方法と利用可能な時間枠を確認してください。窓口が利用できない場合や記入方法が分からない場合は担任に連絡を依頼し、他大学の手順をそのまま当てはめないようにしましょう。","把收到的通知、事情發生日期與想反映的問題整理好，先請承辦確認應走哪種程序。再問正式表單、送件方式與期限，不把一般申訴和性平案件當成同一件事。":"受け取った通知、事案の発生日、申立・相談したい内容を整理し、まずどの手続きを取るべきか担当者に確認してください。その上で正式な申請書式、提出方法、期限を確認し、一般的な学生申立と性別平等（ジェンダー平等）事案を混同しないようにしてください。","先選出能代表能力的作品，註明自己負責的部分，並把作品連結實際點開檢查。履歷依想應徵的工作整理，不用一次塞入所有作業，讓師長更容易給建議。":"自分の能力を最もアピールできる代表作を選び、担当したパートを明記した上で、作品リンクが正常に開くか実際に確認してください。履歴書は志望職種に合わせて整理し、過去の課題をすべて詰め込まず、教員がアドバイスしやすい構成にしましょう。","帶作品與履歷向相關領域老師討論，再問職發中心目前有哪些職涯諮詢、職能檢測或徵才活動。把不確定的職務與技能列成問題，別只詢問有沒有工作。":"作品と履歴書を持参して関連分野の教員に相談し、キャリア開発センター（職発センター）で現在実施されている進路相談、適性検査、採用イベントについて尋ねてください。単に仕事があるかを聞くだけでなく、不明な職種やスキルを具体的に質問として整理しておきましょう。","每個職缺都重新核對工作內容、應交資料與投件期限，再依公司指定方式送出。保留投件日期與聯絡紀錄；過往徵才海報只能參考，不代表職缺現在仍開放。":"求人ごとに業務内容、提出書類、応募期限を再確認し、企業が指定する方法で応募してください。応募日と連絡記録は必ず保管しておきましょう。過去の求人ポスターは参考情報に過ぎず、現在も募集しているとは限りません。","先挑一兩件作品或專題，整理自己想繼續研究的問題，再找導師或專題老師討論。一起確認適合的領域、準備方向與作品呈現方式，再依興趣找研究所。":"まず1〜2点の作品や卒業制作を選び、大学院進学に向けてさらに研究したい課題を整理した上で、担任や卒業制作の指導教員に相談してください。適した専門分野、準備の方向性、作品の提示方法を一緒に確認し、興味に合わせて大学院を探しましょう。","從報考學校官方入口下載當年度簡章，逐項看身分資格、所別書審與面試要求。本校應屆生還要核對簡章指定證明；其他校所不能共用同一份清單。":"志望校の公式サイトから当該年度の募集要項（簡章）をダウンロードし、出願資格、専攻別の書類審査や面接の要件を項目ごとに確認してください。本学の卒業見込生は要項指定の証明書類も照合し、他大学・他専攻と同一のチェックリストを使い回さないようにしましょう。","依簡章確認繳費期限與上傳格式，完成後檢查是否已確認送出，不是只把檔案放上去。再從官方系統追蹤審查或通知；不同身分可能有不同截止日。":"募集要項に従って支払期限とアップロード形式を確認し、ファイルを置くだけでなく、送信完了の確定まで行われたか確認してください。その後は公式システムで審査状況や通知を確認しましょう。出願区分によって締め切りが異なる場合があります。","先問系辦與職發中心目前是否有公開甄選，再索取這一梯次的條件與表單。過去赴日實習新聞只能看成果，不能拿它當現在仍有名額或固定補助的依據。":"学科事務室とキャリア開発センター（職発センター）に現在公募選考が行われているか確認し、今期の応募条件と書類を受け取ってください。過去の日本での海外インターンシップに関するニュースは過去の実績に過ぎず、現在も枠があることや定額の補助が出る根拠にはなりません。","把國籍、學籍、語言與作品條件逐項對照甄選文件，另外問補助包含什麼、自己要付多少。能參加實習不等於能領學海補助，金額及資格都要依核定文件確認。":"国籍、学籍、語学力、作品要件を選考書類と1項目ずつ照合し、補助金に含まれる内容と自己負担額を確認してください。インターンシップに参加できることと学海補助金を受給できることは同義ではありません。金額と受給資格は必ず承認書類で確認してください。","錄取後先核對契約中的實習機構、期間與補助，再請承辦協助確認醫療、意外保險及合法實習簽證。也問清楚行前說明、當地聯絡與返校成果要怎麼辦理。":"採用決定後は、まず契約書に記載された実習機関、期間、補助額を確認し、担当者の協力を得て医療・傷害保険や合法的なインターンシップビザを確認してください。出発前の事前説明会、現地での連絡体制、帰国後の成果報告手続きについても詳しく確認しておきましょう。","向系辦說明想參訪的領域與可出國時間，問目前有沒有見學或短期移地教學。先拿到當期安排再規劃，不把往年展演營或交流照片當作正在招募。":"学科事務室に見学を希望する分野と渡航可能な時期を伝え、現在海外研修（見学）や短期の移地教学（現地での授業）があるかを確認してください。今期の予定を確認してから計画を立て、過去の展演キャンプや交流写真を現在の募集と受け取らないようにしましょう。","報名前把行程、自付費用、可能補助與取消條件問清楚；若想認列課程或實習，也先取得系辦確認。參訪交流與職場實習不同，不能只因出國就直接計入。":"申し込む前に、旅程、自己負担費用、利用可能な補助金、キャンセル条件を明確に確認してください。科目履修やインターンシップとして認定を受けたい場合は、必ず事前に学科事務室の確認を得ましょう。海外研修（見学）や交流活動は職場でのインターンシップとは異なり、単に渡航したというだけで自動的に単位認定されるわけではありません。","有當期公告後，再依主辦單位要求核對報名文件、護照、保險與入境準備。也確認帶隊或緊急聯絡方式及返校是否要交成果，不直接沿用海外實習的文件清單。":"当期の募集案内が出たら、主催部署の要求に従って提出書類、パスポート、保険、入国準備を確認してください。引率者や緊急連絡先、帰国後の成果報告の要否も確認し、海外インターンシップの書類チェックリストをそのまま流用しないようにしましょう。",依需求查找:"目的に合わせて選ぶ",辦理流程:"手続きの流れ",各項說明:"各項目の説明",步驟說明:"各ステップの説明",核對入學年度:"入学年度を確認",整理未通過項目:"未達成の要件を整理",向系辦確認補修:"学科事務室で不足科目を確認",取得當期實習規定:"当期の実習規定を入手",確認單位與老師:"受入先と担当教員を確認",完成合約保險確認:"契約と保険を確認",先查系上認列範圍:"学科の認定対象を確認",考取後登錄證明:"合格後に資格証明を登録",另查獎助資格送件:"奨励金の条件を別途確認・申請",確認假別與證明:"欠席区分と証明書を確認",到系統提出申請:"学内システムで申請",追蹤簽核結果:"承認状況を確認",先核對必修與時間:"必修科目と時間割を確認",依公告初選加退選:"公告に従い履修登録・変更",重開系統確認結果:"システムを開き直して結果を確認",系統填寫並印表:"システムに入力して申請書を印刷",送交系所初審:"関係学科へ一次審査を依頼",依初審調整選課:"一次審査に基づき履修変更",文件交註冊課務組:"書類を学籍・教務担当へ提出",查詢最後核定結果:"最終認定結果を確認",先取當屆辦法表單:"当該年度の規定・様式を入手",與老師排審查進度:"指導教員と審査日程を計画",依要求交作品文件:"指定の作品・書類を提出",核對分級與外語學分:"習熟度区分と外国語単位を確認",確認門檻通過方式:"要件の達成方法を確認",完成認列再查檢核:"認定後に卒業要件を再確認",想辦休學或退學:"休学・退学を希望する場合",準備復學或續休:"復学・休学延長の場合",另查自己的兵役事項:"兵役手続きを別途確認",說明困難與已領補助:"困っていることと受給中の支援を伝える",確認方案備妥資料:"支援制度を確認して書類を準備",依期限送件追蹤補件:"期限内に提出し追加書類を確認",先找師長協助轉介:"教員に相談・紹介を依頼",需要時預約諮商:"必要に応じてカウンセリングを予約",權益事件找正式窗口:"権利に関する問題は正式な窓口へ",準備履歷與作品集:"履歴書とポートフォリオを準備",詢問師長職發資源:"教員やキャリア支援窓口に相談",依職缺投件並追蹤:"募集条件に従い応募・状況を確認",帶作品討論升學方向:"作品をもとに進学先を相談",查當年度簡章資格:"当年度の募集要項・出願資格を確認",完成報名並追蹤審查:"出願を完了し審査状況を確認",先查當期甄選機會:"当期の募集機会を確認",核對資格費用與補助:"応募資格・費用・補助を確認",錄取後完成行前準備:"採用後に渡航準備",詢問當期見學或課程:"当期の見学・授業の有無を確認",核對行程費用與認列:"日程・費用・認定方法を確認",依文件報名準備出國:"募集書類に従い申込・渡航準備","不同入學年與班別分開核對；有缺項就找系辦確認補修或認列。":"入学年度・クラスごとに確認し、不足があれば学科事務室で追加履修や認定について相談してください。","這是開始實習前的準備；實習中怎麼聯絡老師、結束後交什麼，也請先問清楚。":"実習開始前の準備です。実習中の教員への連絡方法や終了後の提出物も、事前に確認してください。","畢業認列與獎助是兩件事；獎助須另查當期資格及期限。":"卒業要件としての認定と奨励金は別の手続きです。奨励金は当期の条件・期限を別途確認してください。","有考試、較長假期或緊急狀況，先向承辦確認另外要辦的事。":"試験、長期欠席、緊急時は、追加の手続きが必要か担当窓口に確認してください。","選課成功與課程異動都要再查；已截止的時程不代表仍可補選。":"履修登録の成立と科目変更の両方を再確認してください。過去の日程が掲載されていても、追加登録できるとは限りません。","先核對可申請身分與當期期限；初審後的加退選要自己辦，不等最後核定才處理。":"まず申請資格と当期の期限を確認してください。一次審査後の履修変更は自分で行い、最終認定まで待たないでください。","分組、審查日期、作品格式與展演要求，先取得當屆文件再排進度。":"チーム編成、審査日程、作品形式、展示要件は、当該年度の書類を入手してから計画してください。","英文課程學分與英文能力門檻要分開確認；分級免修也要問清楚補足方式。":"英語科目の単位と英語能力要件は別々に確認してください。習熟度区分による履修免除がある場合も、不足単位の補い方を確認してください。","依目前狀況選一項；役男的緩徵或儘後召集另外向生輔組確認。":"現在の状況に合う項目を選んでください。兵役対象者は徴集延期や予備役召集の取扱いを生活指導担当に別途確認してください。","休學與復學依目前狀況擇一辦理；役男另向生輔組確認兵役，不以完成學籍程序代替。":"現在の状況に応じて休学または復学を手続きしてください。兵役対象者は生活指導担当に別途確認し、学籍手続きだけで兵役手続きも完了したと考えないでください。","急難慰助、助學金與學雜費減免各有資格和期限，先請承辦協助選方案。":"緊急支援、奨学金、学費減免にはそれぞれ条件と期限があります。まず担当窓口に適した制度を相談してください。","依需求直接找窗口，不必先諮商才能提出權益問題。":"必要な窓口に直接相談できます。権利に関する問題を申し出る前に、カウンセリングを受ける必要はありません。","可同步找師長討論與使用職發資源，依各職缺要求準備作品。":"教員への相談とキャリア支援の利用は並行して進められます。求人ごとの条件に合わせて作品を準備してください。","本校與外校各看自己的簡章；送出後仍要查資格審查與補件狀態。":"本学・他大学とも、それぞれの募集要項を確認してください。提出後も資格審査や追加書類の状況を確認してください。","海外實習的甄選、補助與出國文件分開確認；歷屆成果不代表本期已開放。":"海外実習の選考、補助、渡航書類は別々に確認してください。過去の実績が掲載されていても、現在募集中とは限りません。","見學、交換與海外實習的申請和補助不同，依正在招募的團或課程辦理。":"見学、交換留学、海外実習では申請・補助制度が異なります。現在募集中の団体や授業の案内に従ってください。",到系統填寫申請並印出紙本:"システムで申請書を作成・印刷",送請開課單位與就讀系所主管初審:"開講部門と所属学科の責任者に一次審査を依頼",依初審結果自行辦理加退選:"一次審査の結果に基づき自分で履修変更",將申請表及證明交註冊課務組:"申請書と証明書を学籍・教務担当へ提出",回到系統查詢核定結果:"システムで最終認定結果を確認","先確認申請身分與當期截止日，再到校務系統填寫並印表。備妥原校歷年成績單正本及適用的證明，一次整理齊全。":"申請資格と当期の締切を確認してから、学内システムで入力・印刷してください。前籍校の成績証明書原本と必要な証明書をまとめて準備してください。","把申請資料交給開課單位與自己就讀的系所主管審查。哪些課程可以抵免，先依這個初審結果確認。":"開講部門と所属学科の責任者に申請書類を提出してください。どの科目が単位認定の対象になるか、まず一次審査の結果を確認してください。","初審通過的課程如果仍在課表裡，要自行處理退選；也一起確認需要補選哪些課。不要等最後核定後才開始處理。":"一次審査で認められた科目が時間割に残っている場合は、自分で履修取消を行い、追加すべき科目も確認してください。最終認定まで待たずに対応してください。","依規定把經初審的申請表與證明資料交到教務處註冊課務組。資料請一次備齊，送件仍須在當期受理期間內完成。":"一次審査済みの申請書と証明書類を、規定に従って学籍・教務担当へ提出してください。書類を一式そろえ、当期の受付期間内に提出してください。","送件後回校務系統查詢最後核定情形，再與自己的課表及畢業檢核核對。有落差時，帶結果找註冊課務組確認。":"提出後は学内システムで最終結果を確認し、時間割と卒業要件の確認画面を照合してください。相違があれば、結果を持って学籍・教務担当に確認してください。","休學：先聯繫系所，再到教務處領表":"休学：所属学科へ連絡してから教務窓口で用紙を受領","復學或續休：依通知回覆並辦理":"復学・休学延長：通知に従い回答・手続き","兵役：另向生輔組確認資料":"兵役：生活指導担当で別途確認","先約好導師或系所承辦，再到註冊課務組登記領表。依當期公告完成訪談、離校與交回文件；領表日期會影響退費計算。":"指導教員または学科担当者     -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-body::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}

  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}

  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}

  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}

  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;height:22px;
    border-radius:6px;cursor:default;padding:0}

  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}

  .twk-num{display:flex;align-items:center;height:26px;padding:0 0 0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6)}
  .twk-num-lbl{font-weight:500;color:rgba(41,38,27,.6);cursor:ew-resize;
    user-select:none;padding-right:8px}
  .twk-num input{flex:1;min-width:0;height:100%;border:0;background:transparent;
    font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0 8px 0 0;
    outline:none;color:inherit;-moz-appearance:textfield}
  .twk-num input::-webkit-inner-spin-button,.twk-num input::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0}
  .twk-num-unit{padding-right:8px;color:rgba(41,38,27,.45)}

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;

<!-- iframe embed bridge：給 dgd.stu.edu.tw 嵌入時用，獨立於 React，原生 JS -->
<script>
(function(){
  if (window.parent === window) return; // 非 iframe 不啟動

  function isAllowedParent(origin){
    return /^https?:\/\/([^/]+\.)?dgd\.stu\.edu\.tw$/.test(origin);
  }

  var lastHeight = 0;
  function pushHeight(){
    var h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    if (h === lastHeight) return;
    lastHeight = h;
    window.parent.postMessage({ type: 'comic:height', height: h }, '*');
  }

  var pendingHeight = null;
  function schedulePushHeight(){
    if (pendingHeight) return;
    pendingHeight = requestAnimationFrame(function(){
      pendingHeight = null;
      pushHeight();
    });
  }

  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(schedulePushHeight);
    var startObserve = function(){ if (document.body) ro.observe(document.body); };
    if (document.body) startObserve(); else window.addEventListener('DOMContentLoaded', startObserve);
  }
  window.addEventListener('load', schedulePushHeight);
  setInterval(schedulePushHeight, 1500); // 兜底（圖片 lazy load 後高度補正）

  window.addEventListener('hashchange', function(){
    window.parent.postMessage({ type: 'comic:hash', hash: location.hash }, '*');
  });

  window.addEventListener('message', function(e){
    if (!isAllowedParent(e.origin)) return;
    var d = e.data || {};
    if (d.type === 'parent:hash' && typeof d.hash === 'string' && location.hash !== d.hash) {
      location.hash = d.hash;
    }
    if (d.type === 'parent:scrollTop') {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  });

  // 通知父頁 iframe 已就緒，可以推 hash 過來
  window.parent.postMessage({ type: 'comic:ready' }, '*');
})();
</script>
