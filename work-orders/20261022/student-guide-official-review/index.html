<style>/* 漫畫風系網 — 樹德動遊系 */
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bowlby+One&family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Kurenaido&family=Reggae+One&display=swap');

:root {
  --paper: #f4ecd8;
  --paper-2: #ece2c6;
  --ink: #0f0d0a;
  --ink-2: #1a1714;
  --halftone: rgba(15, 13, 10, 0.18);
  --accent-red: #e63946;        /* 熱血朱紅 */
  --accent-blue: #1d4ed8;       /* 遊戲寶藍 */
  --accent-yellow: #ffd60a;
  --accent-pink: #ff70a6;
  --gutter: 0px;
  --bw: 5px; /* 邊框粗 */
}

*, *::before, *::after { box-sizing: border-box; }

/* 錨點點擊時平滑捲動，且讓章節停在 sticky topnav 下方 */
html { scroll-behavior: smooth; }
.chapter, .foot { scroll-margin-top: 80px; }
html { scroll-behavior: smooth; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  color: var(--ink);
  background-color: #f4ecd8 !important;
  background: var(--paper);
  background-image:
    radial-gradient(var(--halftone) 1px, transparent 1.4px),
    radial-gradient(var(--halftone) 1px, transparent 1.4px);
  background-size: 14px 14px, 14px 14px;
  background-position: 0 0, 7px 7px;
  -webkit-font-smoothing: antialiased;
}

/* 紙質紋理覆蓋層 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, rgba(15,13,10,0.02) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(15,13,10,0.02) 0 2px, transparent 2px 4px);
  z-index: 1;
  mix-blend-mode: multiply;
}

/* 漫畫格通用 — 手繪邊 (filter 只套用於邊框，不影響內容) */
.panel {
  position: relative;
  background: #fffaf0;
  border-radius: 0;
  box-shadow: none;
  overflow: hidden;
  isolation: isolate;
  margin: calc(var(--bw) * -0.5);
}
/* 邊框用 ::before 浮層繪製 — filter 只套這層，內容不受影響 */
.panel::before {
  content: '';
  position: absolute;
  inset: 0;
  border: var(--bw) solid var(--ink);
  pointer-events: none;
  z-index: 5;
  filter: url(#rough-edge);
}
.panel:hover { z-index: 6; }

/* 漫畫頁與 tier 結構 — 標準日漫排版 */
.comic-page {
  display: flex;
  flex-direction: column;
  gap: var(--gutter);
  margin-bottom: 16px;
  position: relative;
}
.comic-tier {
  display: flex;
  gap: var(--gutter);
  width: 100%;
}
.comic-tier > .panel {
  flex: 1 1 0;
  min-height: 0;
}
/* tier 高度預設 — 漫畫 tier 比例 */
.tier-tall { min-height: 320px; }
.tier-mid { min-height: 180px; }
.tier-short { min-height: 120px; }
.tier-splash { min-height: 480px; }

/* 用 flex 比例代替不規則 grid */
.tier-1-1 > .panel { flex: 1 1 0; }
.tier-2-1 > .panel:nth-child(1) { flex: 2 1 0; }
.tier-2-1 > .panel:nth-child(2) { flex: 1 1 0; }
.tier-1-2 > .panel:nth-child(1) { flex: 1 1 0; }
.tier-1-2 > .panel:nth-child(2) { flex: 2 1 0; }
.tier-3-2 > .panel:nth-child(1) { flex: 3 1 0; }
.tier-3-2 > .panel:nth-child(2) { flex: 2 1 0; }
.tier-1-1-1 > .panel { flex: 1 1 0; }
.tier-1-2-1 > .panel:nth-child(1) { flex: 1 1 0; }
.tier-1-2-1 > .panel:nth-child(2) { flex: 2 1 0; }
.tier-1-2-1 > .panel:nth-child(3) { flex: 1 1 0; }
.tier-1-1-1-1 > .panel { flex: 1 1 0; }

/* 點擊觸發狀聲詞與集中線 */
@keyframes sfxPop {
  0% { transform: rotate(var(--r,-8deg)) scale(0.4); opacity: 0; }
  40% { transform: rotate(calc(var(--r,-8deg) - 4deg)) scale(1.25); opacity: 1; }
  70% { transform: rotate(var(--r,-8deg)) scale(1); opacity: 1; }
  100% { transform: rotate(var(--r,-8deg)) scale(1.05); opacity: 0; }
}
@keyframes speedlinesPulse {
  0% { opacity: 0; transform: scale(0.6); }
  30% { opacity: 0.9; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.4); }
}
@keyframes panelShake {
  0%,100% { transform: translate(0,0) rotate(0); }
  20% { transform: translate(-3px,2px) rotate(-0.6deg); }
  40% { transform: translate(3px,-2px) rotate(0.6deg); }
  60% { transform: translate(-2px,-2px) rotate(-0.4deg); }
  80% { transform: translate(2px,2px) rotate(0.4deg); }
}

.panel.is-clicked, .panel-cut.is-clicked > .panel-cut-inner {
  animation: panelShake 0.4s ease-in-out;
}
.panel-cut.is-clicked { animation: panelShake 0.4s ease-in-out; }

.click-sfx {
  position: absolute;
  font-family: 'Bangers', 'Reggae One', system-ui;
  font-weight: 900;
  letter-spacing: 0.04em;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  color: var(--accent-yellow);
  text-shadow: 6px 6px 0 var(--ink);
  font-size: 56px;
  line-height: 0.9;
  animation: sfxPop 0.7s ease-out forwards;
  pointer-events: none;
  z-index: 30;
  white-space: nowrap;
}
.click-speedlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(15,13,10,0.95) 0deg 0.7deg,
    transparent 0.7deg 6deg);
  mix-blend-mode: multiply;
  animation: speedlinesPulse 0.6s ease-out forwards;
  z-index: 25;
}

/* === 彩蛋字樣 — 集中線中心點擊閃現 === */
@keyframes eggPop {
  0%   { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(0.3); }
  18%  { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1.5); }
  32%  { opacity: 1; transform: translate(-50%, -50%) rotate(-5deg) scale(1.0); }
  55%  { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(-3deg) scale(1.2); }
}
.easter-egg-text {
  position: absolute;
  top: 50%;
  left: 50%;
  font-family: 'Bangers', 'Reggae One', system-ui;
  font-weight: 900;
  letter-spacing: 0.06em;
  /* 字再大一點 */
  font-size: clamp(140px, 20vw, 280px);
  /* 浮誇螢光桃紅 + 黃綠青三層錯位陰影 + 黑邊 — Splatoon × Comic 雙打 */
  color: #ff2bb5;
  -webkit-text-stroke: 9px var(--ink);
  paint-order: stroke fill;
  text-shadow:
    6px 6px 0 var(--accent-yellow),
    12px 12px 0 #1de9b6,
    18px 18px 0 var(--ink),
    0 0 36px rgba(255, 43, 181, 0.85);
  white-space: nowrap;
  pointer-events: none;
  z-index: 100;
  animation: eggPop 1.6s cubic-bezier(.3,.7,.3,1.2) forwards;
  transform-origin: center;
  /* 不被選取反白影響效果 */
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

/* === 斯普拉遁式墨水噴濺（SVG 不規則路徑版本） === */
.ink-splat-anim {
  opacity: 0;
  transform-origin: center;
  animation: inkSplatGrow 0.95s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes inkSplatGrow {
  0%   { transform: scale(0)    translate(0, -10px); opacity: 0; }
  15%  { transform: scale(1.35) translate(0, 0);     opacity: 1; }
  55%  { transform: scale(1.0)  translate(0, 0);     opacity: 1; }
  100% { transform: scale(0.95) translate(0, 14px);  opacity: 0; }
}

/* === 斜切格 (Diagonal cut panels) ===
   用 clip-path 把格子切成不規則四邊形。
   外殼負責 clip + 黑底 (作邊框)，內層 inset 1 個 bw 形成「黑邊」效果。 */
.panel-cut {
  position: relative;
  background: var(--ink);
  filter: drop-shadow(0 0 0 var(--ink));
  isolation: isolate;
  margin: calc(var(--bw) * -0.5);
}
.panel-cut > .panel-cut-inner {
  position: absolute;
  inset: var(--bw);
  background: #fffaf0;
  background-color: #fffaf0 !important;
  overflow: hidden;
}
.panel-cut.cut--tl-br { clip-path: polygon(0 0, 100% 0, 100% 76%, 76% 100%, 0 100%); }
.panel-cut.cut--tl-br > .panel-cut-inner { clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 0 100%); }
.panel-cut.cut--tr-bl { clip-path: polygon(0 0, 100% 0, 100% 100%, 24% 100%, 0 75%); }
.panel-cut.cut--tr-bl > .panel-cut-inner { clip-path: polygon(0 0, 100% 0, 100% 100%, 25% 100%, 0 76%); }
.panel-cut.cut--diag-down { clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%); }
.panel-cut.cut--diag-down > .panel-cut-inner { clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%); }
.panel-cut.cut--diag-up { clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 100%); }
.panel-cut.cut--diag-up > .panel-cut-inner { clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 100%); }
.panel-cut.cut--parallelogram { clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%); }
.panel-cut.cut--parallelogram > .panel-cut-inner { clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%); }
.panel-cut.cut--zoom-corner {
  /* 一格的角落「凹」進另一格 — 經典戰鬥場面用 */
  clip-path: polygon(0 0, 100% 0, 100% 100%, 38% 100%, 28% 62%, 0 62%);
}
.panel-cut.cut--zoom-corner > .panel-cut-inner {
  clip-path: polygon(0 0, 100% 0, 100% 100%, 38% 100%, 28% 62%, 0 62%);
}

/* === 跨格 (Bleed) ===
   一個元素跨越多個格子。父用 grid，子加這個 class 並指定 grid-column/row。 */
.bleed {
  position: relative;
  z-index: 8;
  pointer-events: none;
}
.bleed > * { pointer-events: auto; }

/* 突破畫框 — 圖片元素超出格框 */
.breakout {
  position: absolute;
  z-index: 9;
  filter: drop-shadow(4px 4px 0 var(--ink));
}

/* 跨格大狀聲詞 */
.sfx-bleed {
  position: absolute;
  z-index: 12;
  pointer-events: none;
}
.panel--inkbg { background: var(--ink); color: var(--paper); }
.panel--red { background: var(--accent-red); color: #fff; }
.panel--blue { background: var(--accent-blue); color: #fff; }
.panel--yellow { background: var(--accent-yellow); color: var(--ink); }
.panel--paper { background: var(--paper); }

/* 集中線 / 速度線背景（用 SVG via gradient） */
.bg-speedlines {
  background-image:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(15,13,10,0.85) 0deg 0.6deg,
      transparent 0.6deg 5deg);
  background-size: 100% 100%;
}
.bg-halftone-dense {
  background-image: radial-gradient(rgba(15,13,10,0.30) 1.2px, transparent 1.6px);
  background-size: 10px 10px;
}
.bg-halftone-light {
  background-image: radial-gradient(rgba(15,13,10,0.12) 1px, transparent 1.3px);
  background-size: 12px 12px;
}
.bg-halftone-red {
  background-image: radial-gradient(rgba(230,57,70,0.28) 1.2px, transparent 1.6px);
  background-size: 11px 11px;
}
.bg-halftone-blue {
  background-image: radial-gradient(rgba(29,78,216,0.28) 1.2px, transparent 1.6px);
  background-size: 11px 11px;
}
.bg-stripes {
  background-image: repeating-linear-gradient(45deg,
    var(--ink) 0 4px, transparent 4px 12px);
}
.bg-paper { background: var(--paper-2); }

/* 圖片占位（ストライプ + label） */
.placeholder-img {
  position: relative;
  width: 100%;
  height: 100%;
  background:
    repeating-linear-gradient(135deg,
      rgba(15,13,10,0.08) 0 8px,
      rgba(15,13,10,0.02) 8px 16px),
    var(--paper-2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.placeholder-img > span {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink);
  background: rgba(255,250,240,0.85);
  padding: 4px 8px;
  border: 1.5px solid var(--ink);
  letter-spacing: 0.05em;
}

/* 對話框 */
.bubble {
  position: relative;
  background: #fffaf0;
  border: 3px solid var(--ink);
  border-radius: 18px / 22px;
  padding: 10px 14px;
  font-weight: 700;
  display: inline-block;
  box-shadow: 3px 3px 0 var(--ink);
}
.bubble::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  background: #fffaf0;
  border-right: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
  transform: rotate(45deg);
  bottom: -10px;
  left: 28px;
}
.bubble--cloud {
  border-radius: 50px / 30px;
}
.bubble--shout {
  background: #fff;
  border: 4px solid var(--ink);
  clip-path: polygon(
    0% 20%, 8% 10%, 16% 22%, 24% 6%, 34% 18%, 44% 4%, 56% 16%, 66% 0%, 76% 14%, 86% 6%, 96% 18%, 100% 32%,
    92% 44%, 100% 56%, 92% 68%, 100% 82%, 86% 92%, 74% 84%, 64% 96%, 52% 86%, 40% 100%, 30% 88%, 18% 96%, 8% 84%, 0% 70%,
    8% 56%, 0% 42%
  );
  border: none;
  box-shadow: none;
  padding: 24px 28px;
}
.bubble--shout::after { display: none; }

/* ===== 氣泡動畫大全 ===== */
@keyframes bubbleFloat {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  50%     { transform: translateY(-8px) rotate(1deg); }
}
@keyframes bubbleHeartbeat {
  0%,100% { transform: scale(1); box-shadow: 3px 3px 0 var(--ink); }
  15%     { transform: scale(1.08); box-shadow: 5px 5px 0 var(--ink); }
  30%     { transform: scale(1); }
  45%     { transform: scale(1.12); box-shadow: 6px 6px 0 var(--ink); }
  60%     { transform: scale(1); box-shadow: 3px 3px 0 var(--ink); }
}
@keyframes bubbleJitter {
  0%,100% { transform: translate(0,0) rotate(-1deg); }
  20%     { transform: translate(-2px,1px) rotate(0.5deg); }
  40%     { transform: translate(2px,-1px) rotate(-1.5deg); }
  60%     { transform: translate(-1px,-2px) rotate(1deg); }
  80%     { transform: translate(1px,2px) rotate(-0.5deg); }
}
@keyframes bubbleSwing {
  0%,100% { transform: rotate(-3deg); }
  50%     { transform: rotate(3deg); }
}
@keyframes bubbleBounce {
  0%,100% { transform: translateY(0) scaleY(1); }
  40%     { transform: translateY(-12px) scaleY(1.05); }
  60%     { transform: translateY(0) scaleY(0.92); }
  80%     { transform: translateY(-4px) scaleY(1.02); }
}
@keyframes bubblePop {
  0%   { transform: scale(0.7) rotate(-8deg); opacity: 0; }
  60%  { transform: scale(1.15) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(-1deg); opacity: 1; }
}
@keyframes bubbleGlow {
  0%,100% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 0 var(--accent-yellow); }
  50%     { box-shadow: 3px 3px 0 var(--ink), 0 0 28px 8px var(--accent-yellow); }
}
@keyframes bubbleShake {
  0%,100% { transform: translate(0,0); }
  10%     { transform: translate(-3px,2px) rotate(-2deg); }
  20%     { transform: translate(3px,-2px) rotate(2deg); }
  30%     { transform: translate(-3px,-1px) rotate(-1deg); }
  40%     { transform: translate(3px,1px) rotate(1.5deg); }
  50%     { transform: translate(-2px,2px) rotate(-2deg); }
  60%     { transform: translate(2px,-2px) rotate(1deg); }
  70%     { transform: translate(-1px,1px) rotate(-1deg); }
  80%     { transform: translate(1px,-1px) rotate(0.5deg); }
}
@keyframes bubbleBreathe {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.04); }
}
@keyframes bubbleTilt {
  0%   { transform: rotate(-2deg) translateY(0); }
  25%  { transform: rotate(2deg) translateY(-3px); }
  50%  { transform: rotate(-1deg) translateY(-1px); }
  75%  { transform: rotate(3deg) translateY(-4px); }
  100% { transform: rotate(-2deg) translateY(0); }
}
@keyframes bubbleFlash {
  0%,40%,100% { background: #fffaf0; color: var(--ink); }
  50%,90%     { background: var(--accent-yellow); color: var(--ink); }
}
@keyframes bubbleRubber {
  0%   { transform: scale(1,1); }
  30%  { transform: scale(1.25,0.75); }
  40%  { transform: scale(0.75,1.25); }
  60%  { transform: scale(1.15,0.85); }
  100% { transform: scale(1,1); }
}
@keyframes typewriter {
  from { clip-path: inset(0 100% 0 0); }
  to   { clip-path: inset(0 0 0 0); }
}
@keyframes spinTail {
  0%,100% { transform: rotate(45deg) translate(0,0); }
  50%     { transform: rotate(50deg) translate(2px,3px); }
}

/* 變體 — 套用在 .bubble 上 */
.bubble--anim-float     { animation: bubbleFloat     3.2s ease-in-out infinite; }
.bubble--anim-heartbeat { animation: bubbleHeartbeat 1.4s ease-in-out infinite; transform-origin: center; }
.bubble--anim-jitter    { animation: bubbleJitter    0.55s steps(4,end)    infinite; }
.bubble--anim-swing     { animation: bubbleSwing     2.4s ease-in-out infinite; transform-origin: top center; }
.bubble--anim-bounce    { animation: bubbleBounce    1.6s cubic-bezier(.5,0,.3,1.4) infinite; }
.bubble--anim-pop       { animation: bubblePop       0.7s cubic-bezier(.5,0,.2,1.6) both, bubbleBreathe 2.8s 0.7s ease-in-out infinite; }
.bubble--anim-glow      { animation: bubbleGlow      2s   ease-in-out infinite; }
.bubble--anim-shake     { animation: bubbleShake     0.4s steps(8,end)    infinite; }
.bubble--anim-breathe   { animation: bubbleBreathe   2.4s ease-in-out infinite; transform-origin: center; }
.bubble--anim-tilt      { animation: bubbleTilt      4s   ease-in-out infinite; transform-origin: bottom left; }
.bubble--anim-flash     { animation: bubbleFlash     1.4s ease-in-out infinite; }
.bubble--anim-rubber    { animation: bubbleRubber    1.8s ease-in-out infinite; }
.bubble--anim-type      { overflow: hidden; animation: typewriter 2.4s steps(20,end) infinite alternate; }
.bubble--anim-spintail::after { animation: spinTail 1.6s ease-in-out infinite; }

/* hover 加倍 */
.bubble:hover { animation-duration: 0.35s !important; }

/* 狀聲詞 */
.sfx {
  font-family: 'Bowlby One', 'Reggae One', 'Noto Sans TC', system-ui;
  font-weight: 900;
  letter-spacing: 0.02em;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  color: #fffaf0;
  text-shadow: 6px 6px 0 var(--ink);
  line-height: 0.85;
  display: inline-block;
  transform: rotate(-6deg);
}

/* 狀聲詞動畫 */
@keyframes sfxWobble {
  0%,100% { transform: rotate(var(--r,-6deg)) scale(1); }
  25%     { transform: rotate(calc(var(--r,-6deg) + 4deg)) scale(1.05); }
  50%     { transform: rotate(calc(var(--r,-6deg) - 3deg)) scale(0.97); }
  75%     { transform: rotate(calc(var(--r,-6deg) + 2deg)) scale(1.08); }
}
@keyframes sfxBlink {
  0%,40%,100% { opacity: 1; transform: rotate(var(--r,-6deg)) scale(1); }
  20%,60%     { opacity: 0.3; transform: rotate(var(--r,-6deg)) scale(0.85); }
}
@keyframes sfxBurst {
  0%   { transform: rotate(var(--r,-6deg)) scale(0.6); opacity: 0; }
  20%  { transform: rotate(var(--r,-6deg)) scale(1.2); opacity: 1; }
  100% { transform: rotate(var(--r,-6deg)) scale(1); opacity: 1; }
}
.sfx--anim-wobble { animation: sfxWobble 0.6s ease-in-out infinite; }
.sfx--anim-blink  { animation: sfxBlink  1.2s ease-in-out infinite; }
.sfx--anim-burst  { animation: sfxBurst  0.8s cubic-bezier(.5,0,.2,1.6) both; }

@keyframes loadingDot {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
  40%      { transform: translateY(-14px) scale(1.15); opacity: 1; }
}
@keyframes pressStart {
  0%, 100% { transform: rotate(-2deg) scale(1); box-shadow: 5px 5px 0 var(--ink); }
  50%      { transform: rotate(-2deg) scale(1.04); box-shadow: 6px 6px 0 var(--ink), 0 0 0 4px var(--accent-yellow); }
}
.sfx--red { color: var(--accent-red); }
.sfx--yellow { color: var(--accent-yellow); }
.sfx--blue { color: var(--accent-blue); }
.sfx--ink { color: var(--ink); -webkit-text-stroke: 3px var(--paper); text-shadow: 5px 5px 0 var(--accent-red); }

/* 章節標籤 第N話 — 漫畫格 corner sticker 風（簡潔但有重量） */
.chapter-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: var(--paper);
  padding: 8px 16px 9px;
  font-family: 'Noto Sans TC', system-ui;
  font-weight: 900;
  font-size: 17px;
  letter-spacing: 0.06em;
  box-shadow: 4px 4px 0 var(--accent-red);
  transform: rotate(-1.5deg);
  position: relative;
  flex-shrink: 0;
}
.chapter-tag .num {
  font-family: 'Bowlby One', system-ui;
  color: var(--accent-yellow);
  font-size: 1.35em;
  font-weight: 900;
  letter-spacing: 0;
  margin: 0 2px;
}

/* 標題字 — 中英文搭配統一（Noto Sans TC 優先，英文字才會跟中文同樣粗細） */
.h-display {
  font-family: 'Noto Sans TC', 'Bowlby One', 'Bangers', system-ui;
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.1;
  text-wrap: balance;
}
/* 純英文展示字（如 EST. 2006、HIGH SCORE）保留 Bowlby One 粗體效果 */
.h-display-en {
  font-family: 'Bowlby One', 'Bangers', system-ui;
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 0.95;
}

/* JoJo 風誇張主標 */
.h-jojo {
  font-family: 'Bowlby One', 'Bangers', system-ui;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 0.85;
  display: inline-block;
  position: relative;
  color: var(--accent-yellow);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  text-shadow:
    7px 7px 0 var(--accent-red),
    7px 7px 0 1px var(--ink);
  transform: skewX(-6deg);
  filter: drop-shadow(2px 2px 0 var(--ink));
  text-transform: uppercase;
}
.h-jojo::before {
  content: '';
  position: absolute;
  inset: -8% -4%;
  background: radial-gradient(rgba(15,13,10,0.35) 1.5px, transparent 1.8px);
  background-size: 6px 6px;
  z-index: -1;
  mask: radial-gradient(ellipse at center, black 30%, transparent 70%);
  -webkit-mask: radial-gradient(ellipse at center, black 30%, transparent 70%);
}
.h-jojo span.shard {
  display: inline-block;
  transform: rotate(-3deg) translateY(-4px);
}
.h-jojo span.shard:nth-child(2n) { transform: rotate(2deg) translateY(2px); }
.h-jojo span.shard:nth-child(3n) { transform: rotate(-5deg) translateY(-2px); }

/* AGD logo mark — 強化 */
.topnav .brand .logo-mark {
  background: var(--accent-red);
  color: #fff;
  padding: 6px 12px;
  border: 4px solid var(--paper);
  box-shadow: 4px 4px 0 var(--paper), 4px 4px 0 7px var(--accent-yellow);
  transform: rotate(-4deg) skewX(-8deg);
  font-family: 'Bowlby One', sans-serif;
  font-size: 22px;
  letter-spacing: 0.05em;
  -webkit-text-stroke: 1px var(--ink);
}
.h-jp {
  font-family: 'Reggae One', 'Bowlby One', system-ui;
  letter-spacing: 0.02em;
  line-height: 1;
}

/* 動線箭頭裝飾 */
.flow-arrow {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}

/* 漫畫格 hover 效果 */
.panel.is-clickable {
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(.2,.7,.2,1.3), box-shadow 0.18s;
}
.panel.is-clickable:hover {
  transform: translate(-3px, -3px) rotate(-0.6deg);
  box-shadow: 10px 10px 0 var(--ink);
}
.panel.is-clickable:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--ink);
}

/* nav */
.topnav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--ink);
  color: var(--paper);
  border-bottom: var(--bw) solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  font-family: 'Bowlby One', system-ui;
  letter-spacing: 0.03em;
}
.topnav .brand {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px;
}
/* AGD logo mark in topnav — overrides earlier rule */
.topnav .brand .logo-mark.logo-mark { display:inline-block; }
.topnav nav {
  display: flex; gap: 22px; font-size: 14px;
}
.topnav nav a {
  color: var(--paper);
  text-decoration: none;
  position: relative;
  padding: 4px 2px;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 900;
  letter-spacing: 0.05em;
}
.topnav nav a:hover { color: var(--accent-yellow); }
.topnav nav a:hover::after {
  content: '';
  position: absolute;
  inset: auto 0 -2px 0;
  height: 3px;
  background: var(--accent-yellow);
}

/* layout helpers */
.container {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 24px;
  position: relative;
  z-index: 2;
}

/* 章節分隔（gutter） */
.chapter {
  padding: 28px 0 16px;
  position: relative;
}
.chapter-header {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.chapter-header .title {
  /* LOADING 風格 — 紅字 + 厚黑邊 + 黑色錯位陰影（同 .click-sfx） */
  font-family: 'Bangers', 'Reggae One', 'Noto Sans TC', system-ui;
  font-weight: 900;
  font-size: clamp(28px, 4.2vw, 50px);
  letter-spacing: 0.04em;
  line-height: 1.05;
  text-wrap: balance;
  color: var(--accent-red);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--ink);
  display: inline-block;
  transform: rotate(-1deg);
}
.chapter-header .sub {
  font-family: 'Bangers', system-ui;
  letter-spacing: 0.14em;
  color: var(--ink);
  opacity: 0.55;
  font-size: 14px;
  font-weight: 400;
}

/* ============ 課程地圖（CurriculumDetail） ============ */
.curriculum-map {
  --track-anim: #e63946;
  --track-game: #1d4ed8;
  --track-art: #b76aff;
  --track-cross: #2d8a4f;
  --track-core: #ffd60a;
  --cm-line: rgba(15,13,10,0.2);
}
.curriculum-legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  padding: 14px 18px; margin-bottom: 18px;
  background: var(--paper-2);
  border: 3px solid var(--ink);
  font-family: 'Bangers', 'Noto Sans TC', sans-serif;
  letter-spacing: 0.06em;
  font-size: 13px;
}
.curriculum-legend .lg-item { display: flex; align-items: center; gap: 6px; }
.curriculum-legend .lg-dot {
  width: 14px; height: 14px; border: 2px solid var(--ink); display: inline-block;
}
.curriculum-legend .lg-dot.core { background: var(--track-core); }
.curriculum-legend .lg-dot.anim { background: var(--track-anim); }
.curriculum-legend .lg-dot.game { background: var(--track-game); }
.curriculum-legend .lg-dot.art  { background: var(--track-art); }
.curriculum-legend .lg-dot.cross{ background: var(--track-cross); }
.curriculum-legend .lg-mark { color: var(--accent-red); font-weight: 900; font-size: 16px; }

.curriculum-grid {
  border: 4px solid var(--ink);
  background: var(--paper);
  overflow: hidden;
}
.cm-header, .cm-track {
  display: grid;
  grid-template-columns: 180px repeat(8, 1fr);
}
.cm-header {
  background: var(--ink);
  color: var(--paper);
}
.cm-header .cm-corner {
  padding: 12px 14px;
  font-family: 'Bangers', sans-serif;
  letter-spacing: 0.12em;
  font-size: 12px;
  border-right: 1px solid #444;
  display: flex; align-items: center;
  color: var(--accent-yellow);
}
.cm-header .cm-sem {
  padding: 10px 6px;
  text-align: center;
  border-right: 1px solid #333;
  font-family: 'Bangers', sans-serif;
}
.cm-header .cm-sem:last-child { border-right: none; }
.cm-header .cm-sem.year-start { box-shadow: inset 3px 0 0 var(--accent-yellow); }
.cm-header .cm-sem .cm-year {
  color: var(--accent-yellow);
  font-size: 11px; letter-spacing: 0.1em;
}
.cm-header .cm-sem .cm-term {
  font-size: 12px; margin-top: 2px;
  color: var(--paper);
}

.cm-track {
  border-bottom: 3px solid var(--ink);
  min-height: 110px;
}
.cm-track:last-child { border-bottom: none; }
.cm-track .cm-label {
  padding: 14px 12px;
  border-right: 3px solid var(--ink);
  display: flex; flex-direction: column; justify-content: center;
  background: var(--paper);
  position: relative;
}
.cm-track .cm-label::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 6px;
}
.cm-track.t-anim  .cm-label::before { background: var(--track-anim); }
.cm-track.t-game  .cm-label::before { background: var(--track-game); }
.cm-track.t-art   .cm-label::before { background: var(--track-art); }
.cm-track.t-cross .cm-label::before { background: var(--track-cross); }
.cm-track.t-core  .cm-label::before { background: var(--track-core); }

.cm-track .cm-label .cm-name {
  font-family: 'Reggae One', 'Bangers', 'Noto Sans TC', sans-serif;
  font-size: 17px; font-weight: 900;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  color: var(--ink);
}
.cm-track .cm-label .cm-name-en {
  font-family: 'Bangers', sans-serif;
  font-size: 11px; letter-spacing: 0.12em;
  opacity: 0.55;
}
.cm-track .cm-label .cm-desc {
  font-size: 11px; line-height: 1.5; margin-top: 6px;
  opacity: 0.78;
}

.cm-track.t-core { background: var(--ink); }
.cm-track.t-core .cm-label { background: var(--ink); border-right-color: #333; }
.cm-track.t-core .cm-label .cm-name { color: var(--accent-yellow); }
.cm-track.t-core .cm-label .cm-name-en { color: #aaa; }
.cm-track.t-core .cm-label .cm-desc { color: #bbb; }

.cm-cell {
  padding: 8px 6px;
  border-right: 1px solid var(--cm-line);
  display: flex; flex-direction: column; gap: 5px;
}
.cm-cell:last-child { border-right: none; }
.cm-cell.year-start { box-shadow: inset 3px 0 0 var(--accent-yellow); }

.cm-track.t-anim  .cm-cell { background: rgba(230, 57, 70, 0.06); }
.cm-track.t-game  .cm-cell { background: rgba(29, 78, 216, 0.06); }
.cm-track.t-art   .cm-cell { background: rgba(183, 106, 255, 0.07); }
.cm-track.t-cross .cm-cell { background: rgba(45, 138, 79, 0.07); }

.cm-course {
  background: #fffaf0;
  border: 2px solid var(--ink);
  border-left-width: 5px;
  padding: 6px 8px;
  font-size: 12px;
  line-height: 1.25;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.cm-course .cm-cname { font-weight: 800; color: var(--ink); }
.cm-course .cm-credit {
  font-family: 'Bangers', monospace;
  font-size: 10px; letter-spacing: 0.08em;
  opacity: 0.65; margin-top: 2px;
}
.cm-course:hover {
  transform: translate(-2px, -2px);
  box-shadow: 3px 3px 0 var(--ink);
}
.cm-track.t-anim  .cm-course { border-left-color: var(--track-anim); }
.cm-track.t-game  .cm-course { border-left-color: var(--track-game); }
.cm-track.t-art   .cm-course { border-left-color: var(--track-art); }
.cm-track.t-cross .cm-course { border-left-color: var(--track-cross); }
.cm-track.t-core  .cm-course {
  background: #2a2520;
  color: var(--paper);
  border-color: var(--accent-yellow);
  border-left-color: var(--accent-yellow);
}
.cm-track.t-core  .cm-course .cm-cname { color: var(--paper); }
.cm-track.t-core  .cm-course .cm-credit { color: var(--accent-yellow); opacity: 0.85; }
.cm-track.t-core  .cm-course.cm-capstone {
  background: linear-gradient(135deg, #c89a3c 0%, #e63946 100%);
  border-color: var(--accent-yellow);
}
.cm-track.t-core  .cm-course.cm-capstone .cm-cname { color: var(--paper); }
.cm-course .cm-mark {
  color: var(--accent-yellow);
  font-weight: 900;
  margin-right: 4px;
}
.cm-track.t-core .cm-course.cm-capstone .cm-mark { color: #fff; text-shadow: 1px 1px 0 var(--ink); }

.curriculum-flow {
  margin-top: 22px;
  padding: 18px 20px;
  background: var(--paper-2);
  border: 3px dashed var(--ink);
  font-family: 'Bangers', 'Noto Sans TC', sans-serif;
  letter-spacing: 0.06em;
  font-size: 14px;
  text-align: center;
}
.curriculum-flow .arrow {
  display: inline-block; margin: 0 8px;
  color: var(--accent-red); font-weight: 900;
}
.curriculum-flow strong { color: var(--accent-red); }

.curriculum-foot {
  margin-top: 20px;
  font-size: 12px;
  line-height: 1.7;
  opacity: 0.85;
}
.curriculum-foot p { margin: 4px 0; }
.curriculum-foot .mark { color: var(--accent-red); font-weight: 900; }

/* 平板 / 手機 — 橫向滾動 */
@media (max-width: 1100px) {
  .curriculum-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 3px solid var(--ink);
  }
  .curriculum-grid { min-width: 1180px; border: none; }
}

/* utility */
.divider-zigzag {
  height: 18px;
  background:
    linear-gradient(135deg, var(--ink) 25%, transparent 25%) 0 0/14px 14px,
    linear-gradient(225deg, var(--ink) 25%, transparent 25%) 0 0/14px 14px,
    var(--paper);
  border-top: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
  margin: 32px 0;
}

/* footer */
.foot {
  margin-top: 60px;
  background: var(--ink);
  color: var(--paper);
  padding: 36px 24px 24px;
  border-top: var(--bw) solid var(--ink);
}
.foot .grid {
  max-width: 1320px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
.foot h4 {
  font-family: 'Bowlby One', system-ui;
  margin: 0 0 8px;
  color: var(--accent-yellow);
  letter-spacing: 0.05em;
}
.foot a { color: var(--paper); text-decoration: none; display: block; padding: 4px 0; opacity: 0.85; }
.foot a:hover { color: var(--accent-yellow); opacity: 1; }
.foot .end {
  text-align: center;
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px dashed rgba(244,236,216,0.3);
  font-size: 12px;
  opacity: 0.7;
}

@media (max-width: 720px) {
  .foot .grid { grid-template-columns: repeat(2,1fr); }
}

/* === 漢堡選單按鈕 ===
   PC 預設隱藏，只在 ≤760px 顯示。3 條黑線堆疊風格 */
.hamburger {
  display: none;
  background: var(--accent-yellow);
  border: 3px solid var(--paper);
  box-shadow: 3px 3px 0 var(--paper);
  padding: 8px 10px;
  cursor: pointer;
  flex-direction: column;
  gap: 4px;
  transform: rotate(-2deg);
  align-items: stretch;
  justify-content: center;
}
.hamburger span {
  display: block;
  width: 22px;
  height: 3px;
  background: var(--ink);
  transition: transform 0.2s, opacity 0.2s;
}
.topnav.is-open .hamburger span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.topnav.is-open .hamburger span:nth-child(2) {
  opacity: 0;
}
.topnav.is-open .hamburger span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* === RWD · 手機版 (≤760px) ===
   PC / 平板（≥761px）完全不受以下規則影響 — 所有改動都包在 media query 內 */
@media (max-width: 760px) {
  /* 1. 所有 comic-tier 從橫排改成垂直堆疊 */
  .comic-tier {
    flex-direction: column;
  }
  .comic-tier > .panel {
    flex: 1 1 auto;
    min-height: 180px;
  }
  /* 拉高 tier 的 min-height 限制 — 改成自動依內容撐開 */
  .tier-tall, .tier-splash, .tier-mid, .tier-short { min-height: auto; }

  /* 2. TopNav — 主選單藏起來，改用漢堡（漢堡按鈕由 JSX 端控制） */
  .hamburger { display: flex; }
  .topnav .nav-divider { display: none; }
  .topnav { padding: 8px 14px; gap: 8px; flex-wrap: nowrap; }
  .topnav .brand { font-size: 14px; gap: 6px; }
  .topnav .brand .logo-mark { font-size: 16px; padding: 4px 8px; border-width: 3px; }
  .topnav .brand > div > span:first-child { font-size: 13px; }
  .topnav .brand > div > span:nth-child(2) { font-size: 9px; }
  .topnav nav {
    /* 預設 hidden，由 .topnav.is-open nav 翻開 */
    display: none;
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: var(--ink);
    border-top: 3px solid var(--paper);
    padding: 12px 18px;
    flex-direction: column;
    gap: 14px;
    z-index: 60;
  }
  .topnav.is-open nav { display: flex; }
  .topnav nav a { font-size: 16px; padding: 6px 0; }
  /* 立即報名按鈕在手機縮小一點 */
  .topnav > a:last-child { padding: 6px 10px; font-size: 12px; }

  /* 3. 大標題字級 — 只在手機調整 */
  .h-display { font-size: clamp(28px, 9vw, 48px); }
  .h-jojo { font-size: clamp(36px, 11vw, 64px) !important; }

  /* 4. Chapter tag 縮小 */
  .chapter-tag { transform: rotate(-2deg) scale(0.85); transform-origin: left center; }
  .chapter-header .title { font-size: clamp(32px, 9vw, 56px) !important; }

  /* 5. 半色調 / 集中線 — 在小螢幕降階避免閃眼 */
  .bg-speedlines { opacity: 0.5 !important; }
  .bg-halftone-dense, .bg-halftone-red, .bg-halftone-blue {
    background-size: 14px 14px;
  }

  /* 6. Container 內距收一收 */
  .container { padding: 16px 12px; }
  .chapter, .foot { scroll-margin-top: 60px; }

  /* 7. Panel 內距 */
  .panel { padding: 16px; }

  /* 8. SFX 狀聲詞縮小 */
  .sfx { font-size: clamp(28px, 8vw, 48px); }
  .click-sfx { font-size: 36px; }

  /* 9. Footer 改成 1 欄，更乾淨 */
  .foot .grid { grid-template-columns: 1fr; gap: 18px; }

  /* 10. 彩蛋字樣手機版縮小（避免破版） */
  .easter-egg-text {
    font-size: clamp(72px, 18vw, 120px);
    -webkit-text-stroke: 5px var(--ink);
    text-shadow:
      4px 4px 0 var(--accent-yellow),
      8px 8px 0 #1de9b6,
      12px 12px 0 var(--ink),
      0 0 24px rgba(255, 43, 181, 0.85);

the Fortifying Old City Project (再造歷史現場-見城計畫之見城館互動科技設計探討)","ICIDIC 2019 - 第12屆跨域設計產學國際研討會":"ICIDIC 2019 - The 12th International Conference on Interdisciplinary Design and Industrial-Academic Collaboration (ICIDIC 2019 - 第12屆跨域設計產學國際研討會)","2010高雄好漢玩字節-讓你好好玩漢字":"2010 Kaohsiung Dahan Character Festival: Let You Enjoy Chinese Characters (2010高雄好漢玩字節-讓你好好玩漢字)","百年文創力-兩岸案例文集1":"Century of Cultural and Creative Power: Cross-Strait Case Collection 1 (百年文創力-兩岸案例文集1)","國立台灣科技大學 設計研究所 碩士（2000 取得）":"Master of Design, Graduate Institute of Design, National Taiwan University of Science and Technology (Obtained in 2000)",電繪實驗室:"Digital Drawing Lab","電繪繪圖板專業教室，2D 角色與場景設計練功房。":"Professional graphics tablet classroom, a practice studio for 2D character and scene design.","電繪實驗室配備高規格繪圖板與專業繪圖軟體，是動遊系學生練習數位繪圖的核心場域。涵蓋 2D 角色設定、場景概念、UI 介面圖示，以及插畫與漫畫創作的實作課程。":"Equipped with high-specification graphics tablets and professional drawing software, the Digital Drawing Lab serves as the core venue for AGD students to practice digital drawing. It covers practical coursework spanning 2D character design, scene concept art, UI interface icons, illustration, and comic creation.","3D 列印工作坊":"3D Printing Workshop","FDM / 光固化 3D 列印機群，把建模作品實體化。":"FDM / photopolymer resin 3D printer fleet, bringing 3D modeled creations into physical reality.","3D 列印工作坊配備 FDM 與光固化（SLA/DLP）多台 3D 列印機，學生可將自己於 ZBrush、Maya、Blender 中建模的角色、道具直接列印成實體公仔／道具，銜接周邊商品設計與展覽用途。":"The 3D Printing Workshop is equipped with multiple FDM and photopolymer resin (SLA/DLP) 3D printers. Students can directly 3D print characters and props modeled in ZBrush, Maya, and Blender into physical figurines and props, bridging merchandise design and exhibition applications.",動作捕捉實驗室:"Motion Capture Lab","虛擬製片棚 — 不需後期、即時拍出寫實場景。":"Virtual production studio — realistic scenes shot in real time without post-production.","動作捕捉實驗室是培育新一代數位內容傳播與製作的前瞻數位創作人才的核心基地，將虛擬製片技術導入既有科系發展架構，不需後期製作，在攝影棚內即時拍出寫實場景的教學實作場域，並透過空間定位及光影投射技術，將虛擬世界重構於真實世界中。 可進行 3D 動畫的畫面拍攝、影像後製、特效處理、影像合成、動作擷取等。 預期教育目標： ● 培養學生虛擬場景製作能力 ● 培養學生即時改變虛擬場景的燈光與物件能力 ● 培育前瞻性即時影音合成技術人才 ● 培育動畫多媒體與遊戲開發之整合應用人才 ● 培養學生了解實體攝影機與虛擬攝影機連動之動態追蹤定位能力":`The Motion Capture Lab is the core hub for cultivating forward-looking digital creation talent for next-generation digital content communication and production. Integrating virtual production technology into the department's existing development framework, it provides a practical instructional environment for shooting realistic scenes in real time on stage without post-production, reconstructing virtual worlds in reality through spatial tracking and light projection techniques.

It supports 3D animation filming, video post-production, visual effects processing, image compositing, motion capture, and more.

Expected Educational Objectives:
● Cultivate students' ability in virtual scene production
● Cultivate students' ability to adjust lighting and objects in virtual scenes in real time
● Nurture forward-looking talent in real-time audiovisual compositing technology
● Nurture talent in integrated applications of animation, multimedia, and game development
● Cultivate students' understanding of dynamic motion tracking and positioning linking physical and virtual cameras`,體感互動實驗室:"Somatosensory Interaction Lab","VIVE 空間定位 + 跑步機 / 氣壓水平面 / 腳踏車。":"VIVE spatial tracking + treadmill / pneumatic motion simulator / bicycle.","體感互動實驗室提供體感遊戲互動體驗與開發環境，讓學生能即時修正、學習體感遊戲製作流程，以及驗證實作的環境。 設備包含： ● 定點式跑步機 ● 氣壓式水平面模擬 ● 腳踏車 ● 空間定位 VIVE 環境場域":`The Somatosensory Interaction Lab provides an interactive experience and development environment for motion-sensing games, allowing students to test, learn the motion-sensing game production pipeline, and verify their implementations in real time.

Equipment includes:
● Stationary treadmill
● Pneumatic horizontal motion simulator
● Bicycle
● VIVE spatial room-scale tracking environment`,偶動畫實驗室:"Puppet Animation Lab","停格動畫拍攝棚，立體造型 × 逐格手作的工藝場域。":"Stop-motion shooting studio, a craft workshop combining 3D character sculpting × frame-by-frame handmade artistry.","偶動畫實驗室是專為停格動畫（Stop-motion）設計的拍攝場域，配備可控光源、攝影軌道與專業拍攝軟體。學生在這裡完成立體造型製作、逐格拍攝、後製合成的完整流程，培養動畫工藝與耐心觀察的素養。":"The Puppet Animation Lab is a shooting space specially designed for stop-motion animation, equipped with controllable lighting, camera slider tracks, and professional capture software. Here, students complete the entire pipeline from 3D model sculpting and frame-by-frame shooting to post-production compositing, cultivating animation craft and patient observation skills.",週邊商品設計實驗室:"Merchandise Design Lab","3D 印表機、直噴機、熱轉印、雷射切割 — 動漫遊戲周邊一條龍。":"3D printers, direct-to-garment printers, heat transfer, laser cutting — end-to-end anime and game merchandise production.","週邊商品設計實驗室提供動漫、遊戲相關週邊商品設計所需環境設備，讓學生把角色與 IP 變成實體商品。 設備包含： ● 3D 印表機 ● 直噴機 ● 熱轉印 ● 雷射切割機":`The Merchandise Design Lab provides the environment and equipment required for anime and game-related merchandise design, empowering students to turn characters and IP into physical products.

Equipment includes:
● 3D printer
● Direct-to-substrate printer
● Heat transfer machine
● Laser cutting machine`,虛擬運動科藝館:"Virtual Sports Tech-Art Pavilion","運動 × 科技數位化創新場館。":"Digital innovation venue integrating sports × technology.","虛擬運動科藝館培育新一代「運動 × 科技」之數位化創新經濟人才。創造智慧場館營運新模式，促進室內場館智慧化；再來科技加值戶外運動，針對開放式之戶外運動場域特性（如登山、路跑、自行車等），發展戶外運動場域營運新模式。 預期教育目標： ● 培養學生運動科學專業知識 ● 培養學生對於傳統運動與數位化運動內容之加值應用 ● 培育前瞻性「運動 × 科技」數位化創新經濟人才 ● 培養學生對於「運動 × 科技」之跨域創新展演策畫與實踐能力":`The Virtual Sports Tech-Art Pavilion cultivates next-generation digital innovative economy talent in 'Sports × Technology'. It creates new operational models for smart sports venues, promoting indoor facility intelligence, and adds technological value to outdoor sports (such as mountaineering, road running, and cycling) to develop new outdoor venue operation models.

Expected Educational Objectives:
● Cultivate students' professional knowledge in sports science
● Cultivate students' value-added application skills bridging traditional sports and digitized athletic content
● Nurture forward-looking digital innovation economy talent in 'Sports × Technology'
● Cultivate students' capability in cross-disciplinary innovation, exhibition curation, and implementation in 'Sports × Technology'`,影音後製及自媒體節目製作實驗室:"Audiovisual Post-Production and We-Media Program Production Lab","4 間數位攝影棚 + 4 間錄音室，主播、聲優、配樂、3D 後製一站到位。":"4 digital studios + 4 recording studios: broadcast anchors, voice actors, scoring, and 3D post-production all in one.","影音後製及自媒體節目製作實驗室共 4 間數位攝影棚、4 間錄音室，培育主播、自媒體與傳播、聲音後製、遊戲音效、3D 後製以及動畫、配樂、影視、數位學習、廣播、聲優等相關人才。":"The Audiovisual Post-Production and We-Media Program Production Lab comprises a total of 4 digital production studios and 4 audio recording suites, cultivating talent in broadcasting, self-media and communication, audio post-production, game sound effects, 3D post-production, animation, film scoring, digital learning, radio broadcasting, voice acting, and related fields.","橫山創意基地（數位科技文化創意工坊）":"Hengshan Creative Base (Digital Technology and Cultural Creativity Workshop)","Maker 自造者文化基地，DIY × 科技元素跨域創作。":"Maker culture base, DIY × technology cross-disciplinary creation.","橫山創意基地（H0201 數位科技文化創意工坊）是 Maker（自造者）文化的實踐場域。自造者文化是在大眾文化當中產生的變種文化，植根於有獨特興趣且抱有執著信念的人群；自造者酷愛科技、熱衷親自實踐，堅信自己動手豐衣足食。 自造者文化是 DIY 文化的延伸，融合了技術元素，是龐克理念與反消費主義的結合。本工坊提供雷射切割、3D 列印、電子製作、木工等基礎設備，鼓勵學生跨域實作。":`The Hengshan Creative Base (H0201 Digital Technology and Cultural Creativity Workshop) is a practical venue for Maker culture. Maker culture is a subculture born out of popular culture, rooted in individuals with unique passions and persistent convictions; makers are passionate about technology, dedicated to hands-on practice, and firmly believe in creating with their own hands.

Maker culture is an extension of DIY culture fused with technological elements, combining punk ideals with anti-consumerism. This workshop provides foundational equipment such as laser cutting, 3D printing, electronics prototyping, and woodworking, encouraging students to engage in cross-disciplinary practice.`,"多媒體 / 遊戲與網路媒體教室":"Multimedia / Game and Network Media Classroom","多媒體教室 + 遊戲與網路媒體教室，理論到引擎開發的核心戰場。":"Multimedia Classroom + Game and Network Media Classroom, the core battlefield from theory to engine development.","多媒體教室與遊戲與網路媒體教室位於設計學院 B1，是動遊系日常授課與遊戲引擎實作的主要場域。配備電腦工作站可供學生在 Unity / Unreal 上進行專案開發、團隊協作與 UI 設計實務。":"Located on floor B1 of the College of Design, the Multimedia Classroom and Game and Network Media Classroom are the primary venues for AGD daily lectures and game engine practice. Equipped with computer workstations, they enable students to carry out project development, team collaboration, and UI design practice in Unity / Unreal.",電競專業教室:"Esports Professional Classroom","高規電競機台 + 賽事級設備。":"High-spec gaming rigs + tournament-grade equipment.","電競專業教室配備高規電競機台與賽事級設備，是電競產業學程的訓練主場。學生在此進行賽事分析、實況串流、賽事企劃實作，與動畫、遊戲設計形成跨域整合。":"Equipped with high-spec gaming rigs and tournament-grade equipment, the Esports Professional Classroom is the main training venue for the esports industry program. Here, students conduct match analysis, live streaming, and tournament planning practice, creating interdisciplinary integration with animation and game design.","三創基地 / 創客中心":"Three-Creativity Base / Maker Center","三創（創意、創新、創業）基地，學生提案、原型到育成的孵化器。":"Three-Creativity (Creativity, Innovation, Entrepreneurship) Base: an incubator taking student proposals from prototypes to incubation.","三創（創意、創新、創業）基地是學生提案、原型開發到育成的孵化器。從 IP 設計、品牌規劃、商業模式到展演實踐，學生在此把作品變成創業可能，銜接到產業界。":"The Three-Creativity (Creativity, Innovation, Entrepreneurship) Base is an incubator taking student proposals from prototype development to venture incubation. From IP design, brand planning, and business models to exhibition implementation, students transform their works into entrepreneurial opportunities and connect with industry.",課程:"Courses","115 學年度第 1 學期學生「Unity 證照輔導班」":"AY 115 Semester 1 · Unity Certification Workshop","Unity Certified User：Programmer 國際認證 · 11/14-11/15 · D0625 · 名額 20 人 · 楊智彰老師授課。":"Unity Certified User: Programmer · 11/14–11/15 · D0625 · 20 places · Instructor: Chih-Chang Yang.","一、開課名稱：「Unity Certified User (UCU) 國際認證」 二、上課日期：115/11/14(六)、115/11/15(日) 三、證照考試：115/11/15(日) 四、上課地點：D0625 教室 五、招生名額：20 人，額滿為止，可依序排列候補；報名學生需配合全程參與，不得缺課，並同意參加證照考試。 六、報名時間：即日起，至額滿為止。 七、考試科目：Programmer（以 C# 為程式語言，此為 Unity 第二張證照） 八、線上報名網址：https://reurl.cc/KEL8qq 主辦單位：動畫與遊戲設計系 協辦單位：研究發展處職涯發展暨校友服務中心 負責老師：楊智彰老師，分機 6112，Email: chzzyang@stu.edu.tw":`1. Course: Unity Certified User (UCU) international certification

Contact: Ya-Mei Chiang, ext. 6109, cym68@stu.edu.tw`,國際:"International","《癡迷的現實》再添 5 項國際影展 · 累計 13 項橫跨 7 國":"Obsessive Reality (《癡迷的現實》) Adds 5 More International Film Festivals · Reaching 13 Across 7 Countries","杜拜、芝加哥、希瓦吉、東京、義大利旅遊影展同月報到 — 陳美蓉老師指導的動畫短片《癡迷的現實》國際入圍提名累計達 13 項。":"Dubai, Chicago, Shivaji, Tokyo, and Italy tourism film festivals all arrived in the same month — the animated short film Obsessive Reality (《癡迷的現實》), advised by Chen Mei-rong (陳美蓉), has accumulated 13 international nominations and official selections.","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）學生原創動畫《癡迷的現實》再傳捷報。繼今年 4 月以 8 項國際影展紀錄登上系上「四部學生動畫橫掃國際影展」專題後，該片近日再獲阿拉伯聯合大公國、美國、印度、日本、義大利等五國影展青睞，一口氣新增 5 項入圍與提名，國際影展入圍提名累計達 13 項，足跡橫跨 7 個國家。 ■ 本次新增 5 項 • 阿拉伯聯合大公國「杜拜獨立影展」Dubai Independent Film Festival — Best Student Short 競賽單元 · 半決賽入圍 • 美國「芝加哥獨立影展」Chicago Indie Film Awards — Best Student Film 競賽單元 · 提名 • 印度「希瓦吉國際影展」Chhatrapati Shivaji International Film Festival — Animated Short Film 競賽單元 · 入圍 • 日本「東京國際電影獎」Tokyo International Cinema Awards — Best Animation 競賽單元 · 提名 • 第 15 屆「義大利國際旅遊影展」International Tour Film Festival — Animation 競賽單元 · 入圍 ■ 關於作品 《癡迷的現實》由動遊系學生陳志揚、宋秋陽、藤川黎星共同創作，陳美蓉老師指導。全片採 2D 數位手繪製作，以 1980 年代懷舊美術風格鋪陳偶像崇拜與理性認知之間的衝突，探討「單純喜歡」與「完全迷戀」之間的界線，提醒觀眾癡迷往往源自於了解不足，唯有理性支持才是真正的成長。作品呼應 SDG 4「優質教育」與 SDG 12「負責任消費與生產」，在社群時代的媒體素養議題上展現高度思辨性。 ■ 國內戰績 第 21 屆技專校院電腦動畫競賽「佳作」、2025 巴哈姆特 ACG 創作大賽動畫組「優選賞」、第 17 屆小花豹青年短片大獎「最佳劇情短片」，並入圍 2025 放視大賞 2D 動畫組。 指導老師陳美蓉表示，一部學生畢業製作能持續在不同國家的影展被看見，代表作品談的議題本身跨越了語言與文化。系主任鄧樹遠指出，動遊系長期強調「實務創作 × 社會價值」，鼓勵學生把畢業製作視為進入國際市場的第一張作品集，而非課程的終點。":`[Kaohsiung News] The original student animation Obsessive Reality (《癡迷的現實》) from the Department of Animation and Game Design (AGD) at Shu-Te University has once again brought great news. Following its record of 8 international film festivals in April (4) this year featured in the department's feature "Four Student Animations Sweeping International Film Festivals," the film has recently been favored by film festivals in five countries including the United Arab Emirates, the United States, India, Japan, and Italy, adding 5 nominations and selections at once, bringing its total international festival selections and nominations to 13, spanning 7 countries.

■ 5 Newly Added Selections
　• Dubai Independent Film Festival, United Arab Emirates — Best Student Short Competition · Semifinalist
　• Chicago Indie Film Awards, United States — Best Student Film Competition · Nominee
　• Chhatrapati Shivaji International Film Festival, India — Animated Short Film Competition · Official Selection
　• Tokyo International Cinema Awards, Japan — Best Animation Competition · Nominee
　• The 15th International Tour Film Festival, Italy — Animation Competition · Official Selection

■ About the Work

Obsessive Reality (《癡迷的現實》) was co-created by AGD students Chen Zhi-yang (陳志揚), Song Qiu-yang (宋秋陽), and Fujikawa Ryusei (藤川黎星), advised by Chen Mei-rong (陳美蓉). Produced entirely in 2D digital hand-drawn animation with a 1980s nostalgic art style, the film portrays the conflict between idol worship and rational cognition, exploring the boundary between "simple liking" and "complete obsession." It reminds the audience that obsession often stems from a lack of understanding, and that rational support is true growth. The work echoes SDG 4 "Quality Education" and SDG 12 "Responsible Consumption and Production," demonstrating profound critical thinking on media literacy in the social media era.

■ Domestic Achievements

"Merit Award" at the 21st Computer Animation Contest for Universities and Colleges (技專校院電腦動畫競賽), "Excellence Award" in the Animation Category at the 2025 Bahamut ACG Creation Contest (巴哈姆特 ACG 創作大賽), "Best Narrative Short Film" at the 17th Little Leopard Young Short Film Awards (小花豹青年短片大獎), and shortlisted in the 2D Animation Category at the 2025 Vision Get Wild (放視大賞).

Advising professor Chen Mei-rong (陳美蓉) stated that for a student graduation project to be continuously recognized in film festivals across different countries means that the issues addressed by the work transcend language and culture. Department Chair Deng Shu-yuan (鄧樹遠) pointed out that AGD has long emphasized "practical creation × social value," encouraging students to view their graduation projects as their first portfolio entering the international market rather than the end of a course.`,"累計 13 項國際入圍提名":"Accumulated 13 International Selections and Nominations",癡迷的現實:"Obsessive Reality (《癡迷的現實》)","Animation Short Film · 動畫短片":"Animation Short Film · Animated Short Film","陳志揚 · 宋秋陽 · 藤川黎星":"Chen Zhi-yang (陳志揚) · Song Qiu-yang (宋秋陽) · Fujikawa Ryusei (藤川黎星)","以 1980 年代懷舊美術風格呈現偶像崇拜與理性認知的衝突，融入 SDG 4「優質教育」與 SDG 12「負責任消費與生產」。國際影展入圍提名累計 13 項，橫跨西、土、美、印、阿聯、日、義 7 國。":'Presenting the conflict between idol worship and rational cognition in a 1980s nostalgic art style, integrating SDG 4 "Quality Education" and SDG 12 "Responsible Consumption and Production." Accumulated 13 international film festival selections and nominations across 7 countries: Spain, Turkey, USA, India, UAE, Japan, and Italy.',"阿聯 杜拜獨立影展 · Best Student Short 半決賽入圍 ★NEW":"UAE Dubai Independent Film Festival · Best Student Short Semifinalist ★NEW","美國 芝加哥獨立影展 · Best Student Film 提名 ★NEW":"USA Chicago Indie Film Awards · Best Student Film Nominee ★NEW","印度 希瓦吉國際影展 · Animated Short Film 入圍 ★NEW":"India Chhatrapati Shivaji International Film Festival · Animated Short Film Official Selection ★NEW","日本 東京國際電影獎 · Best Animation 提名 ★NEW":"Japan Tokyo International Cinema Awards · Best Animation Nominee ★NEW","第 15 屆 義大利國際旅遊影展 · Animation 入圍 ★NEW":"The 15th International Tour Film Festival, Italy · Animation Official Selection ★NEW","巴塞隆納 Author Film Festival 入圍":"Barcelona Author Film Festival Official Selection","西班牙 Stop Motion Film Festival 決賽":"Spain Stop Motion Film Festival Finalist","美國奧蘭多獨立電影節 · Best Student 半決賽":"USA Orlando Independent Filmmakers · Best Student Semifinalist","土耳其紐約伊斯坦堡短片影展 · Best Animation 入圍":"Turkey New York Istanbul Short Film Festival · Best Animation Official Selection","印度畢卡索國際電影節 · Animated Short 入圍":"India Picasso International Film Festival · Animated Short Official Selection","西班牙 Love Film Festival 決賽":"Spain Love Film Festival Finalist","美國拉斯維加斯短片影展 · Best Student 提名":"USA Las Vegas Short Film Festival · Best Student Nominee","美國洛杉磯獨立影展 · Best Student 提名":"USA Los Angeles Independent Film Festival Awards · Best Student Nominee","設計力出海！動遊系赴日實習邁入第九屆 · 4 名學生進駐 HC 公司挑戰日本職場":"Design Power Goes Overseas! AGD Japan Internship Enters 9th Year · 4 Students Enter HC Company to Challenge Japanese Workplace","教育部「學海築夢」計畫今年派 4 名學生赴日本愛媛縣松山市 HC 公司實習近三個月，由張純雅老師帶隊，並延伸至西予市、砥部町的地方創生與傳統工藝交流。":`Under the Ministry of Education's "Building Dreams Overseas" (學海築夢) program, 4 students were sent to hautecouture Inc. (HC) in Matsuyama City, Ehime Prefecture, Japan for a nearly 3-month internship, led by Zhang Chun-ya (張純雅), extending into regional revitalization and traditional craft exchanges in Seiyo City and Tobe Town.`,"【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）與日本知名動畫及遊戲製作公司「オートクチュール株式会社」（Hautecouture Inc.，簡稱 HC 公司）的國際實習合作邁入第九屆。今年雙方再度攜手執行教育部「學海築夢」海外實習計畫，展開為期近三個月的海外實習，實質強化學生的專業技能與國際視野。 本次計畫由動遊系國際小組成員張純雅老師與尹立老師共同策劃與執行。依據系上嚴格的海外實習遴選機制，學生須通過培訓、徵選、書面審查、初試與日語面試等多重關卡，並與 HC 公司進行全日文線上面試。今年度共錄取 4 位表現優異的學生，包含 3 位來自台灣的學生（王韻淑、夏妤馨、蕭培綸）以及 1 位來自澳門的學生（賴健豪），實習期間直接投入 HC 公司旗下動畫與遊戲專案，學習業界最新的設計技術與團隊協作模式。 ■ 從歡迎儀式到專案第一線 計畫主持人張純雅老師親自帶隊前往日本愛媛縣松山市，協助學生安頓租屋處、辦理通勤卡等生活必需事項，幫助學生迅速融入當地。實習首日，HC 公司為學生舉辦溫馨的歡迎儀式；學生隨後參與公司早會，與 HC 公司高層及各分公司成員進行線上會議並自我介紹。會中由公司分配實習任務，涵蓋插畫設計、人物角色設計、遊戲美術圖繪製等專案工作，讓學生實際進入業界真實製作流程，獲得寶貴的實戰經驗。 ■ 跨國文化分享 × 地方創生體驗 今年的實習計畫在專業技術之外，更大幅強化文化交流的深度。在企業實習期間，同學們於交流會議中主動分享台灣與澳門的文化特色，與日本公司同仁進行熱烈的雙向交流，展現跨國合作的青春活力與專業自信。此外，張純雅老師特別帶領實習團隊前往愛媛縣西予市，拜訪並參觀宇和先哲記念館，與一般社團法人西予市觀光物產協會的松本先生、山本先生以及產業部經濟振興課的宇都宮先生進行深度文化對話，交流台日兩地在地方觀光與文化推廣上的經驗。實習團隊隨後也前往砥部町，針對當地極具代表性的傳統工藝「砥部燒」進行文化拍攝與影像紀錄，讓學生從實地走訪中汲取創作養分，導入設計專案的製作與執行。 ■ 上一屆成果落地為 AR 導覽 回顧過往，動遊系赴日實習計畫成果豐碩。上一屆實習生與日本當地大學生共同製作的角色設計，已成功應用於日本愛媛縣砥部町的 AR 角色導覽活動「まるっとARスタンプラリー」，參與學生的姓名亦公開於官方活動網站，獲得日方企業與地方政府的高度肯定。 計畫主持人張純雅老師表示，這不僅是一次專業實習，更是一場跨文化、跨領域的深度體驗，期許學生在拓展國際視野的同時，為未來職涯奠定重要基礎。動遊系鄧樹遠主任也指出，系上長期重視學生的國際實務歷練，未來將持續拓展合作平台，讓學生走向世界、學用合一，持續支持國際實習專案，培育具備全球競爭力的創意人才。":`[Kaohsiung News] The international internship collaboration between the Department of Animation and Game Design (AGD) at Shu-Te University and the renowned Japanese animation and game production company hautecouture Inc. (オートクチュール株式会社, HC) has entered its 9th year. This year, both parties joined hands again to implement the Ministry of Education's "Building Dreams Overseas" (學海築夢) overseas internship program, launching an internship of nearly 3 months to substantially strengthen students' professional skills and international vision.

This project was co-planned and executed by AGD International Team members Zhang Chun-ya (張純雅) and Yin Li (尹立). Based on the department's rigorous overseas internship selection mechanism, students had to pass multiple stages including training, selection, written review, preliminary tests, and Japanese interviews, as well as an all-Japanese online interview with HC. This year, a total of 4 outstanding students were admitted, including 3 students from Taiwan (Wang Yun-shu (王韻淑), Xia Yu-xin (夏妤馨), Xiao Pei-lun (蕭培綸)) and 1 student from Macau (Lai Jian-hao (賴健豪)). During the internship, they directly engaged in HC's animation and game projects, learning the industry's latest design technologies and team collaboration models.

■ From Welcome Ceremony to Project Frontlines

Project director Zhang Chun-ya (張純雅) personally led the team to Matsuyama City, Ehime Prefecture, Japan, assisting students in settling into rental housing and handling commuting cards and other living essentials to help them quickly integrate into the local community. On the 1st day of the internship, HC held a warm welcome ceremony for the students; students then attended the company morning meeting, introducing themselves in online meetings with HC executives and branch members. During the meeting, the company assigned internship tasks covering illustration design, character design, and game art painting, allowing students to enter real industry production processes and gain valuable practical experience.

■ Transnational Cultural Sharing × Regional Revitalization Experience

In addition to technical skills, this year's internship greatly deepened cultural exchanges. During the corporate internship, students actively shared the cultural characteristics of Taiwan and Macau in exchange meetings, conducting enthusiastic two-way discussions with Japanese colleagues and demonstrating youthful vitality and professional confidence in cross-border cooperation. Furthermore, Zhang Chun-ya (張純雅) specifically led the internship team to Seiyo City, Ehime Prefecture, visiting the Uwa Predecessors Memorial Museum (宇和先哲記念館) and engaging in in-depth cultural dialogue with Mr. Matsumoto and Mr. Yamamoto of the Seiyo City Tourism and Local Products Association (西予市觀光物產協會) and Mr. Utsunomiya of the Economic Promotion Division of the Industry Department (產業部經濟振興課), exchanging experiences in local tourism and cultural promotion between Taiwan and Japan. The internship team also visited Tobe Town to conduct cultural filming and video documentation on its highly representative traditional craft "Tobe Ware" (砥部燒), allowing students to draw creative nourishment from fieldwork and incorporate it into design projects.

■ Previous Session's Results Landed as AR Guide

Looking back, AGD's Japan internship program has yielded fruitful results. Character designs co-produced by the previous batch of interns and local Japanese university students were successfully applied to the AR character tour event "Marutto AR Stamp Rally" (まるっとARスタンプラリー) in Tobe Town, Ehime Prefecture, Japan. The participating students' names were also publicly displayed on the official event website, receiving high praise from Japanese enterprises and local government.

Project director Zhang Chun-ya (張純雅) remarked that this is not only a professional internship, but also an in-depth cross-cultural and cross-disciplinary experience, hoping students lay a solid foundation for their future careers while broadening their international perspectives. AGD Chair Deng Shu-yuan (鄧樹遠) also noted that the department has long valued students' international practical experience, and will continue to expand cooperation platforms, enabling students to step onto the world stage, unite learning with application, continually support international internship projects, and cultivate creative talents with global competitiveness.`,"赴日實習現場紀實 · 松山 × 西予 × 砥部町":"Field Record of Japan Internship · Matsuyama × Seiyo × Tobe Town","日本愛媛縣砥部町 AR 角色導覽活動「まるっとARスタンプラリー」活動影片":'Event Video of Tobe Town AR Character Tour Event "Marutto AR Stamp Rally" (まるっとARスタンプラリー) in Ehime Prefecture, Japan',"動遊系畢製《Dear, All Robots》躍上國際媒體 · CommonWealth English 與換日線專文報導":"AGD Graduation Project Dear, All Robots (《Dear, All Robots》) Hits International Media · Featured by CommonWealth English and Crossing","陳美蓉老師指導的印尼學生團隊，以畢業動畫短片《Dear, All Robots》參與 2026 青春設計節，獲《CommonWealth English》與《換日線 Crossing》專文報導。":"Advised by Chen Mei-rong (陳美蓉), an Indonesian student team participated in the 2026 Youth Innovative Design Festival (青春設計節) with their graduation animated short Dear, All Robots (《Dear, All Robots》), receiving dedicated feature reports from CommonWealth English and Crossing (《換日線 Crossing》).","【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）的創作能量再度獲得國際媒體肯定。由陳美蓉老師指導的印尼學生動畫團隊，以五分鐘畢業動畫短片《Dear, All Robots》參與 2026 青春設計節展出，近日獲國際英文媒體《CommonWealth English》及中文媒體《換日線 Crossing》專文報導，展現本系在動畫敘事、視覺風格與跨文化創作上的教學成果。 《Dear, All Robots》是一部於台灣完成製作的短篇動畫，描述一位在工作壓力與重複生活中逐漸失去色彩、彷彿成為「機器人」的上班族，因一隻帶有色彩的獨眼小貓闖入生命，而重新找回情感與作為「人」的溫度。作品以黑白色調與回憶中鮮明色彩的對比，呈現青年世代在理想、就業與現實壓力間拉扯的共同焦慮。 主創者之一 Ryan Evan Limawi 表示，許多年輕人畢業後未必能立即找到理想工作，可能在日復一日中失去熱情；團隊希望傳遞的訊息是：即使第一份工作不符合夢想，只要持續嘗試與探索，未來仍有機會找到真正適合自己的方向。 ■ 從製作到展場推廣 展出期間除播放動畫短片外，團隊也同步展示角色模型、海報、設定集、貼紙、鑰匙圈、小貓玩偶及 LINE 貼圖等延伸設計，並邀請觀眾寫下觀影心得，完整呈現學生從動畫製作、角色經營到品牌推廣與觀眾互動的整合能力。 陳美蓉老師指出，動畫創作最重要的核心包括分鏡腳本、故事內容與視覺風格，而本團隊成功整合三者，展現成熟的敘事與創作能力。參與的印尼學生團隊也分享，台灣良好的中文學習與動畫創作環境，以及高雄對創作者友善的氛圍，是支援他們完成作品的重要力量。 動遊系表示，本片獲國際與中文媒體關注，反映本系長期深耕跨文化學習、專題製作、動畫敘事、角色設計與整合行銷的教學成果；未來將持續培育兼具技術能力、人文關懷與市場溝通力的動畫與遊戲設計人才。":`[Kaohsiung News] The creative energy of the Department of Animation and Game Design (AGD) at Shu-Te University has once again received recognition from international media. Advised by Chen Mei-rong (陳美蓉), an Indonesian student animation team exhibited their 5-minute graduation animated short Dear, All Robots (《Dear, All Robots》) at the 2026 Youth Innovative Design Festival (青春設計節), recently receiving dedicated feature reports from international English media CommonWealth English and Chinese media Crossing (《換日線 Crossing》), demonstrating the department's educational outcomes in animation narrative, visual style, and cross-cultural creation.

Dear, All Robots (《Dear, All Robots》) is a short animation completed in Taiwan, depicting an office worker who gradually loses color and feels like a "robot" under work pressure and repetitive routines, but regains emotion and human warmth after a colorful one-eyed kitten enters his life. Through the contrast between black-and-white tones and vibrant colors in memory, the work reflects the shared anxiety of the young generation torn between ideals, employment, and realistic pressures.

One of the main creators, Ryan Evan Limawi, stated that many young people may not immediately find their ideal job after graduation and might lose enthusiasm in daily routine; the team hopes to convey the message that even if the 1st job does not match one's dreams, as long as one continues trying and exploring, there will still be opportunities to find a truly suitable direction in the future.

■ From Production to Exhibition Promotion

During the exhibition, in addition to screening the animated short, the team also synchronously displayed character models, posters, setting artbooks, stickers, keychains, kitten plushies, and LINE stickers, inviting audiences to write down their viewing reflections, fully demonstrating students' integrated abilities from animation production and character management to brand promotion and audience interaction.

Teacher Chen Mei-rong (陳美蓉) pointed out that the most important core of animation creation includes storyboards, story content, and visual styles, and this team successfully integrated all 3 elements, demonstrating mature narrative and creative capabilities. The participating Indonesian student team also shared that Taiwan's favorable Chinese learning and animation creation environment, along with Kaohsiung's creator-friendly atmosphere, were essential forces supporting them in completing their work.

AGD expressed that the attention received by this film from international and Chinese media reflects the department's long-standing educational achievements in cross-cultural learning, capstone project production, animation narrative, character design, and integrated marketing; the department will continue cultivating animation and game design talents equipped with technical skills, humanistic care, and market communication capability.`,"換日線 Crossing：剛畢業就變成了機器人？印尼留學生在高雄用 5 分鐘動畫，拍出亞洲年輕人生存焦慮（2026-06-11）":"Crossing (《換日線 Crossing》): Turned into Robots Right After Graduation? Indonesian Students in Kaohsiung Capture Asian Youth's Existential Anxiety with a 5-Minute Animation (2026-06-11)",入圍:"Shortlisted","動遊系 2026 競賽佳績榜 · 14 件入圍 7 部畢業專題上榜":"AGD 2026 Competition Honors List · 14 Nominations with 7 Graduation Projects on the Board","全國技專專題、青春設計節、放視大賞、金點新秀 — 4 大競賽 14 件入圍，7 部畢業專題作品榮耀上榜。":"National University Practical Projects, Youth Innovative Design Festival, Vision Get Wild, Young Pin Design Award — 14 nominations across 4 major competitions, with 7 graduation projects honorably listed.","【高雄訊】樹德科技大學動畫與遊戲設計系 2026 年度競賽傳出佳績，旗下 7 部畢業專題作品於 4 大全國指標競賽合計拿下 14 件入圍。本年度入圍實力涵蓋遊戲、動畫、創意數位影片、數位影像設計等多元類別。 ■ 4 大競賽入圍榜 ● 教育部「2026 全國技專校院學生實務專題製作競賽暨成果展」（National）— 入圍 1 件 《癒光之音：悅曲》動漫互動多媒體群 / 002 ● 駁二藝術特區「2026 青春設計節創意設計競賽」初選（Cultural）— 入圍 4 件 《癒光之音：悅曲》遊戲設計 / 323 《葛柏 TV 秀》遊戲設計 / 569 《Dear, All Robots》創意數位影片 / 115 《競箱團》創意數位影片 / 142 ● 高雄展覽館「2026 放視大賞」複選（Industry）— 入圍 7 件 《喀嚓》、《癒光之音：悅曲》、《葛柏 TV 秀》、《今食堂》— 遊戲類 《冤枉汪》、《競箱團》、《Dear, All Robots》— 動畫類 ● 台灣設計研究院「2026 金點新秀設計獎」（Premier）— 入圍 2 件 《競箱團》數位影像設計類 《癒光之音：悅曲》贊助特別獎 · 數位互動 ■ 入圍 7 部畢業專題作品（指導老師 / 主創團隊） 1. 《癒光之音：悅曲》遊戲組｜張亦非老師指導｜簡敬儒、林維仁、葉賜宏、李嘉楡、何政哲 2. 《競箱團》動畫組｜江雅媚老師指導｜林祐嬋、陳姵妏、吳柏邵、沈宗賢、王妤宸 3. 《葛柏 TV 秀》遊戲組｜陳慧萍老師指導｜張喻晴、洪韻涵 4. 《Dear, All Robots》動畫組｜陳美蓉老師指導｜王愛吉、黃承義、梁潔美、林巧玲、馬聖淞 5. 《喀嚓》遊戲組｜鄧樹遠老師指導｜吳立凡、張自祥、陶延娣、鄭羽軒 6. 《今食堂》遊戲組｜鄧樹遠老師指導｜許瑗玶、高樂怡、陳書凱、黎躒嬈 7. 《冤枉汪》動畫組｜邱士展老師指導｜林弈志、廖芳彣 下方為 7 部入圍作品專輯。":`[Kaohsiung News] The Department of Animation and Game Design at Shu-Te U Below is the album of 7 shortlisted works.`,"癒光之音：悅曲":"Soothing Sounds: The Enchanting Music (《癒光之音：悅曲》)","Game Design · 遊戲組":"Game Design · Game Group",張亦非:"Zhang Yi-fei (張亦非)","簡敬儒 · 林維仁 · 葉賜宏 · 李嘉楡 · 何政哲":"Jian Jing-ru (簡敬儒) · Lin Wei-ren (林維仁) · Ye Ci-hong (葉賜宏) · Li Jia-yu (李嘉楡) · He Zheng-zhe (何政哲)","以音樂節奏為核心的第三人稱戰鬥冒險遊戲。創新整合 MIDI 鍵盤作為實體鋼琴互動介面，將演奏力道與觸鍵手感直接轉化為遊戲內的視聽回饋與戰鬥動能。玩家化身穿梭奇幻大地的「環境音樂治療師」，融合凱爾特神話世界觀與美式圖像小說質感的非寫實渲染。":'A third-person combat adventure game centered on musical rhythm. Innovatively integrating a MIDI keyboard as a physical piano interactive interface, transforming performance intensity and keystroke tactile feel directly into in-game audio-visual feedback and combat momentum. Players embody an "environmental music therapist" traversing a fantasy land, blending a Celtic mythological worldview with non-photorealistic rendering possessing an American graphic novel texture.',全國技專專題:"National University Practical Projects (全國技專專題)",青春設計節:"Youth Innovative Design Festival (青春設計節)",放視大賞:"Vision Get Wild (放視大賞)",金點新秀贊助特別獎:"Young Pin Design Award Sponsored Special Award (金點新秀贊助特別獎)",競箱團:"The Box Hustle (《競箱團》)","Animation · 動畫組":"Animation · Animation Group","林祐嬋 · 陳姵妏 · 吳柏邵 · 沈宗賢 · 王妤宸":"Lin You-chan (林祐嬋) · Chen Pei-wen (陳姵妏) · Wu Bo-shao (吳柏邵) · Shen Zong-xian (沈宗賢) · Wang Yu-chen (王妤宸)","一對兄妹幫阿嬤簽收快遞，好奇心驅使下偷拆送錯包裹引來黑道追捕。黑道偽裝成輪椅老人在街道展開追逐。採用 2D 逐幀手繪動畫，以喜劇與誇張反差節奏（黑道老人、輪椅追逐）打破現實邏輯，在荒誕情節中構築強烈視覺張力。":"A brother and sister sign for a parcel on behalf of their grandmother, and driven by curiosity, mistakenly open a wrong delivery that draws pursuit from gangsters. The gangsters disguise themselves as an elderly person in a wheelchair, launching a chase across the streets. Using 2D frame-by-frame hand-drawn animation with comedy and exaggerated contrasting rhythm (gangster elderly, wheelchair chase) to shatter realistic logic, constructing strong visual tension within an absurd plot.",金點新秀數位影像:"Young Pin Design Award Digital Video (金點新秀數位影像)","葛柏 TV 秀":"Garble TV Show (《葛柏 TV 秀》)",陳慧萍:"Chen Hui-ping (陳慧萍)","張喻晴 · 洪韻涵":"Zhang Yu-qing (張喻晴) · Hong Yun-han (洪韻涵)","扮演被賦予試播期的節目主持人「葛柏」，必須在四週內製造能吸引眼球的節目秀。每天於城市地圖中追蹤來賓，透過偷拍與觀察取得畫面，為事件挑選不同風格標題。每個選擇都會改變來賓命運與你的節目未來，反思媒體標題包裝對大眾理解事件的影響。":`Play as show host "Garble" endowed with a trial broadcast period, who must create an eye-catching show within 4 weeks. Daily tracking guests on the city map, capturing footage through candid filming and observation, selecting headlines of different styles for events. Every choice alters the guests' destiny and your show's future, reflecting on the impact of media headline packaging on public understanding of events.`,"王愛吉 · 黃承義 · 梁潔美 · 林巧玲 · 馬聖淞":"Wang Ai-ji (王愛吉) · Huang Cheng-yi (黃承義) · Liang Jie-mei (梁潔美) · Lin Qiao-ling (林巧玲) · Ma Sheng-song (馬聖淞)","結合 2D 與 3D 的動畫短片，講述找回熱情與自我的故事。主角是過著重複單調生活的上班族，漸漸忘記兒時對攝影的熱愛。某天遇見一隻彩色的貓，重新喚醒他的創意與熱情。透過黑白與鮮豔色彩的對比、2D 角色與 3D 場景的融合，呈現主角從麻木到自我重生的歷程。":"An animated short film combining 2D and 3D, telling a story of regaining passion and self. The protagonist is an office worker living a repetitive and monotonous life, gradually forgetting his childhood love for photography. One day, meeting a colorful cat rekindles his creativity and passion. Through the contrast of black-and-white with vivid colors, and the fusion of 2D characters with 3D scenes, it depicts the protagonist's journey from numbness to self-rebirth.",喀嚓:"Kacha (《喀嚓》)","吳立凡 · 張自祥 · 陶延娣 · 鄭羽軒":"Wu Li-fan (吳立凡) · Zhang Zi-xiang (張自祥) · Tao Yan-di (陶延娣) · Zheng Yu-xuan (鄭羽軒)","以「相機拍攝」為核心機制的 2.5D 探索遊戲，採用《CARTO》與《TOEM》風格作為設計基底。世界因魔素長期污染而凋零，主角佛特．夏普在拍攝廢棄區域時意外將瀕死魔物的靈魂拍入相機，化身名為「喀嚓」的搭檔。透過拍照觀察、戰鬥取材、合成道具的循環，建立以「觀看」取代直覺操作的遊戲節奏。":'A 2.5D exploration game centered on the core mechanism of "camera photography," using CARTO and TOEM styles as its design foundation. The world has withered due to long-term mana pollution; while photographing abandoned areas, protagonist Fort Sharp accidentally captures the soul of a dying monster into his camera, turning it into a partner named "Kacha." Through a loop of photographing observation, combat material acquisition, and item synthesis, it establishes a game pace that replaces intuitive operations with "viewing."',"Facebook 專頁":"Facebook Fan Page",今食堂:"Today Restaurant (《今食堂》)","許瑗玶 · 高樂怡 · 陳書凱 · 黎躒嬈":"Xu Yuan-ping (許瑗玶) · Gao Le-yi (高樂怡) · Chen Shu-kai (陳書凱) · Li Le-rao (黎躒嬈)","主角伯返家從弟弟雷處得知城鎮的異常現象似乎與一家餐廳有關，主廚正巧失蹤。他暫時接手餐館，發現某些料理能緩解居民的異常狀況——同樣的力量也能用來操控引導他人意志。受「汙染」的怪物原本是普通生物或食材，對玩家而言既可能是敵人也可能是「處理」後的食物。對「信仰」「責任」與「使用力量的界線」的提問。":`Protagonist Bo returns home and learns from his younger brother Ray that the town's abnormal phenomena seem related to a restaurant, whose head chef has coincidentally gone missing. Taking over the restaurant temporarily, he discovers that certain dishes can alleviate residents' abnormal conditions — yet the same power can also be used to manipulate and guide others' will. Monsters affected by "pollution" were originally ordinary creatures or ingredients, serving to the player as either enemies or "processed" food. Questioning "faith," "responsibility," and the "boundaries of using power."`,冤枉汪:"Yuan Wang Wang (《冤枉汪》)","林弈志 · 廖芳彣":"Lin Yi-zhi (林弈志) · Liao Fang-wen (廖芳彣)","一如往常的早晨，忘記戴帽子的主人留下小狗看家準備出門上班。一隻闖入屋內的野貓叼起主人遺落的帽子，為了奪回帽子，小狗與野貓開啟一場客廳追逐戰，把房間搞得雞飛狗跳。以簡潔幾何線條結合色塊上色、流暢動態為特色的 2D 手繪純娛樂喜劇短片。":"On an ordinary morning, an owner who forgot his hat leaves his little dog home to watch the house before heading to work. A stray cat trespassing into the house snatches the owner's left-behind hat; to reclaim it, dog and stray cat ignite a living room chase, turning the room upside down. A 2D hand-drawn pure entertainment comedy short featuring simple geometric lines combined with color-block coloring and fluid motion.","四部學生動畫橫掃國際影展 · 21+ 入圍 · 歐美亞澳四大洲":"Four Student Animations Sweep International Film Festivals · 21+ Selections · Across 4 Continents of Europe, America, Asia, and Australia","《失竊的祕方》《癡迷的現實》《人造人》《神癒》登上多國影展競賽單元 — 義大利怪誕影展叛逆視野榮譽獎、西班牙愛情影展最佳奇幻類等獎項相繼到手。":"The Stolen Recipe (《失竊的祕方》), Obsessive Reality (《癡迷的現實》), Zephyranthes (《人造人》), and Holy Algorithm (《神癒》) enter international competition sections — winning the Rebel Vision Honorary Award at the Bizarre Film Festival in Italy, Best Fantastic at the Love Film Festival in Spain, and other awards.","動遊系四部學生動畫短片在過去一年陸續登上國際影展，合計入圍、獲獎 21 項以上，足跡跨歐、美、亞、澳四大洲。 ■ 概況 • 4 部作品｜21+ 入圍／獲獎 • 觸及國家：西班牙、義大利、土耳其、美國、印度、澳洲 • 指導老師：陳美蓉、陳慶鴻 以下是四部作品介紹。":`Four student animated short films from AGD have sequentially entered international film festivals over the past year, accumulating more than 21 selections and awards across 4 continents: Europe, America, Asia, and Australia.

Below are introductions to the four works.`,"4 部走向國際的學生短片":"4 Student Short Films Going International",失竊的祕方:"The Stolen Recipe (《失竊的祕方》)","涂承恩 · 李冠霖 · 張淑盈 · 唐莉蓉":"Tu Cheng-en (涂承恩) · Li Guan-lin (李冠霖) · Zhang Shu-ying (張淑盈) · Tang Li-rong (唐莉蓉)","以「誤解與和解」為主題的 2D 動畫短片，融合性別平等、減少不平等及和平正義等核心 SDGs 議題。本年度於西、義、巴塞隆納等多國影展競賽單元連連入圍，並於義大利「怪誕影展」獲『叛逆視野榮譽獎』。":`A 2D animated short film themed on "misunderstanding and reconciliation," integrating core SDGs issues such as gender equality, reduced inequalities, and peace and justice. This year, it has garnered consecutive selections in competition sections across Spain, Italy, Barcelona, and other countries, winning the "Rebel Vision Award" at Italy's Bizarre Film Festival (怪誕影展).`,"義大利怪誕影展 · 叛逆視野獎 ★":"Italy Bizarre Film Festival · Rebel Vision Award ★","巴塞隆納 Author Film Festival 決賽":"Barcelona Author Film Festival Finalist","西班牙國際人權短片影展 入圍放映":"Spain International Human Rights Short Film Festival Screening","義大利 Rome Prisma Independent Film Awards 入圍":"Italy Rome Prisma Independent Film Awards Official Selection","以 1980 年代懷舊美術風格呈現偶像崇拜與理性認知的衝突，融入 SDG 4「優質教育」與 SDG 12「負責任消費與生產」。橫跨西、美、土、印共 8 個國際影展。":'Presenting the conflict between idol worship and rational cognition in a 1980s nostalgic art style, integrating SDG 4 "Quality Education" and SDG 12 "Responsible Consumption and Production." Spanning 8 international film festivals across Spain, USA, Turkey, and India.',人造人:"Zephyranthes (《人造人》)","博浩原 · 李育賢 · 戎軒頤 · 陳政名":"Bo Hao-yuan (博浩原) · Li Yu-xian (李育賢) · Rong Xuan-yi (戎軒頤) · Chen Zheng-ming (陳政名)","以人造智慧生命為主題，透過懸念與詩意描繪人性掙扎，呼應 SDG 16「和平、正義及健全制度」。足跡踏遍印度、巴塞隆納、西班牙、澳洲。":'Themed on artificial intelligent life, depicting human struggles through suspense and poetry, echoing SDG 16 "Peace, Justice and Strong Institutions." Footsteps spanning India, Barcelona, Spain, and Australia.',"印度孟買國際影片獎 · Animated Short 入圍":"India Mumbai International Film Awards · Animated Short Official Selection","印度孟買國際影片獎 · 入圍放映":"India Mumbai International Film Award Responsible Instructor: Jiang Ya-mei (江雅媚), ext. 6109, Email: cym68@stu.edu.tw`,活動:"Events","樹德科大動遊系 2026 Open Day 引導學員體驗動畫與遊戲設計學習現場":"Shu-Te University AGD 2026 Open Day Guides Participants to Experience the Learning Scene of Animation and Game Design","Open Day 以「真實體驗大學學習」為核心，五門核心課程＋桌遊互動＋校園走讀＋分組實作。":'Open Day centers on "Truly Experiencing University Learning," featuring 5 core courses + board game interaction + campus tour + group hands-on practice.',"【高雄訊】樹德科技大學動畫與遊戲設計系（動遊系）於寒假期間舉辦「2026 Open Day — 你想怎樣＠你的大學」體驗活動，吸引眾多對動畫、漫畫與遊戲設計充滿熱情的學生與家長踴躍參與。 活動以「真實體驗大學學習」為核心，透過五門核心課程、桌遊互動、校園走讀、咖啡廳美食交流與分組實作，讓學員們認識動畫與遊戲設計系的學習特色，也探索自身未來的學習方向。 本次 Open Day 是一場融合「溫度、溫馨與體感」的學習聚會，由十位專業師資攜手數位學姐繪師與設計師共同規劃，打造充滿關懷與創作能量的體驗場域。 學員票選出五門核心課程進行深度體驗，包括《遊戲介面設計（UI/UX）》、《漫畫美學》、《3D 列印應用實務》、《動畫與遊戲人物周邊設計製作》以及《動畫美學研究》。下午場次依學員興趣分組實作，包括「動手體驗角色周邊設計」與「與學長姐繪師共同創作」。 系主任鄧樹遠表示：「隨著 AI 與生成式技術快速進入創作現場，創作方式雖不斷演變，但創作的核心仍來自創作者的觀察、感受與判斷。」":`[Kaohsiung News] During the winter vacation, the Department of Animation and Game Design (AGD) at Shu-Te University held the "2026 Open Day — What Do You Want @ Your University" experience event, attracting enthusiastic participation from many students and parents passionate about animation, comics, and game design.

Centering on "Truly Experiencing University Learning," the event featured 5 core courses, board game interactions, campus tours, cafe culinary exchanges, and group practical workshops, allowing participants to understand the learning features of AGD and explore their future learning directions.

This Open Day was a learning gathering blending "warmth, friendliness, and tactile experience," jointly planned by 10 professional faculty members and several senior student illustrators and designers, creating an experiential space full of care and creative energy.

Participants voted on 5 core courses for in-depth experiences, including Game Interface Design (UI/UX) (《遊戲介面設計（UI/UX）》), Comic Aesthetics (《漫畫美學》), 3D Printing Practical Applications (《3D 列印應用實務》), Animation and Game Character Merchandise Design and Production (《動畫與遊戲人物周邊設計製作》), and Animation Aesthetics Research (《動畫美學研究》). The afternoon session featured hands-on workshops grouped by participants' interests, including "Hands-on Experience in Character Merchandise Design" and "Co-creating with Senior Student Illustrators."

Department Chair Deng Shu-yuan (鄧樹遠) stated: "As AI and generative technologies rapidly enter the creative scene, although creative methods continue to evolve, the core of creation still comes from the creator's observation, feelings, and judgment."`,"114 學年度第 1 學期學生「Unity 證照輔導班」":'AY 114 Semester 1 (Fall Semester) Student "Unity Certification Tutoring Class"',"Unity Certified User (UCU) 國際認證 · 11/29-11/30 · D0625 · Programmer 第二張證照。":"Unity Certification User (UCU) International Certification · 11/29-11/30 · Room D0625 · Programmer 2nd certification.","一、開課名稱：「Unity Certified User (UCU) 國際認證」 二、上課日期：114/11/29(六)、114/11/30(日) 三、證照考試：114/11/30(日) 四、上課地點：D0625 教室 五、招生名額：20 人。 六、考試科目：Programmer (以 C# 為程式語言，此為 Unity 第二張證照) 主辦單位：動畫與遊戲設計系 協辦單位：研究發展處職涯發展暨校友服務中心 負責老師：楊智彰老師，分機 6112，Email: chzzyang@stu.edu.tw":`1. Course Name: "Unity Certification User (UCU) International Certification"
