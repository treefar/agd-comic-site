<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>六樓出口</title>
<style>
  :root {
    --bg: #07090a; --ink: #e8ece9; --dim: #8a948e; --accent: #34d27a; --danger: #e5484d;
    --card: #f4f1e8; --cardink: #1d1d1b; --ctrl-h: 76px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; overflow: hidden; }
  #app { position: relative; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }

  /* 實拍畫面固定 16:9，整張都看得到（異常可能在畫面邊緣） */
  .stage { position: relative; width: min(100vw, calc((100dvh - var(--ctrl-h) - 96px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .22s; transform-origin: 50% 55%; }
  .stage img.on { opacity: 1; }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.06); } }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
  .ov { position: absolute; transform: translate(-50%, -50%); padding: 4px 8px; font-size: clamp(10px, 2.2vw, 15px); font-weight: 800; text-align: center; white-space: nowrap; pointer-events: none; }
  .ov.sign { background: #f4f0e2; color: #8b0f12; font-size: clamp(12px, 3vw, 22px); padding: 6px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .ov.ph { background: rgba(255, 214, 10, .9); color: #2a2100; border: 2px dashed #2a2100; }
  .ov small { display: block; font-size: .7em; font-weight: 600; opacity: .75; }

  .hud { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .floorNo { font: 900 clamp(20px, 5vw, 34px)/1 ui-monospace, monospace; color: var(--accent); text-shadow: 0 0 10px #000, 0 0 10px var(--accent); }
  .where { font-size: 12px; padding: 3px 8px; background: rgba(0,0,0,.55); border-radius: 6px; }
  .dbg { position: absolute; left: 10px; bottom: 8px; font: 11px ui-monospace, monospace; color: #ff0; background: rgba(0,0,0,.6); padding: 2px 6px; }

  .below { width: min(100vw, 900px); padding: 10px 12px 0; min-height: 96px; }
  .tip { padding: 10px 12px; background: #111614; border-left: 3px solid var(--accent); font-size: 14px; line-height: 1.55; }
  .rotate { margin-top: 6px; font-size: 12px; color: var(--dim); text-align: center; }
  @media (orientation: landscape) { .rotate { display: none; } }
  .controls { width: min(100vw, 900px); height: var(--ctrl-h); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); }
  button { font: inherit; border: 0; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .btnBack { background: #2b1718; color: #ffb4b6; }
  .btnFwd  { background: #13281c; color: #a6f0c6; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 3; }
  .hidden { display: none !important; }
  .start { background: radial-gradient(circle at 50% 40%, #16201a, var(--bg) 70%); gap: 14px; }
  .start h1 { margin: 0; font-size: 40px; letter-spacing: .1em; }
  .start p { margin: 0; color: var(--dim); line-height: 1.6; font-size: 14px; }
  .go { background: var(--accent); color: #06130b; padding: 14px 36px; }
  .flash { background: #000; animation: fade 900ms ease forwards; pointer-events: none; z-index: 4; }
  .flash.red { background: #3a0003; }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 420px); background: var(--card); color: var(--cardink); border-radius: 14px; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.6); z-index: 5; }
  .card small { color: #7a6f55; letter-spacing: .1em; }
  .card h2 { margin: 6px 0 8px; font-size: 22px; }
  .card p { margin: 0 0 14px; line-height: 1.6; }
  .card button { width: 100%; padding: 12px; background: var(--cardink); color: var(--card); }
  .sub { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(92vw, 520px); padding: 10px 14px; background: #fff7d6; color: #3b2a00; border-radius: 12px; font-size: 15px; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 6; }
  .sub b { display: block; font-size: 12px; color: #a0740a; }
  .ending { background: var(--bg); gap: 12px; overflow-y: auto; justify-content: flex-start; padding-top: 40px; }
  .ending h1 { margin: 0; color: var(--accent); }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; width: min(100%, 720px); }
  .dex div { padding: 8px; border-radius: 8px; background: #151a17; font-size: 13px; text-align: left; }
  .dex .no { color: #444; }
  /* 手機橫放：影片佔滿高度，說明與按鈕疊在畫面下緣 */
  @media (orientation: landscape) and (max-height: 520px) {
    .stage { width: min(100vw, calc(100dvh * 16 / 9)); }
    .below { position: absolute; left: 50%; transform: translateX(-50%); bottom: 58px; width: min(92vw, 640px); min-height: 0; padding: 0; z-index: 2; }
    .tip { background: rgba(0,0,0,.72); font-size: 13px; padding: 6px 10px; }
    .controls { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 54px; padding: 6px 12px max(6px, env(safe-area-inset-bottom)); z-index: 2; }
    .controls button { background-color: rgba(20, 20, 20, .7); }
    .btnBack { color: #ffb4b6; } .btnFwd { color: #a6f0c6; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <img id="imgA" alt=""><img id="imgB" alt="">
    <div class="vignette"></div>
    <div id="ovs"></div>
    <div class="hud"><div class="floorNo" id="floorNo">0F</div><div class="where" id="where"></div></div>
    <div class="dbg hidden" id="dbg"></div>
  </div>
  <div class="below">
    <div class="tip hidden" id="tip"></div>
    <div class="rotate">手機橫放，畫面更大</div>
  </div>
  <div class="controls">
    <button class="btnBack" id="btnBack" aria-label="回頭（鍵盤 ← 或 ↓）">↩ 回頭</button>
    <button class="btnFwd" id="btnFwd" aria-label="往前（鍵盤 → 或 ↑）">往前 ↑</button>
  </div>

  <div class="sub hidden" id="sub"></div>
  <div class="card hidden" id="card"><small id="cardTag"></small><h2 id="cardTitle"></h2><p id="cardText"></p><button id="cardOk">繼續走</button></div>

  <div class="layer start" id="start">
    <h1>六樓出口</h1>
    <p>你在設計大樓六樓醒來。<br>走廊會一直循環。<br>覺得哪裡不對勁，就回頭。<br>沒有異常，就往前走。<br>連續走對 6 圈，才能離開六樓。</p>
    <button class="go" id="go">進入六樓</button>
    <p style="font-size:12px">畫面依設計大樓六樓實拍，以 Codex 生圖重繪成漫畫風。<br>系主任語音尚未錄製，先以字幕代替。</p>
  </div>
  <div class="layer ending hidden" id="ending"></div>
</div>

<script src="game.js"></script>
</body>
</html>
