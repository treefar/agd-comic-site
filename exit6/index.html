<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>六樓出口（實拍原型）</title>
<style>
  :root {
    --bg: #07090a; --ink: #e8ece9; --dim: #8a948e; --accent: #34d27a; --danger: #e5484d;
    --card: #f4f1e8; --cardink: #1d1d1b; --ctrl-h: 76px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; overflow: hidden; }
  #app { position: relative; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }

  /* 實拍畫面固定 16:9，整張都看得到（異常可能在畫面邊緣） */
  .stage { position: relative; width: min(100vw, calc((100dvh - var(--ctrl-h) - 96px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage video { opacity: 0; transition: opacity .15s; }
  .stage.playing video { opacity: 1; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
  .ov { position: absolute; transform: translate(-50%, -50%); padding: 4px 8px; font-size: clamp(10px, 2.2vw, 15px); font-weight: 800; text-align: center; white-space: nowrap; pointer-events: none; }
  .ov.sign { background: #f4f0e2; color: #8b0f12; font-size: clamp(12px, 3vw, 22px); padding: 6px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .ov.ph { background: rgba(255, 214, 10, .9); color: #2a2100; border: 2px dashed #2a2100; }
  .ov small { display: block; font-size: .7em; font-weight: 600; opacity: .75; }
  .stage.playing .ov { display: none; }

  .hud { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .floorNo { font: 900 clamp(20px, 5vw, 34px)/1 ui-monospace, monospace; color: var(--accent); text-shadow: 0 0 10px #000, 0 0 10px var(--accent); }
  .where { font-size: 12px; padding: 3px 8px; background: rgba(0,0,0,.55); border-radius: 6px; }
  .dbg { position: absolute; left: 10px; bottom: 8px; font: 11px ui-monospace, monospace; color: #ff0; background: rgba(0,0,0,.6); padding: 2px 6px; }

  .below { width: min(100vw, 900px); padding: 10px 12px 0; min-height: 96px; }
  .tip { padding: 10px 12px; background: #111614; border-left: 3px solid var(--accent); font-size: 14px; line-height: 1.55; }
  .rotate { margin-top: 6px; font-size: 12px; color: var(--dim); text-align: center; }
  @media (orientation: landscape) { .rotate { display: none; } }
  .controls { width: min(100vw, 900px); height: var(--ctrl-h); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); }
  button { font: inherit; border: 0; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .btnBack { background: #2b1718; color: #ffb4b6; }
  .btnFwd  { background: #13281c; color: #a6f0c6; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 3; }
  .hidden { display: none !important; }
  .start { background: radial-gradient(circle at 50% 40%, #16201a, var(--bg) 70%); gap: 14px; }
  .start h1 { margin: 0; font-size: 40px; letter-spacing: .1em; }
  .start p { margin: 0; color: var(--dim); line-height: 1.6; font-size: 14px; }
  .go { background: var(--accent); color: #06130b; padding: 14px 36px; }
  .flash { background: #000; animation: fade 900ms ease forwards; pointer-events: none; z-index: 4; }
  .flash.red { background: #3a0003; }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 420px); background: var(--card); color: var(--cardink); border-radius: 14px; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.6); z-index: 5; }
  .card small { color: #7a6f55; letter-spacing: .1em; }
  .card h2 { margin: 6px 0 8px; font-size: 22px; }
  .card p { margin: 0 0 14px; line-height: 1.6; }
  .card button { width: 100%; padding: 12px; background: var(--cardink); color: var(--card); }
  .sub { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(92vw, 520px); padding: 10px 14px; background: #fff7d6; color: #3b2a00; border-radius: 12px; font-size: 15px; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 6; }
  .sub b { display: block; font-size: 12px; color: #a0740a; }
  .ending { background: var(--bg); gap: 12px; overflow-y: auto; justify-content: flex-start; padding-top: 40px; }
  .ending h1 { margin: 0; color: var(--accent); }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; width: min(100%, 720px); }
  .dex div { padding: 8px; border-radius: 8px; background: #151a17; font-size: 13px; text-align: left; }
  .dex .no { color: #444; }
  /* 手機橫放：影片佔滿高度，說明與按鈕疊在畫面下緣 */
  @media (orientation: landscape) and (max-height: 520px) {
    .stage { width: min(100vw, calc(100dvh * 16 / 9)); }
    .below { position: absolute; left: 50%; transform: translateX(-50%); bottom: 58px; width: min(92vw, 640px); min-height: 0; padding: 0; z-index: 2; }
    .tip { background: rgba(0,0,0,.72); font-size: 13px; padding: 6px 10px; }
    .controls { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 54px; padding: 6px 12px max(6px, env(safe-area-inset-bottom)); z-index: 2; }
    .controls button { background-color: rgba(20, 20, 20, .7); }
    .btnBack { color: #ffb4b6; } .btnFwd { color: #a6f0c6; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <img id="still" alt="">
    <video id="vid" muted playsinline preload="auto"></video>
    <div class="vignette"></div>
    <div id="ovs"></div>
    <div class="hud"><div class="floorNo" id="floorNo">0F</div><div class="where" id="where"></div></div>
    <div class="dbg hidden" id="dbg"></div>
  </div>
  <div class="below">
    <div class="tip hidden" id="tip"></div>
    <div class="rotate">手機橫放，畫面更大</div>
  </div>
  <div class="controls">
    <button class="btnBack" id="btnBack" aria-label="回頭（鍵盤 ← 或 ↓）">↩ 回頭</button>
    <button class="btnFwd" id="btnFwd" aria-label="往前（鍵盤 → 或 ↑）">往前 ↑</button>
  </div>

  <div class="sub hidden" id="sub"></div>
  <div class="card hidden" id="card"><small id="cardTag"></small><h2 id="cardTitle"></h2><p id="cardText"></p><button id="cardOk">繼續走</button></div>

  <div class="layer start" id="start">
    <h1>六樓出口</h1>
    <p>你在設計大樓六樓醒來。<br>走廊會一直循環。<br>覺得哪裡不對勁，就回頭。<br>沒有異常，就往前走。<br>連續走對 6 圈，才能離開六樓。</p>
    <button class="go" id="go">進入六樓</button>
    <p style="font-size:12px">原型：走廊是實拍；黃色虛線字卡是「異常佔位」，等補拍後換成實拍畫面。<br>系主任語音尚未錄製，先以字幕代替。</p>
  </div>
  <div class="layer ending hidden" id="ending"></div>
</div>

<script type="module">
import { createGame, step, anomalyAt, mulberry32 } from "./game-core.mjs";
import { STATIONS, ANOMALIES, VOICE_TEXT } from "./data.mjs";

const q = new URLSearchParams(location.search);
const seed = q.has("seed") ? Number(q.get("seed")) : (Date.now() & 0xffffffff);
const game = createGame(ANOMALIES, mulberry32(seed));
const $ = (id) => document.getElementById(id);
const vid = $("vid"), stage = $("stage");
let busy = false;     // 卡片開著或影片播放中，不接受操作

// 語音：檔案放 audio/<id>.m4a；還沒錄就只顯示字幕
const audio = {};
function preloadVoices() {
  for (const id of Object.keys(VOICE_TEXT)) {
    const a = new Audio(`audio/${id}.m4a`);
    a.preload = "auto";
    a.addEventListener("error", () => { audio[id] = null; });
    audio[id] = a;
  }
}
function say(id) {
  if (!id) return;
  const a = audio[id];
  if (a) a.play().catch(() => {});
  $("sub").innerHTML = `<b>系主任</b>${VOICE_TEXT[id]}`;
  $("sub").classList.remove("hidden");
  clearTimeout(say.t);
  say.t = setTimeout(() => $("sub").classList.add("hidden"), 5000);
}

// 預先抓下一站的片段進瀏覽器快取，走路時才不會卡
const fetched = new Set();
function prefetch(i) {
  const st = STATIONS[i % STATIONS.length];
  for (const u of [st.clip, st.still]) if (!fetched.has(u)) { fetched.add(u); fetch(u).catch(() => {}); }
}

function setButtons() {
  const off = busy || game.phase === "ending";
  $("btnBack").disabled = off; $("btnFwd").disabled = off;
}

// 停站：顯示最後一格＋佔位字卡＋導覽說明
function renderStop() {
  const st = STATIONS[game.station];
  const an = game.phase === "loop" ? anomalyAt(game, ANOMALIES) : null;
  $("still").src = an?.still || st.still;
  const ovs = [];
  if (st.sign && !st.signShot && !(an && an.replacesSign)) ovs.push(`<div class="ov sign" style="left:${st.sign.x}%;top:${st.sign.y}%">${st.sign.text}<small>告示佔位・補拍時現場貼</small></div>`);
  if (an && !an.clip) ovs.push(`<div class="ov ph" style="left:${an.placeholder.x}%;top:${an.placeholder.y}%">${an.placeholder.text}<small>異常佔位・待補拍</small></div>`);
  $("ovs").innerHTML = ovs.join("");
  $("floorNo").textContent = `${game.count}F`;
  $("where").textContent = game.phase === "tour" ? `導覽圈・${st.name}` : `第 ${game.lap} 圈・${st.name}`;
  const tip = $("tip");
  if (game.phase === "tour") { tip.textContent = st.tour; tip.classList.remove("hidden"); }
  else if (!tip.dataset.keep) tip.classList.add("hidden");
  delete tip.dataset.keep;
  if (q.has("debug")) { $("dbg").textContent = `seed ${seed}｜這圈異常：${game.anomaly ?? "無"}`; $("dbg").classList.remove("hidden"); }
  prefetch(game.station + 1);
}

// 走到目前這一站：播走路片段，播完停在最後一格
function walk() {
  const st = STATIONS[game.station];
  const an = game.phase === "loop" ? anomalyAt(game, ANOMALIES) : null;
  busy = true; setButtons();
  $("ovs").innerHTML = "";
  vid.src = an?.clip || st.clip;   // 異常補拍後填 clip / still 就會改播實拍
  const done = () => { vid.onended = null; stage.classList.remove("playing"); busy = false; renderStop(); setButtons(); };
  vid.onended = done;
  vid.play().then(() => stage.classList.add("playing")).catch(done);
  stage.onclick = () => { if (stage.classList.contains("playing")) done(); }; // 點畫面可略過
}

function flash(red) {
  const f = document.createElement("div");
  f.className = "layer flash" + (red ? " red" : "");
  $("app").appendChild(f);
  setTimeout(() => f.remove(), 950);
}

function showCard(tag, anomalyId, onClose) {
  const a = ANOMALIES.find((x) => x.id === anomalyId);
  $("cardTag").textContent = tag;
  $("cardTitle").textContent = a.card.title;
  $("cardText").textContent = a.card.text;
  $("card").classList.remove("hidden");
  busy = true; setButtons();
  $("cardOk").onclick = () => { $("card").classList.add("hidden"); busy = false; setButtons(); onClose && onClose(); };
  $("cardOk").focus();
}

function showEnding() {
  const got = new Set(game.seen);
  $("ending").innerHTML = `<h1>6F・出口</h1><p>你走出了六樓。</p><p style="color:var(--dim)">圖鑑 ${got.size} / ${ANOMALIES.length}</p>
    <div class="dex">${ANOMALIES.map((a) => got.has(a.id)
      ? `<div><b>${a.card.title}</b><br>${STATIONS[a.station].name}</div>`
      : `<div class="no">？？？</div>`).join("")}</div>
    <button class="go" style="margin-top:12px" onclick="location.reload()">再走一次</button>`;
  $("ending").classList.remove("hidden");
}

function act(action) {
  if (busy || game.phase === "ending" || !$("start").classList.contains("hidden")) return;
  const ev = step(game, action);
  if ("count" in ev) $("floorNo").textContent = `${ev.count}F`; // 答完立刻更新樓層，不等卡片關掉
  switch (ev.type) {
    case "tour-hint":
      $("tip").textContent = "導覽圈先往前走完，把正常的樣子記起來。"; $("tip").classList.remove("hidden"); return;
    case "move": walk(); return;
    case "tour-done":
      flash(false); $("tip").textContent = "循環開始。記得：覺得不對勁就回頭。"; $("tip").dataset.keep = "1"; $("tip").classList.remove("hidden");
      walk(); return;
    case "correct":
      flash(false); say(ev.voice);
      if (ev.anomaly) showCard("✔ 答對！圖鑑收錄", ev.anomaly, walk); else walk();
      return;
    case "wrong":
      flash(ev.reason === "missed"); say(ev.voice);
      if (ev.reason === "missed") showCard("✘ 你錯過了這個異常（計數歸零）", ev.anomaly, walk); else walk();
      return;
    case "ending":
      flash(false); say(ev.voice);
      if (ev.anomaly) showCard("✔ 答對！圖鑑收錄", ev.anomaly, showEnding); else showEnding();
      return;
  }
}

$("btnBack").onclick = () => act("back");
$("btnFwd").onclick = () => act("forward");
addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowDown"].includes(e.key)) act("back");
  if (["ArrowRight", "ArrowUp"].includes(e.key)) act("forward");
});
$("go").onclick = () => { preloadVoices(); $("start").classList.add("hidden"); walk(); };
renderStop(); prefetch(0);
</script>
</body>
</html>
