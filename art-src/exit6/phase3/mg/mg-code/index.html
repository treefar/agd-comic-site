<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>導管除錯 - EXIT6 小遊戲雛形</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f0d0a;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      background-color: #f4ecd8;
      border: 3px solid #0f0d0a;
      box-shadow: 4px 4px 0 #0f0d0a;
    }
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #result-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 13, 10, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background-color: #f4ecd8;
      border: 3px solid #0f0d0a;
      box-shadow: 6px 6px 0 #0f0d0a;
      padding: 24px 32px;
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .modal-title {
      font-size: 22px;
      font-weight: bold;
      color: #0f0d0a;
      margin-bottom: 12px;
      padding: 6px 12px;
      border: 2px solid #0f0d0a;
    }
    .modal-title.win {
      background-color: #ffd60a;
    }
    .modal-title.lose {
      background-color: #e63946;
      color: #f4ecd8;
    }
    .modal-score {
      font-size: 16px;
      font-weight: bold;
      color: #0f0d0a;
      margin-bottom: 14px;
    }
    .modal-quote {
      font-size: 13px;
      line-height: 1.6;
      color: #0f0d0a;
      margin-bottom: 20px;
      text-align: left;
      background-color: #ece4ce;
      padding: 10px;
      border-left: 4px solid #1d4ed8;
    }
    .replay-btn {
      min-width: 130px;
      min-height: 44px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #ffd60a;
      color: #0f0d0a;
      border: 3px solid #0f0d0a;
      box-shadow: 4px 4px 0 #0f0d0a;
      cursor: pointer;
      user-select: none;
    }
    .replay-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #0f0d0a;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <div id="root"></div>
    <div id="result-modal">
      <div class="modal-card">
        <div id="modal-title" class="modal-title">除錯完成</div>
        <div id="modal-score" class="modal-score">得分：0</div>
        <div class="modal-quote">
          <strong>這就是 Unity／程式 在做的事：</strong><br>
          寫程式就是安排資料流的路徑，先想好流程再動手，比事後除錯省時間。
        </div>
        <button id="replay-btn" class="replay-btn">↻ 再玩一次</button>
      </div>
    </div>
  </div>

  <script src="rules.js"></script>
  <script src="game.js"></script>
  <script>
    (function () {
      var root = document.getElementById('root');
      var modal = document.getElementById('result-modal');
      var modalTitle = document.getElementById('modal-title');
      var modalScore = document.getElementById('modal-score');
      var replayBtn = document.getElementById('replay-btn');

      var currentGame = null;

      function startGame() {
        modal.style.display = 'none';
        if (currentGame) {
          currentGame.destroy();
          currentGame = null;
        }

        currentGame = window.EXIT6_MG['mg-code'].mount(root, {
          rng: Math.random,
          onEnd: function (result) {
            modalTitle.textContent = result.win ? '除錯成功！通關！' : '資料流中斷！挑戰結束';
            modalTitle.className = 'modal-title ' + (result.win ? 'win' : 'lose');
            modalScore.textContent = '最終得分：' + result.score;
            modal.style.display = 'flex';
          }
        });
      }

      replayBtn.addEventListener('click', function () {
        startGame();
      });

      startGame();
    })();
  </script>
</body>
</html>
