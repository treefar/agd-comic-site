<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>繪本跳跳：角色設計</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #0f0d0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      overflow: hidden;
      color: #0f0d0a;
    }
    #stage-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #root {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      position: relative;
      background: #f4ecd8;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    #host-overlay {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(244, 236, 216, 0.95);
      border: 3px solid #0f0d0a;
      box-shadow: 4px 4px 0 #0f0d0a;
      padding: 10px 20px;
      gap: 16px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #host-status {
      font-weight: bold;
      font-size: 14px;
      color: #0f0d0a;
    }
    #host-replay-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 16px;
      background: #ffd60a;
      border: 3px solid #0f0d0a;
      box-shadow: 3px 3px 0 #0f0d0a;
      font-size: 15px;
      font-weight: bold;
      color: #0f0d0a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #host-replay-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #0f0d0a;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <div id="root"></div>
    <div id="host-overlay">
      <div id="host-status">結算中</div>
      <button id="host-replay-btn">再玩一次</button>
    </div>
  </div>

  <script src="./rules.js"></script>
  <script src="./game.js"></script>
  <script>
    (function () {
      var root = document.getElementById('root');
      var hostOverlay = document.getElementById('host-overlay');
      var hostStatus = document.getElementById('host-status');
      var hostReplayBtn = document.getElementById('host-replay-btn');
      var instance = null;

      function start() {
        if (instance && typeof instance.destroy === 'function') {
          instance.destroy();
          instance = null;
        }
        hostOverlay.style.display = 'none';

        var game = window.EXIT6_MG['mg-book'];
        instance = game.mount(root, {
          onEnd: function (res) {
            hostStatus.textContent = (res.win ? '★ 勝利！' : '結束：') + '得分 ' + res.score;
            hostOverlay.style.display = 'flex';
          },
          rng: Math.random
        });
      }

      hostReplayBtn.addEventListener('click', function () {
        start();
      });

      start();
    })();
  </script>
</body>
</html>
