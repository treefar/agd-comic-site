<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D 列印拼裝 - 六樓出口</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f0d0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      padding: 12px;
      overflow: hidden;
    }
    #stage-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      position: relative;
      background: #f4ecd8;
      border: 3px solid #0f0d0a;
      box-shadow: 6px 6px 0 #ffd60a;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
    @media (max-aspect-ratio: 1/1) {
      #stage-container {
        aspect-ratio: 9 / 16;
        max-height: 94vh;
      }
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <div id="root"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./rules.js"></script>
  <script src="./game.js"></script>
  <script>
    (function () {
      const root = document.getElementById("root");
      let activeGame = null;

      function launch() {
        if (activeGame && typeof activeGame.destroy === "function") {
          activeGame.destroy();
          activeGame = null;
        }

        activeGame = window.EXIT6_MG["mg-3d"].mount(root, {
          rng: Math.random,
          onEnd: function (result) {
            // 試玩頁的結果列與「再玩一次」（主控 2026-10-16 補：遊戲內按鈕已移除，重玩由宿主負責）
            var bar = document.getElementById("host-bar");
            if (!bar) {
              bar = document.createElement("div"); bar.id = "host-bar";
              bar.style.cssText = "position:fixed;right:16px;bottom:16px;display:flex;gap:10px;align-items:center;padding:8px 12px;background:#ffd60a;color:#0f0d0a;border:3px solid #0f0d0a;box-shadow:4px 4px 0 #0f0d0a;font:700 15px 'Noto Sans TC','Microsoft JhengHei',sans-serif;z-index:50";
              bar.innerHTML = '<span></span><button type="button" style="min-height:44px;padding:0 14px;font:inherit;background:#1d4ed8;color:#f4ecd8;border:2px solid #0f0d0a;cursor:pointer">再玩一次</button>';
              bar.querySelector("button").addEventListener("click", function () { bar.remove(); launch(); });
              document.body.appendChild(bar);
            }
            bar.querySelector("span").textContent = (result.win ? "完成" : "未完成") + "，得分：" + result.score;
          }
        });
      }

      window.addEventListener("DOMContentLoaded", launch);
    })();
  </script>
</body>
</html>
